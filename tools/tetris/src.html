<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тілашар · фразовый тетрис (тест)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: весёлая аркада Города Айны
   IDEA: тетрис из фраз: кто + слово падают, хвостик снизу их взрывает
   PICTURE: тёмно-зелёная доска в клетку в кремовой рамке
   COLOUR/TYPE: небо и трава города; кто — оранжевый, слово — бежевый, хвостик — синий/розовый, пустые — конфетные; Rubik
   LAYOUT: шапка · Айна · доска · полочка с бонусами */
:root{color-scheme:light;--sky:#0d3b4f;--sky2:#13506a;--aina:#ff8a3d;--hard:#2f6fd6;--soft:#e05a9c;--card:#fffaf0;--line:#e3d3ad;--board:#1d4a3b;--cell:40px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:700 15px/1.3 "Nunito",Arial,sans-serif;color:#14222c;background:linear-gradient(180deg,#bfe6ff 0%,#dff3ff 14%,#a6dc7e 26%,#8fd16a 100%);user-select:none}
.deco{position:fixed;pointer-events:none;z-index:0}
.cl{position:fixed;width:140px;height:40px;border-radius:40px;background:#fff;opacity:.8;z-index:0;animation:cl linear infinite;pointer-events:none}
.cl:before,.cl:after{content:"";position:absolute;background:#fff;border-radius:50%}.cl:before{width:54px;height:54px;left:20px;top:-26px}.cl:after{width:40px;height:40px;left:66px;top:-16px}
@keyframes cl{from{left:-170px}to{left:105%}}
.app{position:relative;z-index:1;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;gap:6px}
.rb{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 19px Rubik,Arial;color:#14222c;box-shadow:0 3px 0 #c9b98f;cursor:pointer;padding:0}
.ttl{flex:1;font:800 21px Rubik,Arial;color:#1d5a70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{flex:none;background:var(--sky2);color:#fff;border-radius:99px;padding:6px 10px;font:800 14px Rubik,Arial;display:flex;gap:5px;align-items:center;white-space:nowrap}
.pl .eb{width:34px;height:7px;border-radius:7px;background:#ffffff33;overflow:hidden}.pl .eb i{display:block;height:100%;width:80%;background:#ffd23f}
.ai{display:flex;align-items:center;gap:6px;margin:6px 0 6px}
.bot{flex:none;width:52px;height:60px;transition:transform .2s}
.bot.hap{animation:hap .5s}.bot.sad{animation:sad .5s}.bot.wow{animation:wow .6s}

.frame.fire{box-shadow:0 0 0 3px #ffb15c,0 0 22px 6px #ff7d2a99,0 4px 0 #d8c69c;animation:fire .5s infinite alternate}
.frame.fire2{box-shadow:0 0 0 4px #ff8a3d,0 0 34px 12px #ff5a1fbb,0 4px 0 #d8c69c}
@keyframes fire{to{box-shadow:0 0 0 4px #ffd23f,0 0 30px 10px #ff7d2acc,0 4px 0 #d8c69c}}
.tbar{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}
.tbar .tr{flex:1;height:10px;border-radius:10px;background:#e9dcc0;overflow:hidden}.tbar .tr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:10px;transform-origin:left}
.tbar span{font:800 13px Rubik;color:#5d7483;white-space:nowrap}
.bw{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.board{position:relative;border-radius:18px;overflow:hidden;background-color:var(--board);background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:var(--cell) var(--cell);background-position:0 100%;box-shadow:inset 0 2px 10px #0006}
.board.slow{background-color:#1d3f5a}

.edge.warn{opacity:1;animation:bl .5s infinite alternate}@keyframes bl{to{opacity:.35}}
.bk{position:absolute;height:calc(var(--cell) - 2px);border-radius:9px;z-index:2;will-change:bottom}
.bk.f{box-shadow:inset 0 -4px 0 #0003,inset 0 2px 0 #ffffff80}
.bk.f.fall:after{content:"";position:absolute;left:4px;right:4px;bottom:100%;height:46px;background:linear-gradient(180deg,#fff0,#ffffff22);border-radius:6px}
.bk.ph{display:flex;gap:2px;cursor:pointer}

.bk .m{background:linear-gradient(180deg,#fffdf6,#ffe7c2);color:#3a2a14}.bk .m i{font-style:normal;color:#fff;border-radius:6px;padding:0 4px;margin-left:2px}.bk .m i.h{background:var(--hard)}.bk .m i.s{background:var(--soft)}
.bk.ok{animation:ok .3s}.bk.ok>span{box-shadow:0 0 0 3px #4cd964,0 0 18px #4cd964}
@keyframes ok{50%{transform:scale(1.05)}}
.bk.bad{animation:bad .4s}.bk.bad>span{box-shadow:0 0 0 3px #ff3b30,0 0 16px #ff3b30}
@keyframes bad{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bk.boom{animation:boom .38s ease-in forwards}@keyframes boom{40%{transform:scale(1.12);filter:brightness(1.6)}100%{transform:scale(.2);opacity:0}}
.bk.slam{filter:brightness(1.25)}.bk.land{animation:land .25s}@keyframes land{40%{transform:scaleY(.86)}}
.plate{position:absolute;left:50%;z-index:5;transform:translateX(-50%);background:#fffaf0;border:2px solid #ffd23f;color:#14222c;border-radius:14px;padding:6px 12px;font:800 16px Rubik,Arial;white-space:nowrap;box-shadow:0 6px 16px #0005;pointer-events:none;animation:pl 1.3s ease-out forwards;text-align:center}

.panel{margin-top:8px;background:var(--card);border-radius:22px;padding:8px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #d8c69c}
.bs{flex:none;display:flex;flex-direction:column;gap:8px}
.bo{position:relative;width:46px;height:46px;border:0;border-radius:50%;background:linear-gradient(180deg,#3fc79a,#1f9e78);box-shadow:0 4px 0 #157358;font-size:22px;cursor:pointer;padding:0}

.tl{border:0;border-radius:13px;padding:11px 2px;font:800 18px Rubik,Arial;color:#fff;cursor:pointer;white-space:nowrap}

.tl.h{background:linear-gradient(180deg,#5b93ec,#2f6fd6);box-shadow:0 4px 0 #1f4f9e,inset 0 2px 0 #ffffff50}
.tl.s{background:linear-gradient(180deg,#f08bbb,#e05a9c);box-shadow:0 4px 0 #a8356d,inset 0 2px 0 #ffffff50}
.tl.z{background:linear-gradient(180deg,#aab4bf,#8d99a6);box-shadow:0 4px 0 #5f6a75}
.tl.new{animation:pop .3s}.tl.bad{animation:bad .4s;box-shadow:0 0 0 3px #ff3b30}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.ov{position:fixed;inset:0;background:#0d3b4fcc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov.off{display:none}
.card{background:#fffaf0;border-radius:24px;padding:18px 16px;max-width:380px;width:100%;max-height:92vh;overflow:auto;text-align:center;animation:pop .3s}
.card h2{font:800 26px Rubik;margin:4px 0}
.card p{margin:6px 0 10px;font-size:15px}
.rules{text-align:left;margin:8px 0 12px;display:grid;gap:6px;font-size:15px}
.rules div{display:flex;gap:8px;align-items:center}.rules b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--aina);color:#fff;display:grid;place-items:center;font:800 13px Rubik}
.go{width:100%;border:0;border-radius:16px;padding:14px;background:#2fb37a;color:#fff;font:800 19px Rubik;box-shadow:0 4px 0 #1f8a5b;cursor:pointer}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.res div{background:#fff3e2;border-radius:12px;padding:6px 2px;font-size:12px;color:#5d7483}.res b{display:block;font:800 20px Rubik;color:#14222c}
.got{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin:6px 0 12px;max-height:200px;overflow:auto;font-size:14px}
.got div{padding:3px 0;border-bottom:1px solid #f1e8d6}.got div:last-child{border:0}.got .kk{color:var(--hard);font-weight:800}
@media (max-width:360px){.tl{font-size:16px;padding:10px 1px}.bo{width:40px;height:40px;font-size:19px}.pl{padding:5px 8px;font-size:13px}.ttl{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.panel{flex-direction:column;align-items:stretch;gap:8px;padding:8px 8px 10px}
.brow{display:flex;justify-content:center;gap:18px;padding-top:4px}
.brow .bo{width:40px;height:40px;font-size:19px}
.shelf{width:100%}
.tl{padding:12px 4px;font-size:20px;overflow:hidden;text-overflow:clip}
.bub{min-height:0;padding:5px 10px}.bub span,.bub small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ttl{min-width:0}
.tbar{flex:none}
@media (max-width:360px){.ttl{display:none}}
.frame.danger{box-shadow:0 0 0 4px #ff3b30,0 0 26px 8px #ff3b3099,0 4px 0 #d8c69c!important;animation:dg .5s infinite alternate!important}
@keyframes dg{to{box-shadow:0 0 0 4px #ff8a80,0 0 12px 3px #ff3b3055,0 4px 0 #d8c69c}}
.brow{gap:40px}

.hd{gap:5px}.hd .bot{width:34px;height:40px;flex:none}.hd .bot svg{width:34px;height:40px}
.hd .ttl{flex:1}
.say{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 12px;font:800 15px Rubik,Arial;white-space:nowrap;box-shadow:0 4px 10px #0004;pointer-events:none;animation:tip 1.3s ease-out forwards}
.frame{margin-top:6px;padding:6px}
.tbar{gap:6px;padding:0 2px 6px;align-items:center}
.tbar .bo{width:36px;height:36px;font-size:17px;flex:none}

.shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 auto}

.bo small.t{background:#2f6fd6;color:#fff}

.demo{display:flex;justify-content:center;gap:4px;margin:4px 0 16px}
.dc{border-radius:9px;padding:7px 12px;font:800 18px Rubik,Arial}
.dc.p{background:linear-gradient(180deg,#ffab6b,#ff7d2a);color:#fff;box-shadow:inset 0 -4px 0 #c75c14}

#start .card h2{font-size:clamp(22px,7vw,28px)}
</style></head><body>

 <div class="hd"><button class="rb" id="back" aria-label="Назад">←</button><div class="bot" id="bot">__ROBOT__</div><div class="ttl"></div>

<script>
{
const COMBOS=__COMBOS__;
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms)),pick=a=>a[Math.random()*a.length|0];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PERS={'Мен':'«я»','Сен':'«ты»','Сіз':'«вы» (вежливо)','Біз':'«мы»','Сендер':'«вы» (все)','Сіздер':'«вы» (вежливо, много)'};
const PRU={'Мен':'я','Сен':'ты','Сіз':'вы','Біз':'мы','Ол':'он / она','Сендер':'вы (все)','Сіздер':'вы','Олар':'они'};
const PRONS=['Мен','Сен','Біз','Сіз','Ол','Сендер','Сіздер','Олар'];

 switch(p){case 'Мен':return (vl?'п':bz?'б':'м')+(soft?'ін':'ын');case 'Біз':return (vl?'п':bz?'б':'м')+(soft?'із':'ыз');
  case 'Сен':return soft?'сің':'сың';case 'Сіз':return soft?'сіз':'сыз';case 'Сендер':return soft?'сіңдер':'сыңдар';case 'Сіздер':return soft?'сіздер':'сыздар';default:return ''}}
const NONE='∅',isSoft=t=>/[әеіөү]/.test(t);
const TAILP={};Object.keys(PERS).forEach(q=>['бала','суретші','дос','қыз','ұстаз','дәрігер','әнші','қонақ'].forEach(w=>{TAILP[tailOf(q,w)]=q}));
const FILLC=['#ffc928','#4cc96a','#9b6bff','#22c4c9','#7ed957'];
const COLS=8,ROUND=120,BOOST={bomb:5,shield:5,hint:3,slow:3};
/* ---------- хранилище ---------- */
function lg(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}function ls(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
let COINS=parseInt(lg('tilashar-coins-v2','10'),10);if(isNaN(COINS))COINS=10;let SOUND=lg('tilashar-tet-snd','1')==='1';
/* ---------- звуки (синтез) ---------- */
let AC=null;function ac(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return AC}
