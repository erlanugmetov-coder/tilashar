<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тілашар · птички (тест)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый, детский, как Город Айны
   IDEA: ветки во дворе, на них птички с кубиками-словами
   PICTURE: сами ветки и птички — это и есть игра
   COLOUR/TYPE: небо, кора, кубики синие/розовые; Rubik + Nunito
   LAYOUT: шапка, пузырь Айны, ветки одна под другой, кнопки внизу */
:root{color-scheme:light;--ink:#14222c;--muted:#5d7483;--hard:#2f6fd6;--soft:#e05a9c;--aina:#ff8a3d;--bark:#7a4a2a;--bark2:#5e3820}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{margin:0;font:700 15px/1.4 "Nunito",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe6ff 0%,#e6f6ff 45%,#fff6e3 100%);min-height:100vh;overflow-x:clip;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:12px 10px 120px}
.top{display:flex;align-items:center;gap:10px}
.lvl{flex:1}
.lvl b{display:block;font:800 21px/1.1 "Rubik",Arial,sans-serif}
.lvl small{color:var(--muted);font-size:13px}
.pill{background:#fff;border-radius:99px;padding:6px 12px;font:800 15px "Rubik",Arial;box-shadow:0 2px 0 #d9c9a5;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.tab{border:0;border-radius:12px;padding:8px 11px;background:#ffffffb3;font:800 13px "Nunito",Arial;color:var(--ink);cursor:pointer}
.tab.on{background:var(--aina);color:#fff;box-shadow:0 3px 0 #d96a1f}
.say{display:flex;gap:8px;align-items:flex-start;margin:8px 0 6px;min-height:58px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 2px 0 #c9b98f}
.bub{background:#fff;border-radius:4px 16px 16px 16px;padding:9px 12px;font-size:15px;box-shadow:0 2px 0 #e3d6b6;flex:1}
.bub .kk{color:var(--hard);font-weight:800}
.tree{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px}
.br{position:relative;height:var(--bh,112px);margin:4px 0;cursor:pointer;border-radius:16px;transition:background .2s}
.br.sel{background:#ffffff66}
.br .wood{position:absolute;bottom:30px;height:14px;border-radius:8px;background:linear-gradient(180deg,var(--bark),var(--bark2));box-shadow:0 3px 0 #3d2414}
.br.L .wood{left:-12px;right:2%;border-radius:0 8px 8px 0}.br.R .wood{right:-12px;left:2%;border-radius:8px 0 0 8px}
.br .wood:after{content:"";position:absolute;top:6px;width:40px;height:8px;border-radius:8px;background:var(--bark2)}
.br.L .wood:after{right:14%;transform:rotate(16deg);transform-origin:left}.br.R .wood:after{left:14%;transform:rotate(-16deg);transform-origin:right}
.br .tag{position:absolute;bottom:4px;font:800 13px "Nunito";color:var(--muted)}.br.L .tag{left:8px}.br.R .tag{right:8px}
.slots{position:absolute;bottom:38px;display:flex;gap:3px;width:calc(98% - 6px)}
.br.L .slots{left:4px;flex-direction:row}.br.R .slots{right:4px;flex-direction:row-reverse}
.bird{position:relative;width:calc((100% - 6px)/3);max-width:96px;display:flex;flex-direction:column;align-items:center;transition:transform .25s}
.bird svg{width:48px;height:42px;display:block;overflow:visible}
.face{display:block;transform-origin:50% 90%}
.br.R .face,.flyer .face.fl{transform:scaleX(-1)}
.bsv{transform-origin:50% 90%;animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.bsv .tuck{display:none}.flyer .bsv .legs{display:none}.flyer .bsv .tuck{display:block}.flyer.landing .bsv .legs{display:block}.flyer.landing .bsv .tuck{display:none}
.bsv .wgf,.bsv .wgb{transform-box:fill-box;transform-origin:18% 85%}
.flyer .bsv{animation:none}.flyer .wgf{animation:flapF .12s infinite alternate ease-in-out}.flyer .wgb{animation:flapB .12s infinite alternate ease-in-out}.flyer .shd{display:none}
@keyframes flapF{from{transform:rotate(22deg)}to{transform:rotate(-75deg)}}
@keyframes flapB{from{transform:rotate(34deg)}to{transform:rotate(-55deg)}}
.bird.edge .face{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 2px #fff)}
.bird.up .face{translate:0 -16px;transition:translate .2s}
.bird.say .face{filter:drop-shadow(0 0 7px #ffb15c)}
.bird.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bird .eye{transform-box:fill-box;transform-origin:center}
.bird.blink .eye{animation:blink .22s}
@keyframes blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.bird.hop .face{animation:hop .38s ease-out}
@keyframes hop{0%,100%{translate:0 0}40%{translate:0 -11px}}
.bird.squash .face{animation:squash .42s ease-out}
@keyframes squash{0%{scale:1.16 .8}45%{scale:.93 1.1}75%{scale:1.03 .97}100%{scale:1 1}}
.bird.crouch .face{scale:1.12 .84;transition:scale .12s}
#sky{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.flyer{position:fixed;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.flyer .cube{transform:scale(.92)}
.leaf{position:fixed;pointer-events:none;font-size:16px;z-index:8;animation:leaf 1.4s ease-out forwards}
@keyframes leaf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.clouds i{position:absolute;display:block;width:150px;height:44px;border-radius:44px;background:#fff;opacity:.75;animation:cloud linear infinite}
.clouds i:before,.clouds i:after{content:"";position:absolute;background:#fff;border-radius:50%}
.clouds i:before{width:60px;height:60px;left:22px;top:-28px}.clouds i:after{width:46px;height:46px;left:72px;top:-18px}
.clouds i:nth-child(1){top:12%;animation-duration:70s;animation-delay:-20s}.clouds i:nth-child(2){top:38%;transform:scale(.7);animation-duration:95s;animation-delay:-60s;opacity:.55}.clouds i:nth-child(3){top:66%;transform:scale(.85);animation-duration:85s;animation-delay:-5s;opacity:.5}
@keyframes cloud{from{left:-180px}to{left:105%}}
.wrap{position:relative;z-index:1}
.cube{display:inline-flex;flex-direction:column;align-items:stretch;border-radius:8px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.15);margin-top:-5px;max-width:100%}
.cube span{display:block;text-align:center;padding:1px 4px;font:800 12px/1.15 "Rubik",Arial;white-space:nowrap}
.cube .r{background:#efe6d2}.cube .h{background:var(--hard);color:#fff;font-size:13px}.cube .s{background:var(--soft);color:#fff;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#fff7e6f2;box-shadow:0 -4px 14px #0002}
.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{border:0;border-radius:14px;padding:10px 2px;line-height:1.15;background:#fde8cf;color:#8a4a10;font:800 15px "Nunito",Arial;box-shadow:0 3px 0 #e2c39b;cursor:pointer}
.btn:disabled{opacity:.45}
.btn small{display:inline-block;margin-left:4px;background:#e2574c;color:#fff;border-radius:99px;padding:0 6px;font-size:12px}
.win{position:fixed;inset:0;background:#0d3b4fcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.win.on{display:flex}
.card{background:#fffaf0;border-radius:24px;padding:20px 16px;max-width:360px;width:100%;text-align:center;animation:pop .35s}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.card h2{font:800 26px "Rubik";margin:6px 0}
.stars{font-size:38px;letter-spacing:6px}
.card p{margin:8px 0 14px}
.card .go{width:100%;border:0;border-radius:16px;padding:14px;background:#2fb37a;color:#fff;font:800 17px "Nunito";box-shadow:0 4px 0 #1f8a5b;cursor:pointer}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}


/* --- экран 1: подготовка --- */
.hero{text-align:center;margin:4px 0 10px}.hero h1{font:800 26px/1.1 "Rubik",Arial;margin:0}.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.lvcards{display:grid;gap:8px}
.lvc{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:10px 12px;background:#ffffffc4;text-align:left;font:700 14px "Nunito",Arial;color:var(--ink);box-shadow:0 2px 0 #d9c9a5;cursor:pointer}
.lvc .n{flex:none;width:34px;height:34px;border-radius:50%;background:#fff3e2;color:#d96a1f;display:grid;place-items:center;font:800 18px "Rubik"}
.lvc b{display:block;font:800 16px "Rubik",Arial}.lvc small{color:var(--muted);font-size:13px}
.lvc.on{background:var(--aina);color:#fff;box-shadow:0 3px 0 #d96a1f}.lvc.on small{color:#fff}.lvc.on .n{background:#fff}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:6px 0 4px}
.chip{border:0;background:#fff;border-radius:12px;padding:7px 10px;font:700 14px "Nunito",Arial;color:var(--ink);box-shadow:0 2px 0 #e3d6b6;text-align:left;cursor:pointer}
.chip .kk{font-weight:800}.chip .kk .t{color:#fff;border-radius:5px;padding:0 3px;margin-left:1px}.t.h{background:var(--hard)}.t.s{background:var(--soft)}
.play{display:block;width:100%;margin:14px 0 6px;border:0;border-radius:18px;padding:16px;background:#2fb37a;color:#fff;font:800 20px "Rubik",Arial;box-shadow:0 5px 0 #1f8a5b;cursor:pointer}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #1f8a5b}
/* --- экран 2: игра --- */
#game{display:none;position:fixed;inset:0;z-index:1;flex-direction:column}
body.playing #game{display:flex}body.playing #intro{display:none}
.gtop{display:flex;align-items:center;gap:8px;padding:10px 10px 4px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.back{flex:none;border:0;width:40px;height:40px;border-radius:50%;background:#fff;font:800 20px "Rubik";color:var(--ink);box-shadow:0 2px 0 #d9c9a5;cursor:pointer}
.gtop .lvl b{font-size:18px}.gtop .lvl small{font-size:12px}
.gmid{flex:1;min-height:0;overflow-y:auto;overflow-x:clip;max-width:520px;width:100%;margin:0 auto;padding:0 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;position:relative}
.gbar{max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;justify-content:center;gap:14px;padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
.gb{position:relative;border:0;width:54px;height:54px;border-radius:50%;background:#fde8cf;font-size:24px;box-shadow:0 3px 0 #e2c39b;cursor:pointer}
.gb:disabled{opacity:.4}
.gb small{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;line-height:20px;border-radius:99px;background:#e2574c;color:#fff;font:800 12px "Rubik"}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,8px);width:min(500px,calc(100% - 24px));box-sizing:border-box;display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;box-shadow:0 4px 14px #0003;opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast .av{width:32px;height:32px;font-size:20px;box-shadow:none}.toast .kk{color:var(--hard);font-weight:800}
.feather{position:fixed;pointer-events:none;font-size:18px;z-index:8;animation:fth 1.2s ease-out forwards}
@keyframes fth{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (max-width:360px){.wrap{padding-left:6px;padding-right:6px}.tree{column-gap:8px}.slots{gap:1px;width:calc(100% - 2px)}.bird{width:calc((100% - 2px)/3)}.cube span{padding:1px 2px}.bird svg{width:40px;height:36px}}
@media (prefers-reduced-motion:reduce){.bird,.card,.bsv,.face,.feather,.leaf,.clouds i{animation:none!important;transition:none!important}}

/* --- v6: настоящие ветки, колонки, пёрышки --- */
.tree{align-items:stretch}
.col{display:flex;flex-direction:column;justify-content:center;min-width:0}
.col.R{padding-top:calc(var(--bh,112px)/2)}.col.L{padding-bottom:calc(var(--bh,112px)/2)}
.br{margin:1px 0}
.br .wood{background:none!important;box-shadow:none!important;border-radius:0!important;bottom:22px;height:34px}
.br .wood:after{display:none!important}
.br.L .wood{left:-10px;right:0}.br.R .wood{right:-10px;left:0}
.br .wood svg{display:block;width:100%;height:100%;overflow:visible}
.br.grow .wood{animation:grow .55s cubic-bezier(.3,1.4,.5,1)}.br.L.grow .wood{transform-origin:0 50%}.br.R.grow .wood{transform-origin:100% 50%}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.piece{position:fixed;pointer-events:none;z-index:8}.piece svg{display:block;width:100%;height:100%;overflow:visible}
.cpop{position:fixed;z-index:8;pointer-events:none;margin:0;animation:cpop .5s ease-out forwards}
@keyframes cpop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(.1);opacity:0}}
.tg{flex:none;border:0;width:36px;height:36px;border-radius:50%;background:#fff;font-size:17px;box-shadow:0 2px 0 #d9c9a5;cursor:pointer;padding:0}
.tg.off{opacity:.45}
.gtop .lvl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .pill{padding:6px 9px}
.gb small.cost{min-width:0;width:auto;padding:0 5px;right:-10px;background:#8a5cf6}
.gb.need{opacity:.55}
.gain{display:inline-block;margin-top:8px;background:#f3ecff;color:#6a3fd1;border-radius:99px;padding:3px 12px;font-weight:800}
.hero .fea{display:inline-block;margin-top:6px;background:#fff;border-radius:99px;padding:3px 12px;font-weight:800;box-shadow:0 2px 0 #d9c9a5}
.gmid{justify-content:flex-start!important}.tree{margin:auto 0}
@media (max-width:370px){.gtop{gap:5px;padding-left:6px;padding-right:6px}.gtop .lvl b{font-size:15px;white-space:nowrap}.gtop .lvl small{font-size:11px}.tg{width:32px;height:32px;font-size:15px}.gtop .pill{padding:5px 7px;font-size:13px}.back{width:34px;height:34px;font-size:17px}}
</style></head><body>
<div class="clouds"><i></i><i></i><i></i></div><div id="sky"></div>
<div class="wrap" id="intro">
  <div class="hero"><h1>🐦 Рассади птичек</h1><p>Собери одинаковые хвостики — птички улетят, а ветка сломается</p><div class="fea">🪶 <span id="ifea">0</span> · ветка 🌿 = 5 🪶</div></div>
  <div class="lvcards" id="lvcards"></div>
  <div class="say"><div class="av">🤖</div><div class="bub" id="ibub"></div></div>
  <div class="chips" id="chips"></div>
  <button class="play" id="play">Играть ▶</button>
  <div class="note">Тест мини-игры v6 · нажми на хвостик, чтобы услышать 🔊</div>
</div>
<div id="game">
  <div class="gtop"><button class="back" id="back" aria-label="Назад к уровням">←</button><div class="lvl"><b id="lt">Уровень 1</b><small id="ls"></small></div><div class="pill">👣 <span id="mv">0</span></div><div class="pill">🪶 <span id="fe">0</span></div><button class="tg" id="tmus" aria-label="Музыка">🎵</button><button class="tg" id="tvoi" aria-label="Голос">🗣️</button></div>
  <div class="gmid" id="gmid"><div class="tree" id="tree"></div></div>
  <div class="gbar">
    <button class="gb" id="undo" aria-label="Назад">↩️<small id="un">3</small></button>
    <button class="gb" id="add" aria-label="Ветка за 5 пёрышек">🌿<small class="cost">5🪶</small></button>
    <button class="gb" id="mix" aria-label="Смешать">🔀<small id="mx">2</small></button>
    <button class="gb" id="again" aria-label="Заново">🔄</button>
  </div>
</div>
<div class="toast" id="toast"><div class="av">🤖</div><div id="bub"></div></div>
<div class="win" id="win"><div class="card"><div style="font-size:46px">🎉</div><h2>Жарайсың!</h2><div class="stars" id="stars">⭐⭐⭐</div><p id="wt"></p><button class="go" id="next">Дальше →</button></div></div>
<script>
{
const SND = __SND__;
/* ---------- стайки (хвостики) ---------- */
const C={
 kuda:{k:'➡️ куда',say:'Все летят КУДА! ➡️',w:[['үй','ге'],['мектеп','ке'],['саябақ','қа']]},
 gde:{k:'📍 где',say:'Все уже ЗДЕСЬ — где! 📍',w:[['үй','де'],['мектеп','те'],['қала','да']]},

 chey:{k:'🔗 чей?',say:'Это всё ЧЕЙ? — хвостик хозяина 🔗',w:[['Айна','ның'],['бала','ның'],['Алтай','дың']]},
 chto:{k:'🔍 что?',say:'Вот эта вещь — ЧТО? 🔍',w:[['алма','ны'],['кітап','ты'],['су','ды']]},
 skem:{k:'🤝 с кем? чем?',say:'Все С КЕМ? ЧЕМ? 🤝',w:[['әже','мен'],['дос','пен'],['автобус','пен']]},
 moy:{k:'💛 мой',say:'Это всё МОЁ! 💛',w:[['ана','м'],['дос','ым'],['үй','ім']]},

};
const LV=[
 {t:'Уровень 1',s:'➡️ куда · 📍 где',c:['kuda','gde'],spare:2,need:4,

 {t:'Уровень 2',s:'+ ⬅️ откуда',c:['kuda','gde','otk'],spare:2,need:7,

 {t:'Уровень 3',s:'+ 🔗 чей?',c:['kuda','gde','otk','chey'],spare:2,need:10,
  hello:'Новая стайка: 🔗 чей? <span class="kk">Айнаның</span> — Айны 😎 Собрал стайку — ветка ломается, птички улетают!'},
 {t:'Уровень 4',s:'Связи: 6 стаек',c:['kuda','gde','otk','chey','chto','skem'],spare:2,
  hello:'Связи! 6 стаек: куда, где, откуда, 🔗 чей, 🔍 что, 🤝 с кем. Дерево растёт 🌳'},
 {t:'Уровень 5',s:'Мой · твой · его: 8 стаек',c:['moy','tvoy','ego','mnogo','chey','kuda','gde','otk'],spare:2,
  hello:'Тема «Менің»! 💛 мой (<span class="kk">анам</span>), 👉 твой (<span class="kk">анаң</span>), 👤 его (<span class="kk">анасы</span>), 🐦🐦 много (<span class="kk">балалар</span>). Хитрость: <span class="kk">Айнаның</span> — это «чей» 😉'},
 {t:'Уровень 6',s:'🌳 Большое дерево: 10 стаек',c:['kuda','gde','otk','chey','chto','skem','moy','tvoy','ego','mnogo'],spare:2,
  hello:'Большое дерево! 🌳 10 стаек, 30 птичек. Все хвостики вместе — ты справишься 💪'}
];

function woodSVG(w,side,key){const h=34,R=rnd(key),tip=w-4,cy=x=>18-2.5*Math.sin(Math.PI*x/w)+1.5*(x/w),th=x=>15-11.5*(x/w);

 for(let i=N;i>=0;i--){const x=tip*i/N;bot+=`L${x.toFixed(1)} ${(cy(x)+th(x)/2).toFixed(1)} `}
 const fx=w*(.62+R()*.1),fy=cy(fx)+th(fx)*.2,fx2=Math.min(w-2,fx+w*.2),fy2=31;
 const ux=w*(.3+R()*.12),uy=cy(ux)-th(ux)*.3;
 const bark=[.35,.6].map((o,j)=>{let d='';for(let i=0;i<=8;i++){const x=w*.04+(tip*.75)*i/8;d+=`${i?'L':'M'}${x.toFixed(1)} ${(cy(x)-th(x)/2+th(x)*o+Math.sin(i*1.7+j)*.8).toFixed(1)} `}return `<path d="${d}" stroke="${j?'#4e2e18':'#a06a3e'}" stroke-width="1.1" fill="none" opacity=".55" stroke-linecap="round"/>`}).join('');
 const kx=w*(.16+R()*.1),lf=(x,y,a,s)=>`<path d="M0 0 Q${5*s} ${-6*s} ${12*s} 0 Q${5*s} ${4*s} 0 0Z" fill="#5fb84a" stroke="#3f8a33" stroke-width=".8" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a})"/>`;
 const g=`<path d="${top}${bot}Z" fill="#3d241455" transform="translate(0 3)"/>
 <path d="${top}${bot}Z" fill="url(#bk${key})"/>
 <path d="M${fx.toFixed(1)} ${(fy-2).toFixed(1)} Q${(fx+(fx2-fx)*.5).toFixed(1)} ${(fy+2).toFixed(1)} ${fx2.toFixed(1)} ${fy2} L${(fx2-2).toFixed(1)} ${fy2+1.5} Q${(fx+(fx2-fx)*.45).toFixed(1)} ${(fy+5).toFixed(1)} ${(fx-5).toFixed(1)} ${(fy+1.5).toFixed(1)}Z" fill="#5e3820"/>
 <path d="M${ux.toFixed(1)} ${(uy+2).toFixed(1)} Q${(ux+8).toFixed(1)} ${(uy-5).toFixed(1)} ${(ux+16).toFixed(1)} ${(uy-9).toFixed(1)} L${(ux+15).toFixed(1)} ${(uy-7).toFixed(1)} Q${(ux+8).toFixed(1)} ${(uy-2).toFixed(1)} ${(ux+5).toFixed(1)} ${(uy+3).toFixed(1)}Z" fill="#6b4226"/>
 ${bark}<ellipse cx="${kx.toFixed(1)}" cy="${cy(kx).toFixed(1)}" rx="3.2" ry="2.2" fill="#4a2a15"/><ellipse cx="${kx.toFixed(1)}" cy="${(cy(kx)-.4).toFixed(1)}" rx="1.6" ry="1" fill="#8d5a35"/>
 ${lf(ux+15,uy-8,-40-R()*20,1)}${lf(tip-2,cy(tip)-1,-15+R()*20,.9)}${lf(fx2-1,fy2,40+R()*20,.8)}`;
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="bk${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6538"/><stop offset=".5" stop-color="#7a4a2a"/><stop offset="1" stop-color="#55331c"/></linearGradient></defs>${side==='R'?`<g transform="translate(${w} 0) scale(-1 1)">${g}</g>`:g}</svg>`}
function brHTML(i){const br=state[i],m=meta[i],tg=sel===i?topGroup(br):0;
 return `<div class="br ${m.s} ${i===sel?'sel':''} ${m.grow?'grow':''}" data-i="${i}" data-k="${m.k}"><div class="wood"></div><div class="tag">${br.length?'':'пусто'}</div><div class="slots">${br.map((b,j)=>{const w=b.w,hc=hard(w[0]+w[1])?'h':'s';
   return `<div class="bird ${j===br.length-1?'edge':''} ${tg&&j>=br.length-tg?'up':''}" data-b="${b.id}" style="${HIDE.has(b.id)?'visibility:hidden':''}"><div class="face" style="--d:-${(b.id*0.37)%2.6}s">${birdSVG(b.col)}</div><div class="cube"><span class="r">${w[0]}</span><span class="${hc}">${w[1]}</span></div></div>`}).join('')}</div></div>`}
function render(){$('mv').textContent=moves;$('fe').textContent=FEA;$('un').textContent=undoLeft;$('mx').textContent=mixLeft;$('undo').disabled=!undoLeft||!hist.length;$('mix').disabled=!mixLeft;
 $('add').classList.toggle('need',FEA<BRANCH_COST);
 sizeTree();const cols={L:[],R:[]};state.forEach((b,i)=>cols[meta[i].s].push(i));
 $('tree').innerHTML=['L','R'].map(sd=>`<div class="col ${sd}">${cols[sd].map(brHTML).join('')}</div>`).join('');
 meta.forEach(m=>{delete m.grow});
 $('tree').querySelectorAll('.br').forEach(el=>{el.onclick=()=>tap(+el.dataset.i);const wd=el.querySelector('.wood');wd.innerHTML=woodSVG(Math.max(60,Math.round(wd.clientWidth)),el.classList.contains('L')?'L':'R',+el.dataset.k)});fitWords()}
function fitWords(){$('tree').querySelectorAll('.bird').forEach(b=>{const max=b.clientWidth;b.querySelectorAll('.cube span').forEach(sp=>{let f=parseFloat(getComputedStyle(sp).fontSize);while(sp.scrollWidth>max&&f>9){f-=.5;sp.style.fontSize=f+'px'}})})}
addEventListener('resize',()=>{try{if(state&&document.body.classList.contains('playing')&&!busy)render()}catch(e){}});
function birdEl(id){return $('tree').querySelector(`[data-b="${id}"]`)}
function tap(i){initAudio();if(busy)return;const br=state[i];
 if(sel<0){if(!br.length){aina('Эта ветка пустая — сначала выбери птичку 🐦');return}
  sel=i;render();SFX.chirp();const g=topGroup(br),grp=br.slice(br.length-g);grp.forEach(x=>{const e=birdEl(x.id);if(e){e.classList.add('hop');setTimeout(()=>e.classList.remove('hop'),360)}});
  const top=br[br.length-1],te=birdEl(top.id);if(te){te.classList.add('say');setTimeout(()=>te&&te.classList.remove('say'),700)}sayList([wordOf(top)]);return}
 if(sel===i){sel=-1;render();return}
 const n=canMove(state,sel,i);
 if(n){hist.push(snap());const f=sel;sel=-1;const mv=state[f].slice(state[f].length-n).reverse(),before={};mv.forEach(x=>{const e=birdEl(x.id);if(e)before[x.id]=e.getBoundingClientRect()});
  for(let k=0;k<n;k++)state[i].push(state[f].pop());moves++;mv.forEach(x=>HIDE.add(x.id));busy=true;render();
  (async()=>{await flyMove(mv.map(x=>x.id),before,i);
   if(full1(state[i])){const grp=state[i].slice(),c=cats[grp[0].c],words=grp.map(wordOf);aina(c.say+' <span class="kk">'+words.join(', ')+'</span> 🐦💨');SFX.chirp();
    sayList(words,60);await flyAway(i,grp);await breakBranch(i);const key=meta[i].k;flipRender(()=>{const j=meta.findIndex(m=>m.k===key);state.splice(j,1);meta.splice(j,1)});busy=false;checkWin()}
   else{busy=false;if(n>1)aina('Стайка из '+n+' полетела вместе! 🐦🐦')}})();}
 else{const from=state[sel],b=from[from.length-1],el=birdEl(b.id);if(el){el.classList.remove('up');el.classList.add('shake')}SFX.buzz();
  const why=state[i].length>=cap?'На этой ветке нет места 🙈':JOKES[Math.random()*JOKES.length|0];aina(why);setTimeout(()=>{sel=-1;render()},420)}}
function checkWin(){if(state.some(b=>b.length))return;const lv=LV[L];
 const best=lv.bestN||cats.length*2,small=cats.length<=4;const st=small?(moves<=best+1?3:moves<=best+4?2:1):(moves<=best?3:moves<=Math.ceil(best*1.35)?2:1);
 FEA+=st;lsSet(FK,FEA);
 setTimeout(()=>{SFX.win();$('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('wt').innerHTML=`Все птички улетели! 🐦💨 Ходов: <b>${moves}</b>.<br>${st===3?'Идеально! Ты мастер хвостиков 😎':st===2?'Отлично! Можно ещё быстрее 💪':'Получилось! Попробуй за меньше ходов 😉'}<br><span class="gain">+${st} 🪶 · у тебя ${FEA} 🪶</span>`;
  $('next').textContent=L<LV.length-1?'Дальше →':'Сыграть снова 🔄';$('win').classList.add('on')},350)}
$('undo').onclick=()=>{if(busy||!undoLeft||!hist.length)return;HIDE.clear();const h=hist.pop();state=h.s;meta=h.m;undoLeft--;sel=-1;render();aina('Вернула птичек назад ↩️')};
$('add').onclick=()=>{if(busy)return;if(FEA<BRANCH_COST){aina(`Новая ветка стоит ${BRANCH_COST} 🪶. У тебя ${FEA} 🪶 — пёрышки дают за победу ⭐`);return}
 if(state.length>=14){aina('Дерево и так большое 🌳');return}
 FEA-=BRANCH_COST;lsSet(FK,FEA);const [l,r]=colCount();state.push([]);meta.push({k:++KEY,s:l<=r?'L':'R',grow:true});sel=-1;render();SFX.chirp();aina(`Новая ветка выросла! 🌿 −${BRANCH_COST} 🪶`)};
$('mix').onclick=()=>{if(busy||!mixLeft)return;const sizes=state.map(b=>b.length),all=[].concat(...state);
 for(let t=0;t<200;t++){const sh=shuffled(all);let k=0;const ns=sizes.map(n=>{const r=sh.slice(k,k+n);k+=n;return r});if(ns.some(full1))continue;const ok=cats.length<=4?minMoves(ns)>=0:!!solvePath(ns,20000);
  if(ok){hist.push(snap());state=ns;mixLeft--;sel=-1;render();aina('Перемешала птичек! 🔀 Попробуй ещё раз.');return}}
 aina('Не получилось перемешать — попробуй «Назад» или «Ветка» 🙈')};
function syncToggles(){$('tmus').classList.toggle('off',!MUSICON);$('tmus').textContent=MUSICON?'🎵':'🎵';$('tvoi').textContent=VOICE?'🗣️':'🔇';$('tvoi').classList.toggle('off',!VOICE)}
$('tmus').onclick=()=>{MUSICON=!MUSICON;lsSet('tilashar-birds-music',MUSICON?1:0);if(MUSICON)startMusic();else if(MUS)MUS.pause();syncToggles();aina(MUSICON?'Музыка включена 🎵':'Музыка выключена 🤫')};
$('tvoi').onclick=()=>{VOICE=!VOICE;lsSet('tilashar-birds-voice',VOICE?1:0);if(!VOICE)qid++;syncToggles();aina(VOICE?'Голос включён 🗣️':'Голос выключен 🔇 Слова видно на кубиках')};
$('again').onclick=()=>{if(!busy)start(L)};
$('next').onclick=()=>{if(L<LV.length-1)showIntro(L+1);else start(L)};
$('play').onclick=()=>{initAudio();start(L)};
$('back').onclick=()=>{if(!busy)showIntro(L)};
document.addEventListener('pointerdown',()=>initAudio(),{once:true});
syncToggles();
window.__T={start,showIntro,st:()=>state,meta:()=>meta,LV,canMove,minMoves,solvePath,L:()=>L,buf:()=>!!BUF,said:()=>SAIDN,busy:()=>busy,tap,fea:()=>FEA,moves:()=>moves};
showIntro(0);
}
</script>
