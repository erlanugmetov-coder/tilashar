<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тілашар · птички (тест)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый, детский, как Город Айны
   IDEA: ветки во дворе, на них птички с кубиками-словами
   PICTURE: сами ветки и птички — это и есть игра
   COLOUR/TYPE: небо, кора, кубики синие/розовые; Rubik + Nunito
   LAYOUT: шапка, пузырь Айны, ветки одна под другой, кнопки внизу */
:root{color-scheme:light;--ink:#14222c;--muted:#5d7483;--hard:#2f6fd6;--soft:#e05a9c;--aina:#ff8a3d;--bark:#7a4a2a;--bark2:#5e3820}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{margin:0;font:700 15px/1.4 "Nunito",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe6ff 0%,#e6f6ff 45%,#fff6e3 100%);min-height:100vh;overflow-x:clip;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:12px 10px 120px}
.top{display:flex;align-items:center;gap:10px}
.lvl{flex:1}
.lvl b{display:block;font:800 21px/1.1 "Rubik",Arial,sans-serif}
.lvl small{color:var(--muted);font-size:13px}
.pill{background:#fff;border-radius:99px;padding:6px 12px;font:800 15px "Rubik",Arial;box-shadow:0 2px 0 #d9c9a5;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.tab{border:0;border-radius:12px;padding:8px 11px;background:#ffffffb3;font:800 13px "Nunito",Arial;color:var(--ink);cursor:pointer}
.tab.on{background:var(--aina);color:#fff;box-shadow:0 3px 0 #d96a1f}
.say{display:flex;gap:8px;align-items:flex-start;margin:8px 0 6px;min-height:58px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 2px 0 #c9b98f}
.bub{background:#fff;border-radius:4px 16px 16px 16px;padding:9px 12px;font-size:15px;box-shadow:0 2px 0 #e3d6b6;flex:1}
.bub .kk{color:var(--hard);font-weight:800}
.tree{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px}
.br{position:relative;height:var(--bh,112px);margin:4px 0;cursor:pointer;border-radius:16px;transition:background .2s}
.br.sel{background:#ffffff66}
.br .wood{position:absolute;bottom:30px;height:14px;border-radius:8px;background:linear-gradient(180deg,var(--bark),var(--bark2));box-shadow:0 3px 0 #3d2414}
.br.L .wood{left:-12px;right:2%;border-radius:0 8px 8px 0}.br.R .wood{right:-12px;left:2%;border-radius:8px 0 0 8px}
.br .wood:after{content:"";position:absolute;top:6px;width:40px;height:8px;border-radius:8px;background:var(--bark2)}
.br.L .wood:after{right:14%;transform:rotate(16deg);transform-origin:left}.br.R .wood:after{left:14%;transform:rotate(-16deg);transform-origin:right}
.br .tag{position:absolute;bottom:4px;font:800 13px "Nunito";color:var(--muted)}.br.L .tag{left:8px}.br.R .tag{right:8px}
.slots{position:absolute;bottom:38px;display:flex;gap:3px;width:calc(98% - 6px)}
.br.L .slots{left:4px;flex-direction:row}.br.R .slots{right:4px;flex-direction:row-reverse}
.bird{position:relative;width:calc((100% - 6px)/3);max-width:96px;display:flex;flex-direction:column;align-items:center;transition:transform .25s}
.bird svg{width:48px;height:42px;display:block;overflow:visible}
.face{display:block;transform-origin:50% 90%}
.br.R .face,.flyer .face.fl{transform:scaleX(-1)}
.bsv{transform-origin:50% 90%;animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.bsv .tuck{display:none}.flyer .bsv .legs{display:none}.flyer .bsv .tuck{display:block}.flyer.landing .bsv .legs{display:block}.flyer.landing .bsv .tuck{display:none}
.bsv .wgf,.bsv .wgb{transform-box:fill-box;transform-origin:18% 85%}
.flyer .bsv{animation:none}.flyer .wgf{animation:flapF .12s infinite alternate ease-in-out}.flyer .wgb{animation:flapB .12s infinite alternate ease-in-out}.flyer .shd{display:none}
@keyframes flapF{from{transform:rotate(22deg)}to{transform:rotate(-75deg)}}
@keyframes flapB{from{transform:rotate(34deg)}to{transform:rotate(-55deg)}}
.bird.edge .face{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 2px #fff)}
.bird.up .face{translate:0 -16px;transition:translate .2s}
.bird.say .face{filter:drop-shadow(0 0 7px #ffb15c)}
.bird.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bird .eye{transform-box:fill-box;transform-origin:center}
.bird.blink .eye{animation:blink .22s}
@keyframes blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.bird.hop .face{animation:hop .38s ease-out}
@keyframes hop{0%,100%{translate:0 0}40%{translate:0 -11px}}
.bird.squash .face{animation:squash .42s ease-out}
@keyframes squash{0%{scale:1.16 .8}45%{scale:.93 1.1}75%{scale:1.03 .97}100%{scale:1 1}}
.bird.crouch .face{scale:1.12 .84;transition:scale .12s}
#sky{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.flyer{position:fixed;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.flyer .cube{transform:scale(.92)}
.leaf{position:fixed;pointer-events:none;font-size:16px;z-index:8;animation:leaf 1.4s ease-out forwards}
@keyframes leaf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.clouds i{position:absolute;display:block;width:150px;height:44px;border-radius:44px;background:#fff;opacity:.75;animation:cloud linear infinite}
.clouds i:before,.clouds i:after{content:"";position:absolute;background:#fff;border-radius:50%}
.clouds i:before{width:60px;height:60px;left:22px;top:-28px}.clouds i:after{width:46px;height:46px;left:72px;top:-18px}
.clouds i:nth-child(1){top:12%;animation-duration:70s;animation-delay:-20s}.clouds i:nth-child(2){top:38%;transform:scale(.7);animation-duration:95s;animation-delay:-60s;opacity:.55}.clouds i:nth-child(3){top:66%;transform:scale(.85);animation-duration:85s;animation-delay:-5s;opacity:.5}

.wrap{position:relative;z-index:1}
.cube{display:inline-flex;flex-direction:column;align-items:stretch;border-radius:8px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.15);margin-top:-5px;max-width:100%}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#fff7e6f2;box-shadow:0 -4px 14px #0002}
.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{border:0;border-radius:14px;padding:10px 2px;line-height:1.15;background:#fde8cf;color:#8a4a10;font:800 15px "Nunito",Arial;box-shadow:0 3px 0 #e2c39b;cursor:pointer}
.btn:disabled{opacity:.45}
.btn small{display:inline-block;margin-left:4px;background:#e2574c;color:#fff;border-radius:99px;padding:0 6px;font-size:12px}
.win{position:fixed;inset:0;background:#0d3b4fcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.win.on{display:flex}
.card{background:#fffaf0;border-radius:24px;padding:20px 16px;max-width:360px;width:100%;text-align:center;animation:pop .35s}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.card h2{font:800 26px "Rubik";margin:6px 0}
.stars{font-size:38px;letter-spacing:6px}

.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}


/* --- экран 1: подготовка --- */
.hero{text-align:center;margin:4px 0 10px}.hero h1{font:800 26px/1.1 "Rubik",Arial;margin:0}.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.lvcards{display:grid;gap:8px}
.lvc{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:10px 12px;background:#ffffffc4;text-align:left;font:700 14px "Nunito",Arial;color:var(--ink);box-shadow:0 2px 0 #d9c9a5;cursor:pointer}

.play{display:block;width:100%;margin:14px 0 6px;border:0;border-radius:18px;padding:16px;background:#2fb37a;color:#fff;font:800 20px "Rubik",Arial;box-shadow:0 5px 0 #1f8a5b;cursor:pointer}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #1f8a5b}
/* --- экран 2: игра --- */
#game{display:none;position:fixed;inset:0;z-index:1;flex-direction:column}
body.playing #game{display:flex}body.playing #intro{display:none}
.gtop{display:flex;align-items:center;gap:8px;padding:10px 10px 4px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.back{flex:none;border:0;width:40px;height:40px;border-radius:50%;background:#fff;font:800 20px "Rubik";color:var(--ink);box-shadow:0 2px 0 #d9c9a5;cursor:pointer}
.gtop .lvl b{font-size:18px}.gtop .lvl small{font-size:12px}
.gmid{flex:1;min-height:0;overflow-y:auto;overflow-x:clip;max-width:520px;width:100%;margin:0 auto;padding:0 10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;position:relative}
.gbar{max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;display:flex;justify-content:center;gap:14px;padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
.gb{position:relative;border:0;width:54px;height:54px;border-radius:50%;background:#fde8cf;font-size:24px;box-shadow:0 3px 0 #e2c39b;cursor:pointer}
.gb:disabled{opacity:.4}
.gb small{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;line-height:20px;border-radius:99px;background:#e2574c;color:#fff;font:800 12px "Rubik"}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,8px);width:min(500px,calc(100% - 24px));box-sizing:border-box;display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;box-shadow:0 4px 14px #0003;opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast .av{width:32px;height:32px;font-size:20px;box-shadow:none}.toast .kk{color:var(--hard);font-weight:800}
.feather{position:fixed;pointer-events:none;font-size:18px;z-index:8;animation:fth 1.2s ease-out forwards}
@keyframes fth{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (max-width:360px){.wrap{padding-left:6px;padding-right:6px}.tree{column-gap:8px}.slots{gap:1px;width:calc(100% - 2px)}.bird{width:calc((100% - 2px)/3)}.cube span{padding:1px 2px}.bird svg{width:40px;height:36px}}
@media (prefers-reduced-motion:reduce){.bird,.card,.bsv,.face,.feather,.leaf,.clouds i{animation:none!important;transition:none!important}}
</style></head><body>

 {t:'Уровень 1',s:'➡️ куда · 📍 где',cap:3,spare:1,need:4,

 try{SAIDN++;const s=AC.createBufferSource();s.buffer=BUF;s.connect(AC.destination);s.start(0,p[0],p[1]);s.onended=res;setTimeout(res,p[1]*1000+400)}catch(e){res()}})}

/* ---------- звуки игры (синтез, тише голоса) ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tone(f1,f2,dur,type,vol,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.08,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function noise(dur,vol,f,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),n=AC.createBuffer(1,AC.sampleRate*dur|0,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
 const src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();src.buffer=n;bp.type='bandpass';bp.frequency.value=f||1200;g.gain.value=vol||.06;src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start(t)}catch(e){}}
const SFX={chirp:()=>{tone(2300,3400,.07,'sine',.05);tone(2600,3800,.07,'sine',.05,.09)},flap:(d)=>{for(let i=0;i<3;i++)noise(.05,.05,900,(d||0)+i*.07)},
 buzz:()=>{tone(190,150,.18,'square',.035);tone(200,160,.12,'square',.03,.2)},poof:(d)=>{noise(.35,.07,600,d||0);tone(900,300,.3,'triangle',.03,d||0)},
 tick:()=>{tone(1400,900,.05,'triangle',.035)},win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.22,'triangle',.07,i*.13));tone(1318,1318,.5,'triangle',.06,.55)}};
function feathers(el,n){if(RM||!el)return;const r=el.getBoundingClientRect();for(let i=0;i<n;i++){const f=document.createElement('div');f.className='feather';f.textContent=['🪶','✨','🪶'][i%3];f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+20)+'px';
 f.style.setProperty('--dx',(Math.random()*120-60)+'px');f.style.setProperty('--dy',(-40-Math.random()*90)+'px');f.style.setProperty('--r',(Math.random()*240-120)+'deg');document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function q2(p0,p1,p2,t){const u=1-t;return [u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]}
function cr(P,t){const n=P.length-1,seg=Math.min(n-1,Math.floor(t*n)),lt=t*n-seg;const p0=P[Math.max(0,seg-1)],p1=P[seg],p2=P[seg+1],p3=P[Math.min(n,seg+2)];const tt=lt*lt,ttt=tt*lt;
 return [0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*lt+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*tt+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*ttt))}
function makeFlyer(el){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='flyer';f.style.width=r.width+'px';
 f.innerHTML=`<div class="face">${el.querySelector('.face').innerHTML}</div>`+el.querySelector('.cube').outerHTML;$('sky').appendChild(f);return {f,r}}
function animFlyer(F,pathFn,dur,opts){opts=opts||{};return new Promise(res=>{const f=F.f,face=f.querySelector('.face');let t0=null,prev=pathFn(0),faceL=null;
 function step(ts){if(t0===null)t0=ts;let t=Math.min(1,(ts-t0)/dur);const e=opts.linear?t:ease(t);const p=pathFn(e),dx=p[0]-prev[0],dy=p[1]-prev[1];
  if(Math.abs(dx)>.3){const L=dx<0;if(L!==faceL){faceL=L;face.classList.toggle('fl',L)}}
  let ang=Math.atan2(dy,Math.abs(dx)+.001)*57.3*.45;ang=Math.max(-28,Math.min(28,ang));if(faceL)ang=-ang;
  const bob=Math.sin(t*Math.PI*7)*2.5*(1-t),sc=opts.scale?opts.scale(t):1;
  f.style.transform=`translate(${p[0]}px,${p[1]+bob}px) rotate(${ang}deg) scale(${sc})`;if(opts.fade)f.style.opacity=String(opts.fade(t));
  if(opts.land&&t>.82)f.classList.add('landing');prev=p;if(t<1)requestAnimationFrame(step);else res()}
 requestAnimationFrame(step)})}
function swayBranch(i,amp){if(RM)return;const br=$('tree').querySelectorAll('.br')[i];if(!br)return;const L=br.classList.contains('L'),o=L?'0% 100%':'100% 100%',s=L?1:-1;
 [br.querySelector('.wood'),br.querySelector('.slots')].forEach(el=>{if(!el)return;el.style.transformOrigin=o;el.animate([{transform:'rotate(0)'},{transform:`rotate(${s*amp}deg)`},{transform:`rotate(${-s*amp*.55}deg)`},{transform:`rotate(${s*amp*.25}deg)`},{transform:'rotate(0)'}],{duration:700,easing:'ease-out'})})}
function leaves(i,n){if(RM)return;const br=$('tree').querySelectorAll('.br')[i];if(!br)return;const r=br.querySelector('.wood').getBoundingClientRect();
 for(let k=0;k<n;k++){const e=document.createElement('div');e.className='leaf';e.textContent=k%3?'🍃':'🌿';e.style.left=(r.left+Math.random()*r.width)+'px';e.style.top=(r.top-6)+'px';
  e.style.setProperty('--dx',(Math.random()*80-40)+'px');e.style.setProperty('--dy',(30+Math.random()*90)+'px');e.style.setProperty('--r',(Math.random()*300-150)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}}
async function flyMove(ids,before,to){ /* перелёт с ветки на ветку */
 const tasks=ids.map((id,k)=>new Promise(async res=>{const el=birdEl(id),r0=before[id];if(!el||!r0||RM){HIDE.delete(id);if(el)el.style.visibility='';res();return}
  await new Promise(r=>setTimeout(r,k*120));const r1=el.getBoundingClientRect();const F=makeFlyer(el);F.f.style.width=r0.width+'px';
  const P0=[r0.left,r0.top],P2=[r1.left,r1.top],P1=[(P0[0]+P2[0])/2,Math.min(P0[1],P2[1])-70-Math.abs(P2[0]-P0[0])*.22-k*12];
  const dist=Math.hypot(P2[0]-P0[0],P2[1]-P0[1]),dur=Math.min(900,480+dist*.45);
  F.f.style.transform=`translate(${P0[0]}px,${P0[1]}px)`;F.f.querySelector('.face').style.scale='1.12 .84';await new Promise(r=>setTimeout(r,90));F.f.querySelector('.face').style.scale='';
  SFX.flap(0);await animFlyer(F,t=>q2(P0,P1,P2,t),dur,{land:true});F.f.remove();HIDE.delete(id);const e2=birdEl(id);if(e2){e2.style.visibility='';e2.classList.add('squash');setTimeout(()=>e2.classList.remove('squash'),450)}
  SFX.tick();if(k===ids.length-1||true){swayBranch(to,2.4)}
  $('tree').querySelectorAll('.br')[to]?.querySelectorAll('.bird').forEach(b=>{if(+b.dataset.b!==id&&!HIDE.has(+b.dataset.b)){b.classList.add('hop');setTimeout(()=>b.classList.remove('hop'),380)}});res()}));
 await Promise.all(tasks)}
async function flyAway(i,grp){ /* стайка улетает: взлёт, круг над деревом, за край экрана */
 const els=grp.map(x=>birdEl(x.id)).filter(Boolean);els.forEach(e=>e.classList.add('crouch'));await new Promise(r=>setTimeout(r,180));
 leaves(i,6);swayBranch(i,4);SFX.poof(0);
 const W=innerWidth,first=els[0]?els[0].getBoundingClientRect():{left:W/2},dir=first.left<W/2?1:-1,cx=W/2,top=Math.max(70,$('tree').getBoundingClientRect().top-30);
 const ps=els.map((el,k)=>new Promise(async res=>{if(RM){el.style.visibility='hidden';res();return}await new Promise(r=>setTimeout(r,k*130));
  const F=makeFlyer(el);const r0=el.getBoundingClientRect();el.style.visibility='hidden';const x0=r0.left,y0=r0.top,o=k*22;
  const P=[[x0,y0],[x0+dir*30,y0-95-o*.5],[cx-dir*(70-o),top+50+o*.6],[cx+dir*(10+o),top-10],[cx+dir*(110+o),top+30],[dir>0?W+120:-160,-120-o]];
  SFX.flap(0);SFX.flap(.25);feathers(el,2);await animFlyer(F,t=>cr(P,t),1800,{linear:true,scale:t=>1+Math.sin(t*Math.PI)*.18-t*.25});F.f.remove();res()}));
 await Promise.all(ps)}


setInterval(()=>{if(RM||document.hidden)return;const bs=$('tree').querySelectorAll('.bird:not(.flying)');if(!bs.length)return;const b=bs[Math.random()*bs.length|0];const c=Math.random()<.6?'blink':'hop';b.classList.add(c);setTimeout(()=>b.classList.remove(c),400)},1600);
/* ---------- уровень ---------- */
function wordOf(b){return b.w[0]+b.w[1]}
function hard(w){return !/[әеіөү]/i.test(w)}
function shade(h,p){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function birdSVG(c){const d=shade(c,-34);return `<svg viewBox="0 0 64 56" class="bsv"><ellipse class="shd" cx="32" cy="53" rx="16" ry="3" fill="#0002"/><path class="tail" d="M14 33 Q2 28 3 16 Q12 21 19 28Z" fill="${d}"/><path class="wgb" d="M22 27 Q29 7 43 17 Q35 30 22 27Z" fill="${d}"/><ellipse cx="32" cy="32" rx="19" ry="17" fill="${c}"/><ellipse cx="35" cy="37" rx="11" ry="9" fill="#fff" opacity=".55"/><path class="wgf" d="M19 31 Q25 12 40 22 Q32 37 19 31Z" fill="${c}" stroke="${d}" stroke-width="1.6"/><g class="eye"><circle cx="41" cy="24" r="6.2" fill="#fff"/><circle cx="42.6" cy="24.6" r="3.1" fill="#14222c"/><circle cx="43.7" cy="23.3" r="1" fill="#fff"/></g><path d="M49 27 L58.5 30 L49 33Z" fill="#ff8a3d"/><circle cx="36" cy="31" r="2.6" fill="#ff8fb1" opacity=".55"/><g class="legs"><path d="M26 48 v5 M35 48 v5" stroke="#ff8a3d" stroke-width="3" stroke-linecap="round"/></g><g class="tuck"><path d="M23 45 q4 4 8 1 M32 45 q4 4 8 1" stroke="#ff8a3d" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>`}
function full1(br){return br.length===cap&&br.every(b=>b.c===br[0].c)}
function topGroup(br){let n=0;const c=br.length?br[br.length-1].c:-1;for(let i=br.length-1;i>=0&&br[i].c===c;i--)n++;return n}
function canMove(s,f,t){if(f===t)return 0;const a=s[f],b=s[t];if(!a.length||b.length>=cap)return 0;if(b.length&&b[b.length-1].c!==a[a.length-1].c)return 0;return Math.min(topGroup(a),cap-b.length)}
function doMove(s,f,t){const n=canMove(s,f,t);for(let i=0;i<n;i++)s[t].push(s[f].pop());let cleared=false;if(full1(s[t])){cleared=s[t].slice();s[t].length=0}return {n,cleared}}
function keyOf(s){return s.map(b=>b.map(x=>x.c).join('')).sort().join('|')}
function minMoves(s0){const seen=new Set([keyOf(s0)]);let q=[s0],d=0;
 while(q.length&&seen.size<40000){const nq=[];for(const s of q){if(s.every(b=>!b.length))return d;
  for(let f=0;f<s.length;f++)for(let t=0;t<s.length;t++){if(!canMove(s,f,t))continue;const m=s.map(x=>x.slice());doMove(m,f,t);const k=keyOf(m);if(!seen.has(k)){seen.add(k);nq.push(m)}}}q=nq;d++}
 return -1}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function gen(){const lv=LV[L];cap=lv.cap;spareN=lv.spare;let id=0;birds=[];
 lv.cats.forEach((c,ci)=>c.w.forEach(w=>{birds.push({id:id++,c:ci,w,col:BIRDC[(id*3+ci)%BIRDC.length]})}));
 let best=null,bestN=-1;
 for(let tries=0;tries<300;tries++){const all=shuffled(birds);const s=lv.cats.map((c,i)=>all.slice(i*cap,i*cap+cap));for(let i=0;i<spareN;i++)s.push([]);
  if(s.some(full1))continue;const n=minMoves(s);if(n<0)continue;if(n>bestN){bestN=n;best=s}if(n>=lv.need){lv.bestN=n;return s}}
 lv.bestN=bestN;return best}
function start(n){HIDE.clear();busy=false;$('sky').innerHTML='';L=n;const lv=LV[L];state=gen();moves=0;undoLeft=3;addLeft=1;mixLeft=2;hist=[];sel=-1;doneSay={};
 document.body.classList.add('playing');$('lt').textContent=lv.t;$('ls').textContent=lv.s;$('win').classList.remove('on');render();aina('Поехали! 🐦 Нажми на ветку — потом на другую ветку.')}
function showIntro(n){HIDE.clear();busy=false;$('sky').innerHTML='';L=n;const lv=LV[L];document.body.classList.remove('playing');$('win').classList.remove('on');$('toast').classList.remove('on');
 $('lvcards').innerHTML=LV.map((l,i)=>`<button class="lvc ${i===L?'on':''}" data-l="${i}"><span class="n">${i+1}</span><span><b>${l.t}</b><small>${l.s}</small></span></button>`).join('');
 $('lvcards').querySelectorAll('.lvc').forEach(x=>x.onclick=()=>{initAudio();showIntro(+x.dataset.l)});
 $('ibub').innerHTML=lv.hello;
 $('chips').innerHTML=lv.cats.map(c=>{const w=c.w[0];return `<button class="chip" data-w="${w[0]+w[1]}">${c.k} — <span class="kk">${w[0]}<span class="t ${hard(w[1])?'h':'s'}">${w[1]}</span></span> 🔊</button>`}).join('');
 $('chips').querySelectorAll('.chip').forEach(x=>x.onclick=()=>{initAudio();sayList([x.dataset.w])});scrollTo(0,0)}
let toastT=0;
function aina(h){$('bub').innerHTML=h;const t=$('toast');t.classList.add('on');clearTimeout(toastT);const len=h.replace(/<[^>]+>/g,'').length;toastT=setTimeout(()=>t.classList.remove('on'),Math.min(5000,1800+len*35))}
function sizeTree(){const rows=Math.ceil(state.length/2),h=$('gmid').clientHeight;const bh=Math.max(104,Math.min(128,Math.floor(h/rows)-8));$('tree').style.setProperty('--bh',bh+'px')}
function render(land){$('mv').textContent=moves;$('un').textContent=undoLeft;$('ad').textContent=addLeft;$('mx').textContent=mixLeft;$('undo').disabled=!undoLeft||!hist.length;$('add').disabled=!addLeft;$('mix').disabled=!mixLeft;
 sizeTree();$('tree').innerHTML=state.map((br,i)=>{const side=i%2?'R':'L',tg=sel===i?topGroup(br):0;
  return `<div class="br ${side} ${i===sel?'sel':''}" data-i="${i}"><div class="wood"></div><div class="tag">${br.length?'':'пусто'}</div><div class="slots">${br.map((b,j)=>{const w=b.w,hc=hard(w[1])?'h':'s';
   return `<div class="bird ${j===br.length-1?'edge':''} ${tg&&j>=br.length-tg?'up':''} ${land&&land.i===i&&j>=br.length-land.n?'land':''}" data-b="${b.id}" style="${HIDE.has(b.id)?'visibility:hidden':''}"><div class="face" style="--d:-${(b.id*0.37)%2.6}s">${birdSVG(b.col)}</div><div class="cube"><span class="r">${w[0]}</span><span class="${hc}">${w[1]}</span></div></div>`}).join('')}</div></div>`}).join('');
 $('tree').querySelectorAll('.br').forEach(el=>el.onclick=()=>tap(+el.dataset.i));fitWords()}
function fitWords(){$('tree').querySelectorAll('.bird').forEach(b=>{const max=b.clientWidth;b.querySelectorAll('.cube span').forEach(sp=>{let f=parseFloat(getComputedStyle(sp).fontSize);while(sp.scrollWidth>max&&f>9){f-=.5;sp.style.fontSize=f+'px'}})})}
addEventListener('resize',()=>{try{if(state&&document.body.classList.contains('playing'))render()}catch(e){}});
function birdEl(id){return $('tree').querySelector(`[data-b="${id}"]`)}
function tap(i){initAudio();if(busy)return;const br=state[i];
 if(sel<0){if(!br.length){aina('Эта ветка пустая — сначала выбери птичку 🐦');return}
  sel=i;render();SFX.chirp();const g=topGroup(br),grp=br.slice(br.length-g);grp.forEach(x=>{const e=birdEl(x.id);if(e){e.classList.add('hop');setTimeout(()=>e.classList.remove('hop'),360)}});sayList(grp.map(wordOf),grp.map(x=>birdEl(x.id)));return}
 if(sel===i){sel=-1;render();return}
 const n=canMove(state,sel,i);
 if(n){hist.push(state.map(x=>x.slice()));const f=sel;sel=-1;const mv=state[f].slice(state[f].length-n).reverse(),before={};mv.forEach(x=>{const e=birdEl(x.id);if(e)before[x.id]=e.getBoundingClientRect()});
  for(let k=0;k<n;k++)state[i].push(state[f].pop());moves++;mv.forEach(x=>HIDE.add(x.id));busy=true;render();
  (async()=>{await flyMove(mv.map(x=>x.id),before,i);
   if(full1(state[i])){const lv=LV[L],grp=state[i].slice(),c=lv.cats[grp[0].c];aina(c.say+' <span class="kk">'+grp.map(wordOf).join(', ')+'</span> 🐦💨');SFX.chirp();
    await sayList(grp.map(wordOf),grp.map(x=>birdEl(x.id)));await flyAway(i,grp);state[i]=[];busy=false;render();checkWin()}
   else{busy=false;if(n>1)aina('Стайка из '+n+' полетела вместе! 🐦🐦')}})();}
 else{const from=state[sel],b=from[from.length-1],el=birdEl(b.id);if(el){el.classList.remove('up');el.classList.add('shake')}SFX.buzz();
  const why=state[i].length>=cap?'На этой ветке нет места 🙈':JOKES[Math.random()*JOKES.length|0];aina(why);setTimeout(()=>{sel=-1;render()},420)}}
function checkWin(){if(state.some(b=>b.length))return;const lv=LV[L];
 const best=lv.bestN||lv.cats.length*2;const st=moves<=best+1?3:moves<=best+4?2:1;
 setTimeout(()=>{SFX.win();$('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('wt').innerHTML=`Все птички улетели домой! 🐦💨 Ходов: <b>${moves}</b>.<br>${st===3?'Идеально! Ты мастер хвостиков 😎':st===2?'Отлично! Можно ещё быстрее 💪':'Получилось! Попробуй за меньше ходов 😉'}`;
  $('next').textContent=L<LV.length-1?'Дальше →':'Сыграть снова 🔄';$('win').classList.add('on')},400)}
$('undo').onclick=()=>{if(busy||!undoLeft||!hist.length)return;HIDE.clear();state=hist.pop();undoLeft--;sel=-1;render();aina('Вернула птичек назад ↩️')};
$('add').onclick=()=>{if(busy||!addLeft)return;addLeft--;state.push([]);sel=-1;render();aina('Новая ветка выросла! 🌿 Используй с умом.')};
$('mix').onclick=()=>{if(busy||!mixLeft)return;const sizes=state.map(b=>b.length),all=[].concat(...state);
 for(let t=0;t<200;t++){const sh=shuffled(all);let k=0;const ns=sizes.map(n=>{const r=sh.slice(k,k+n);k+=n;return r});if(ns.some(full1))continue;if(minMoves(ns)>=0){hist.push(state.map(x=>x.slice()));state=ns;mixLeft--;sel=-1;render();aina('Перемешала птичек! 🔀 Попробуй ещё раз.');return}}
 aina('Не получилось перемешать — попробуй «Назад» или «Ветка» 🙈')};
$('again').onclick=()=>{if(!busy)start(L)};
$('next').onclick=()=>{if(L<LV.length-1)showIntro(L+1);else start(L)};
$('play').onclick=()=>{initAudio();start(L)};
$('back').onclick=()=>{if(!busy)showIntro(L)};
document.addEventListener('pointerdown',initAudio,{once:true});
window.__T={start,showIntro,st:()=>state,LV,canMove,doMove,minMoves,L:()=>L,buf:()=>!!BUF,said:()=>SAIDN,busy:()=>busy};
showIntro(0);
}
