<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тілашар · яма фраз (тест)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: весёлая аркада, тёплая, как Город Айны
   IDEA: яма, в которую падают кубики-фразы; хвостик с полочки их взрывает
   PICTURE: сама яма с кубиками
   COLOUR/TYPE: небо, кубики: кто — оранжевый, слово — бежевый, хвостик — синий/розовый; Rubik
   LAYOUT: шапка · полочка хвостиков · яма · Айна снизу */
:root{color-scheme:light;--ink:#14222c;--muted:#5d7483;--hard:#2f6fd6;--soft:#e05a9c;--aina:#ff8a3d;--rowh:62px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:700 15px/1.35 "Nunito",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe6ff 0%,#e6f6ff 55%,#fff6e3 100%);user-select:none}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:6px}
.top b{flex:1;font:800 20px "Rubik",Arial;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;background:#fff;border-radius:99px;padding:5px 10px;font:800 15px "Rubik",Arial;box-shadow:0 2px 0 #d9c9a5;white-space:nowrap}
.pill.fire{background:#fff3e2;color:#d9531f}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 8px;padding:10px;border-radius:18px;background:#fff9;box-shadow:inset 0 -3px 0 #e8dcc0}
.tl{border:0;border-radius:14px;padding:12px 4px;font:800 20px "Rubik",Arial;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003;transition:transform .1s}
.tl:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.tl.h{background:var(--hard)}.tl.s{background:var(--soft)}.tl.z{background:#8d99a6}
.tl.new{animation:pop .35s}
.tl.bad{animation:shake .4s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pit{position:relative;flex:1;min-height:0;border-radius:20px;background:linear-gradient(180deg,#ffffff55,#f5e6c8aa);box-shadow:inset 0 3px 10px #0001,inset 0 -4px 0 #e2cfa6;overflow:hidden}
.edge{position:absolute;left:8px;right:8px;z-index:1;border-top:3px dashed #e2574c;opacity:.55}
.edge span{position:absolute;right:0;top:-20px;font-size:12px;color:#e2574c}
.edge.warn{opacity:1;animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.3}}
.row{position:absolute;left:0;right:0;height:var(--rowh);display:flex;justify-content:center;align-items:center;gap:6px;transition:bottom .35s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.row.sel .cb{box-shadow:0 4px 0 #0003,0 0 0 3px #fff,0 0 0 6px #ffb15c}
.row.bad{animation:shake .4s}
.cb{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 14px;border-radius:12px;font:800 20px "Rubik",Arial;box-shadow:0 4px 0 #0003;white-space:nowrap}
.cb.p{background:var(--aina);color:#fff}.cb.w{background:#fff8ea;color:#3a2a14;border:2px solid #e7d3ac}
.cb.q{background:transparent;border:2px dashed #b9a98a;color:#b9a98a;min-width:58px;box-shadow:none}
.cb.mg{background:#fff8ea;border:2px solid #ffb15c;color:#3a2a14}.cb.mg i{font-style:normal;color:#fff;border-radius:7px;padding:0 5px;margin-left:2px}
.cb.mg i.h{background:var(--hard)}.cb.mg i.s{background:var(--soft)}
.drop{animation:drop .5s cubic-bezier(.5,0,.7,1.4) both}
@keyframes drop{from{transform:translateY(var(--fall,-500px))}to{transform:none}}
.boom{animation:boom .45s ease-in forwards}
@keyframes boom{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(.2);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:9;font-size:20px;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.fly{position:fixed;z-index:8;pointer-events:none;margin:0}
.tr{position:absolute;left:0;right:0;text-align:center;font:800 16px "Rubik";color:#2b7a4b;pointer-events:none;animation:tr 1.4s ease-out forwards}
@keyframes tr{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.toast{position:absolute;left:10px;right:10px;top:18px;transform:translateY(-8px);display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;box-shadow:0 4px 14px #0002;opacity:0;transition:opacity .25s,transform .25s;z-index:6;pointer-events:none}
.toast.on{opacity:1;transform:none}.toast .av{flex:none;width:32px;height:32px;border-radius:50%;background:#fff3e2;display:grid;place-items:center;font-size:20px}
.kk{color:var(--hard);font-weight:800}
.ov{position:fixed;inset:0;background:#0d3b4fcc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.off{display:none}
.card{background:#fffaf0;border-radius:24px;padding:22px 18px;max-width:360px;width:100%;text-align:center;animation:pop .35s}
.card h2{font:800 28px "Rubik";margin:4px 0 6px}
.card p{margin:8px 0 14px;font-size:16px}
.go{width:100%;border:0;border-radius:16px;padding:15px;background:#2fb37a;color:#fff;font:800 19px "Rubik";box-shadow:0 4px 0 #1f8a5b;cursor:pointer}
.demo{display:flex;justify-content:center;gap:5px;margin:10px 0}.demo .cb{height:38px;font-size:17px;padding:0 10px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:360px){.cb{font-size:16px;padding:0 8px;height:42px}.row{gap:4px}.tl{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bgc{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.bgc i{position:absolute;display:block;width:150px;height:44px;border-radius:44px;background:#fff;opacity:.7;animation:cloud linear infinite}
.bgc i:before,.bgc i:after{content:"";position:absolute;background:#fff;border-radius:50%}.bgc i:before{width:60px;height:60px;left:22px;top:-28px}.bgc i:after{width:46px;height:46px;left:72px;top:-18px}
.bgc i:nth-child(1){top:9%;animation-duration:55s;animation-delay:-20s}.bgc i:nth-child(2){top:34%;transform:scale(.7);animation-duration:80s;animation-delay:-50s;opacity:.5}.bgc i:nth-child(3){top:60%;transform:scale(.85);animation-duration:65s;animation-delay:-8s;opacity:.45}
@keyframes cloud{from{left:-180px}to{left:105%}}
.city{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:-1;pointer-events:none;opacity:.55}
.app{position:relative}
.pit{background:linear-gradient(180deg,#ffffff30,#fff3d9b0)!important;backdrop-filter:blur(2px);border:2px solid #ffffffaa;transition:box-shadow .4s}
.pit.danger{box-shadow:inset 0 0 0 3px #e2574c99,inset 0 0 40px #e2574c55!important;animation:dz 1s infinite alternate}
@keyframes dz{to{box-shadow:inset 0 0 0 3px #e2574c,inset 0 0 60px #e2574c88}}
.bar{position:absolute;left:10px;right:10px;top:6px;height:6px;border-radius:6px;background:#ff8a3d;transform-origin:left;z-index:3;opacity:.85}
.barbg{position:absolute;left:10px;right:10px;top:6px;height:6px;border-radius:6px;background:#0000000f;z-index:2}
.row{top:0!important;bottom:auto!important;transform-origin:50% 0;transition:none!important;will-change:transform}
.row.next .cb.q{border-color:#ff8a3d;color:#ff8a3d;animation:qp 1s infinite}
@keyframes qp{50%{transform:scale(1.08);background:#fff3e2}}
.row.land .cb{animation:land .3s}
@keyframes land{0%{transform:scale(1.1,.85)}60%{transform:scale(.96,1.05)}100%{transform:none}}
.cb.p{background:linear-gradient(180deg,#ffab6b,#ff7d2a)!important;box-shadow:0 5px 0 #c75c14,inset 0 2px 0 #ffffff70!important}
.cb.w{background:linear-gradient(180deg,#fffdf6,#f6e8c8)!important;box-shadow:0 5px 0 #d9c49a,inset 0 2px 0 #fff!important}
.cb.mg{background:linear-gradient(180deg,#fffdf6,#ffe7c2)!important;box-shadow:0 5px 0 #f0b060,0 0 18px #ffb15c!important}
.tl.h{background:linear-gradient(180deg,#5b93ec,#2f6fd6)!important;box-shadow:0 5px 0 #1f4f9e,inset 0 2px 0 #ffffff50!important}
.tl.s{background:linear-gradient(180deg,#f08bbb,#e05a9c)!important;box-shadow:0 5px 0 #a8356d,inset 0 2px 0 #ffffff50!important}
.tl.z{background:linear-gradient(180deg,#aab4bf,#8d99a6)!important;box-shadow:0 5px 0 #5f6a75!important}
.shard{position:fixed;z-index:9;width:11px;height:11px;border-radius:3px;pointer-events:none;animation:shd .85s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes shd{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.flash{position:fixed;z-index:8;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(#fff,#ffd96a88 50%,transparent 70%);pointer-events:none;animation:fl .45s ease-out forwards}
@keyframes fl{to{transform:scale(14);opacity:0}}
#big{position:fixed;left:0;right:0;top:42%;text-align:center;font:800 44px "Rubik",Arial;color:#ff7d2a;text-shadow:0 3px 0 #fff,0 6px 14px #0003;pointer-events:none;opacity:0;z-index:9}
#big.on{animation:big .9s ease-out}
@keyframes big{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
.pill.fire.hot{background:#ff7d2a;color:#fff;animation:qp .8s infinite}
.tr{text-shadow:0 2px 0 #fff}
</style></head><body>
<div class="bgc"><i></i><i></i><i></i></div>
<svg class="city" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="#8fb3cf"><rect x="0" y="80" width="40" height="70"/><rect x="45" y="55" width="34" height="95"/><rect x="84" y="95" width="50" height="55"/><path d="M140 150V70l22-22 22 22v80z"/><rect x="190" y="40" width="30" height="110"/><circle cx="205" cy="34" r="10"/><rect x="226" y="90" width="44" height="60"/><rect x="276" y="60" width="38" height="90"/><rect x="320" y="85" width="34" height="65"/><rect x="358" y="70" width="42" height="80"/></g><g fill="#ffe9a8" opacity=".9"><rect x="52" y="66" width="6" height="8"/><rect x="66" y="80" width="6" height="8"/><rect x="196" y="56" width="6" height="8"/><rect x="208" y="76" width="6" height="8"/><rect x="284" y="72" width="6" height="8"/><rect x="298" y="96" width="6" height="8"/><rect x="366" y="84" width="6" height="8"/><rect x="10" y="94" width="6" height="8"/></g></svg>
<div id="big"></div>
<div class="app" id="app">
  <div class="top"><b>Яма фраз</b><span class="pill">⭐ <span id="sc">0</span></span><span class="pill fire" id="cmp">🔥 <span id="cm">0</span></span><span class="pill">❌ <span id="mi">0</span></span></div>
  <div class="shelf" id="shelf"></div>
  <div class="pit" id="pit"><div class="barbg"></div><div class="bar" id="bar"></div><div class="edge" id="edge"><span>край</span></div><div class="toast" id="toast"><div class="av">🤖</div><div id="bub"></div></div></div>
</div>
<div class="ov" id="start"><div class="card"><div style="font-size:44px">🧱</div><h2>Яма фраз</h2>
 <p>Сверху всё время ползут кубики <b>кто + слово</b>. Жми нужный хвостик — фраза взорвётся! Не дай яме заполниться до края.</p>
 <div class="demo"><span class="cb p">Мен</span><span class="cb w">дос</span><span class="cb mg" style="background:var(--hard);color:#fff;border-color:var(--hard)">-пын</span></div>
 <button class="go" id="play">Играть ▶</button><div class="note">Прототип · без озвучки</div></div></div>
<div class="ov off" id="over"><div class="card"><div style="font-size:44px">🕳️</div><h2>Яма полна!</h2><p id="ot"></p><button class="go" id="again">Ещё раз 🔄</button></div></div>
<script>
{
const COMBOS=__COMBOS__;
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PERS={'Мен':'«я»','Сен':'«ты»','Сіз':'«вы» (вежливо)','Біз':'«мы»','Сендер':'«вы» (все)','Сіздер':'«вы» (вежливо, много)'};
const PRU={'Мен':'я','Сен':'ты','Сіз':'вы','Біз':'мы','Ол':'он / она','Сендер':'вы (все)','Сіздер':'вы','Олар':'они'};
function tailOf(p,w){const soft=/[әеіөү]/.test(w),l=w.slice(-1),vl='сткқпшфхцчщ'.includes(l),bz='зж'.includes(l);
 switch(p){case 'Мен':return (vl?'п':bz?'б':'м')+(soft?'ін':'ын');case 'Біз':return (vl?'п':bz?'б':'м')+(soft?'із':'ыз');
  case 'Сен':return soft?'сің':'сың';case 'Сіз':return soft?'сіз':'сыз';case 'Сендер':return soft?'сіңдер':'сыңдар';case 'Сіздер':return soft?'сіздер':'сыздар';default:return ''}}
const NONE='∅';const isSoft=t=>/[әеіөү]/.test(t);
const TAILP={};Object.keys(PERS).forEach(q=>['бала','суретші','дос','қыз','ұстаз','дәрігер','әнші','қонақ'].forEach(w=>{TAILP[tailOf(q,w)]=q}));
/* этапы: открываются по очкам */
const STAGES=[{at:0,p:['Мен'],say:'Начнём с <span class="kk">Мен</span> — «я» 🙋'},{at:50,p:['Мен','Сен'],say:'Новый кубик: <span class="kk">Сен</span> — «ты» 👉'},
 {at:120,p:['Мен','Сен','Біз','Сіз'],say:'Ещё: <span class="kk">Біз</span> — мы, <span class="kk">Сіз</span> — вы 🎩'},
 {at:200,p:['Мен','Сен','Біз','Сіз','Ол'],say:'<span class="kk">Ол</span> — без хвостика! Жми <b>∅</b> 😎'},
 {at:300,p:['Мен','Сен','Біз','Сіз','Ол','Сендер','Сіздер','Олар'],say:'Вся семья! <span class="kk">Сендер, Сіздер, Олар</span> 👨‍👩‍👧‍👦'}];
/* ---------- звуки (синтез, без голоса) ---------- */
let AC=null;function ac(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return AC}
function tone(f1,f2,d,type,vol,dl){const a=ac();if(!a)return;try{const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={thud:()=>tone(160,70,.12,'triangle',.08),good:()=>{tone(660,990,.1,'triangle',.07);tone(990,1320,.12,'triangle',.06,.08)},boom:()=>{tone(300,60,.3,'sawtooth',.05);tone(1200,400,.2,'triangle',.04)},
 bad:()=>{tone(190,150,.18,'square',.035);tone(200,160,.12,'square',.03,.2)},tick:()=>tone(1300,900,.04,'triangle',.03),over:()=>[523,440,349,262].forEach((f,i)=>tone(f,f*.98,.25,'triangle',.07,i*.18)),up:()=>[523,659,784].forEach((f,i)=>tone(f,f,.16,'triangle',.06,i*.1))};
/* ---------- Айна ---------- */
let toastT=0;function aina(h,ms){$('bub').innerHTML=h;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('on'),ms||3200)}
/* ---------- ряды ---------- */
const pick=a=>a[Math.random()*a.length|0];
function needOf(r){const t=tailOf(r.p,r.w);return t||NONE}
/* ---------- полочка ---------- */
function tailsOf(ps){const s=new Set();ps.forEach(p=>(COMBOS[p]||[]).forEach(([w])=>s.add(tailOf(p,w)||NONE)));return [...s]}
function fillShelf(){const need=[...new Set(rows.slice(0,4).map(needOf))],pool=tailsOf(STAGES[stage].p);
 while(shelf.length<6)shelf.push(null);
 for(const t of need){if(shelf.some(x=>x&&x.t===t))continue;let j=shelf.findIndex(x=>!x);if(j<0)j=shelf.findIndex(x=>!need.includes(x.t));if(j>=0)shelf[j]={id:++TID,t,fresh:1}}
 for(let i=0;i<6;i++)if(!shelf[i]){let t,k=0;do{t=pick(pool)}while(shelf.some(x=>x&&x.t===t)&&k++<30);shelf[i]={id:++TID,t,fresh:1}}
 drawShelf()}
function drawShelf(){$('shelf').innerHTML=shelf.map((x,i)=>`<button class="tl ${x.t===NONE?'z':isSoft(x.t)?'s':'h'} ${x.fresh?'new':''}" data-i="${i}">${x.t===NONE?'∅ без':'-'+x.t}</button>`).join('');
 shelf.forEach(x=>delete x.fresh);$('shelf').querySelectorAll('.tl').forEach(b=>b.onclick=()=>useTail(+b.dataset.i,b))}
/* ---------- почему нельзя ---------- */
function why(r,t){const need=needOf(r);
 if(need===NONE)return `<span class="kk">${r.p}</span> — без хвостика! Жми <b>∅</b> 😎`;
 if(t===NONE)return `<span class="kk">${r.p}</span> — нужен хвостик ${PERS[r.p]}: <span class="kk">-${need}</span>`;
 const tp=TAILP[t];if(tp&&tp!==r.p)return `<span class="kk">${r.p}</span> — значит хвостик ${PERS[r.p]}: <span class="kk">-${need}</span> 👀`;
 if(isSoft(t)!==isSoft(need))return `<span class="kk">${r.w}</span> — ${isSoft(r.w)?'мягкое слово → розовый':'твёрдое слово → синий'} хвостик 🎨`;
 const l=r.w.slice(-1);if(t[0]!==need[0])return need[0]==='п'?`<span class="kk">${r.w}</span> — на шептуна «${l}» 🤫 → <span class="kk">-${need}</span>`:need[0]==='б'?`<span class="kk">${r.w}</span> — на жужжалку «${l}» 🐝 → <span class="kk">-${need}</span>`:`<span class="kk">${r.w}</span> — спокойная буква 😌 → <span class="kk">-${need}</span>`;
 return `Нужен <span class="kk">-${need}</span>`}
/* ---------- физика: ряды всё время ползут вниз; сверху маленькие, внизу большие ---------- */
const BASEH=60,PAD=8;let MAXR=7,EDGEY=0;
let rows=[],shelf=[],sel=null,score=0,combo=0,mist=0,stage=0,interval=6500,nextAt=0,running=false,RID=0,TID=0,lastP='',timer=0,lastT=0,vFall=34,shakeT=0;
const pitH=()=>$('pit').clientHeight;
function scaleAt(yc){const t=Math.max(0,Math.min(1,yc/pitH()));return .55+.45*t}
/* где должен лежать ряд с номером i (снизу вверх) */
function targets(){const out=[];let yb=pitH()-PAD;for(let i=0;i<rows.length;i++){const s=scaleAt(yb-BASEH*.5),h=BASEH*s;out.push({y:yb-h,s});yb-=h+2}return out}
function calcEdge(){let yb=pitH()-PAD;for(let i=0;i<MAXR;i++){const s=scaleAt(yb-BASEH*.5);yb-=BASEH*s+2}EDGEY=yb}
function calcMax(){let n=0,yb=pitH()-PAD;while(yb>90&&n<10){const s=scaleAt(yb-BASEH*.5);yb-=BASEH*s+2;if(yb>86)n++}MAXR=Math.max(4,n);calcEdge();$('edge').style.top=EDGEY+'px'}
function rowHTML(r){return `<span class="cb p">${r.p}</span><span class="cb w">${r.w}</span><span class="cb q">?</span>`}
function spawn(){const ps=STAGES[stage].p;let p=pick(ps);if(p===lastP&&ps.length>1)p=pick(ps);lastP=p;const [w,ru]=pick(COMBOS[p]);
 const r={id:++RID,p,w,ru,ready:true,y:-BASEH,s:.55,landed:false};const el=document.createElement('div');el.className='row';el.innerHTML=rowHTML(r);r.el=el;
 el.onclick=()=>{if(!running)return;sel=sel===r.id?null:r.id;mark();SFX.tick()};
 rows.push(r);$('pit').appendChild(el);fillShelf();mark()}
function mark(){rows.forEach(r=>r.el&&r.el.classList.toggle('sel',sel===r.id));const lowest=rows[0];rows.forEach(r=>r.el&&r.el.classList.toggle('next',!sel&&r===lowest))}
function physics(dt){const T=targets();let landedN=0;
 rows.forEach((r,i)=>{const t=T[i];if(!r.el)return;const sp=r.landed?900:vFall;
  if(r.y<t.y){r.y=Math.min(t.y,r.y+sp*dt);if(r.y>=t.y&&!r.landed){r.landed=true;SFX.thud();r.el.classList.add('land');setTimeout(()=>r.el&&r.el.classList.remove('land'),300)}}
  else r.y=t.y;
  r.s=scaleAt(r.y+BASEH*.5);r.el.style.transform=`translateY(${r.y.toFixed(1)}px) scale(${r.s.toFixed(3)})`;
  if(r.landed)landedN++});
 const top=rows.length?rows.filter(r=>r.landed).length:0;
 $('pit').classList.toggle('danger',top>=MAXR-1);$('edge').classList.toggle('warn',top>=MAXR-1);
 if(top>MAXR)gameOver()}
function loop(now){if(!running)return;const dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;
 const falling=rows.some(r=>!r.landed);
 if(now>=nextAt||(!falling&&nextAt-now>1500)){spawn();nextAt=now+interval}
 $('bar').style.transform=`scaleX(${Math.max(0,Math.min(1,(nextAt-now)/interval)).toFixed(3)})`;
 physics(dt);timer=requestAnimationFrame(loop)}
/* ---------- эффекты ---------- */
function sparks(rc,n){if(RM)return;const ch=['✨','⭐','💥','✨'];for(let i=0;i<n;i++){const f=document.createElement('div');f.className='spark';f.textContent=ch[i%4];f.style.left=(rc.left+Math.random()*rc.width)+'px';f.style.top=(rc.top+rc.height/2-10)+'px';
 f.style.setProperty('--dx',(Math.random()*160-80)+'px');f.style.setProperty('--dy',(-40-Math.random()*90)+'px');f.style.setProperty('--r',(Math.random()*300-150)+'deg');document.body.appendChild(f);setTimeout(()=>f.remove(),950)}}
function shards(rc){if(RM)return;const cols=['#ff8a3d','#fff8ea','#2f6fd6','#e05a9c','#ffd96a'];for(let i=0;i<14;i++){const f=document.createElement('div');f.className='shard';f.style.background=cols[i%5];
 f.style.left=(rc.left+Math.random()*rc.width)+'px';f.style.top=(rc.top+Math.random()*rc.height)+'px';const a=Math.random()*Math.PI*2,d=60+Math.random()*120;
 f.style.setProperty('--dx',Math.cos(a)*d+'px');f.style.setProperty('--dy',(Math.sin(a)*d+80)+'px');f.style.setProperty('--r',(Math.random()*720-360)+'deg');document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
 const fl=document.createElement('div');fl.className='flash';fl.style.left=(rc.left+rc.width/2)+'px';fl.style.top=(rc.top+rc.height/2)+'px';document.body.appendChild(fl);setTimeout(()=>fl.remove(),500)}
function shake(px){if(RM)return;$('app').animate([{transform:'none'},{transform:`translate(${px}px,${px/2}px)`},{transform:`translate(${-px}px,0)`},{transform:`translate(${px/2}px,${-px/2}px)`},{transform:'none'}],{duration:260})}
function bigText(t){const b=$('big');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on')}
/* ---------- ход ---------- */
async function useTail(i,btn){if(!running)return;ac();const x=shelf[i];if(!x)return;let r=rows.find(q=>q.id===sel)||rows[0];
 if(!r||!r.ready){aina('Подожди, кубик ещё падает ⏳',1500);return}
 if(needOf(r)!==x.t){mist++;combo=0;hud();SFX.bad();btn.classList.add('bad');r.el.classList.add('bad');setTimeout(()=>{btn.classList.remove('bad');r.el&&r.el.classList.remove('bad')},420);aina(why(r,x.t),3800);shake(4);nextAt=Math.min(nextAt,performance.now()+500);return}
 r.ready=false;sel=null;shelf[i]=null;const q=r.el.querySelector('.cb.q'),b0=btn.getBoundingClientRect(),b1=q.getBoundingClientRect();
 if(!RM){const f=btn.cloneNode(true);f.className=btn.className+' fly';f.style.left=b0.left+'px';f.style.top=b0.top+'px';f.style.width=b0.width+'px';f.style.height=b0.height+'px';document.body.appendChild(f);btn.style.visibility='hidden';
  await f.animate([{transform:'none'},{transform:`translate(${b1.left-b0.left}px,${b1.top-b0.top}px) scale(${(b1.width/b0.width).toFixed(2)})`}],{duration:240,easing:'ease-in'}).finished.catch(()=>{});f.remove()}
 SFX.good();const wc=r.el.querySelector('.cb.w');q.remove();
 if(x.t!==NONE){wc.className='cb mg';wc.innerHTML=`${r.w}<i class="${isSoft(x.t)?'s':'h'}">${x.t}</i>`}else wc.className='cb mg';
 combo++;const gain=10*Math.min(combo,5);score+=gain;hud();
 const rc=r.el.getBoundingClientRect(),pr=$('pit').getBoundingClientRect();
 const tr=document.createElement('div');tr.className='tr';tr.style.top=Math.max(4,rc.top-pr.top-30)+'px';tr.textContent=`${r.p} ${r.w}${x.t===NONE?'':x.t} — ${PRU[r.p]} ${r.ru}  +${gain}`;$('pit').appendChild(tr);setTimeout(()=>tr.remove(),1500);
 if(combo>=2)bigText(combo>=5?`×${combo}! Мықты! 🔥`:`×${combo}! 🔥`);
 await wait(200);SFX.boom();const rc2=r.el.getBoundingClientRect();shards(rc2);sparks(rc2,7);shake(combo>=3?7:4);r.el.classList.add('boom');await wait(380);
 r.el.remove();r.el=null;rows=rows.filter(q=>q!==r);rows.forEach(q=>{if(q.landed)q.landed=true});mark();
 interval=Math.max(2800,interval-110);vFall=Math.min(95,vFall+1.6);
 let ns=0;STAGES.forEach((s,j)=>{if(score>=s.at)ns=j});
 if(ns>stage){stage=ns;SFX.up();aina(STAGES[stage].say,3600)}
 fillShelf();if(!rows.length)nextAt=Math.min(nextAt,performance.now()+400)}
function hud(){$('sc').textContent=score;$('cm').textContent=combo;$('mi').textContent=mist;$('cmp').classList.toggle('hot',combo>=3)}
function start(){$('pit').querySelectorAll('.row,.tr').forEach(e=>e.remove());rows=[];shelf=[];sel=null;score=0;combo=0;mist=0;stage=0;interval=6500;vFall=34;lastP='';lastT=0;hud();
 $('start').classList.add('off');$('over').classList.add('off');running=true;ac();fillShelf();calcMax();nextAt=performance.now()+200;cancelAnimationFrame(timer);timer=requestAnimationFrame(loop);aina(STAGES[0].say,2600)}
function gameOver(){if(!running)return;running=false;cancelAnimationFrame(timer);SFX.over();shake(10);let best=0;try{best=+localStorage.getItem('tilashar-yama-best')||0;if(score>best){localStorage.setItem('tilashar-yama-best',score);best=score}}catch(e){}
 $('ot').innerHTML=`Очки: <b>${score}</b> · рекорд: <b>${best}</b><br>Ошибок: ${mist}`;setTimeout(()=>$('over').classList.remove('off'),600)}
let paused=0;document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;cancelAnimationFrame(timer);paused=performance.now()}else if(!document.hidden&&paused){nextAt+=performance.now()-paused;paused=0;lastT=0;running=true;timer=requestAnimationFrame(loop)}});
addEventListener('resize',()=>{calcMax()});
$('play').onclick=start;$('again').onclick=start;
window.__Y={dbg:()=>({MAXR,EDGEY,ph:pitH(),landed:rows.filter(r=>r.landed).length,ys:rows.map(r=>Math.round(r.y))}),rows:()=>rows,shelf:()=>shelf,needOf,useTail:i=>useTail(i,$('shelf').querySelectorAll('.tl')[i]),start,score:()=>score,stage:()=>stage,running:()=>running,spawn};
}
