<style>
#cityBtn{padding:8px 10px;font-size:14px;min-width:0;white-space:nowrap}
#cityGrid{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:1;background:#7f858c}
.tile{position:absolute;overflow:hidden;cursor:pointer}
.tile .tw{position:absolute;left:0;top:0;width:832px;height:832px;transform-origin:0 0}
.tile .tw img{position:absolute}
.tl{position:absolute;left:3px;top:3px;background:rgba(255,255,255,.88);border-radius:6px;font-size:10px;padding:1px 4px;color:#333;pointer-events:none;max-width:94%;white-space:nowrap;overflow:hidden}
.rails{position:absolute;left:0;right:0;background:repeating-linear-gradient(90deg,#7a5a3a 0 3px,transparent 3px 8px),#bdb39b;border-top:3px solid #5d6570;border-bottom:3px solid #5d6570;box-sizing:border-box}
.river{position:absolute;left:0;right:0;background:#6db6e0}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f1ea;color:#2b2b2b}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
h1{font-size:15px;margin:0;font-weight:600}
#st{font-size:13px;color:#5f7d3a;white-space:nowrap}
#stage{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:1;overflow:hidden;touch-action:none;user-select:none}
#world{position:absolute;left:0;top:0;width:832px;height:832px;transform-origin:0 0}
.it{position:absolute;display:flex;align-items:flex-end;justify-content:center;cursor:grab}
.it img{display:block;pointer-events:none;-webkit-user-drag:none}
.it.sel img{filter:drop-shadow(0 0 3px #2f7df6) drop-shadow(0 0 3px #2f7df6)}
.it.bad img{filter:drop-shadow(0 0 3px #e53935) drop-shadow(0 0 4px #e53935)}
.it.sel.bad img{filter:drop-shadow(0 0 3px #2f7df6) drop-shadow(0 0 5px #e53935)}
#bar{display:flex;gap:6px;justify-content:center;padding:10px 8px 4px;flex-wrap:wrap}
button{font:inherit;font-size:16px;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:10px 14px;min-width:48px}
button:disabled{opacity:.35}
#hint{text-align:center;font-size:13px;color:#777;padding:2px 12px 6px;min-height:20px}
#pal{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 14px;max-width:640px;margin:0 auto}
#pal div{flex:0 0 64px;height:64px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#pal img{max-width:52px;max-height:52px}
.lbl{font-size:13px;color:#777;padding:6px 12px 0;max-width:640px;margin:0 auto}
.row{display:flex;gap:6px;justify-content:center;padding:6px 8px;flex-wrap:wrap;max-width:640px;margin:0 auto}
button{color:#2b2b2b}button.on{background:#2f7df6;color:#fff}
#sty{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;max-width:640px;margin:0 auto}
#sty div{flex:0 0 58px;text-align:center;font-size:11px;color:#555}
#sty svg{width:54px;height:54px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);background:#99bc65;display:block;margin:0 auto 2px;border:3px solid transparent}
#sty div.on svg{border-color:#2f7df6}
.hide{display:none!important}.draw .it{opacity:.55}
#zRow button,#bar button,#bar2 button,#pathUI button{padding:8px 10px;min-width:42px;font-size:16px}
#cityBtn{font-size:20px!important;padding:6px 10px!important}
#hint{display:none!important}
#pcat button{flex:0 0 auto;padding:7px 10px;font-size:14px;white-space:nowrap;min-width:0}
#reset{display:block;margin:6px auto 24px;font-size:14px;background:transparent;box-shadow:none;color:#a33}
