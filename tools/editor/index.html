.tile{position:absolute;overflow:hidden;cursor:pointer}
.tile .tw{position:absolute;left:0;top:0;width:832px;height:832px;transform-origin:0 0}

button{font:inherit;font-size:16px;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:10px 14px;min-width:48px}
button:disabled{opacity:.35}
#hint{text-align:center;font-size:13px;color:#777;padding:2px 12px 6px;min-height:20px}
#pal{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 14px;max-width:640px;margin:0 auto}
#pal div{flex:0 0 64px;height:64px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}

.lbl{font-size:13px;color:#777;padding:6px 12px 0;max-width:640px;margin:0 auto}
.row{display:flex;gap:6px;justify-content:center;padding:6px 8px;flex-wrap:wrap;max-width:640px;margin:0 auto}
button{color:#2b2b2b}button.on{background:#2f7df6;color:#fff}
#sty{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;max-width:640px;margin:0 auto}

#sty div.on svg{border-color:#2f7df6}
.hide{display:none!important}.draw .it{opacity:.55}

 document.getElementById('pathUI').classList.toggle('hide',m==='move'||m==='pan');document.getElementById('objUI').classList.toggle('hide',m==='draw'||m==='erase');world.classList.toggle('draw',m==='draw'||m==='erase');sel=-1;render()}

function resize(dl){if(psel<0)return;var p=paths[psel];if(!p||p.ell)return;snap();var a=p.pts[p.pts.length-2],b=p.pts[p.pts.length-1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(!L)return;
 var nl=Math.max(20,L+dl);b=[Math.round(a[0]+(b[0]-a[0])*nl/L),Math.round(a[1]+(b[1]-a[1])*nl/L)];b[0]=Math.max(O,Math.min(O+B,b[0]));b[1]=Math.max(O,Math.min(O+B,b[1]));p.pts[p.pts.length-1]=b;drawPaths();render();save()}

function loadLocal(id){try{var ls=localStorage.getItem(keyOf(id));var _l=ls?JSON.parse(ls):null;var it=_l?clean(Array.isArray(_l)?_l:_l.items):[];if(!it.length)it=blkInit(id);var pa=(_l&&!Array.isArray(_l)&&Array.isArray(_l.paths))?cleanPaths(_l.paths):defPaths();if(id==='aina')markAina(it);return {items:it,paths:pa}}catch(e){var a=blkInit(id);if(id==='aina')markAina(a);return {items:a,paths:defPaths()}}}
function docData(s){var d=s&&(s.data?(typeof s.data==='function'?s.data():s.data):s);return d?JSON.parse(JSON.stringify(d)):null}
function fromDb(id,cb){if(!db)return;try{db.doc('layouts/'+id).get().then(function(s){var d=docData(s);if(d&&d.items&&clean(d.items).length){var it=clean(d.items);if(id==='aina')markAina(it);var v={items:it,paths:Array.isArray(d.paths)?cleanPaths(d.paths):defPaths()};CACHE[id]=v;cb(v)}}).catch(function(){})}catch(e){}}

 var v=CACHE[id]||loadLocal(id);items=JSON.parse(JSON.stringify(v.items));paths=JSON.parse(JSON.stringify(v.paths));sel=-1;hist=[];psel=-1;
 document.getElementById('cityView').classList.add('hide');document.getElementById('edView').classList.remove('hide');setMode('move');ZM=1;TX=0;TY=0;drawPaths();fit();
 try{localStorage.setItem('tilashar-editor-cur',id)}catch(e){}
 fromDb(id,function(v){if(cur!==id||drag||stroke||hdrag||bdrag)return;items=JSON.parse(JSON.stringify(v.items));paths=JSON.parse(JSON.stringify(v.paths));sel=-1;hist=[];drawPaths();render();setSt('Загружено ✓')})}
function tileHTML(b,v,L,T,S){var k=S/832,h='<div class="tile" data-b="'+b.id+'" style="left:'+L+'px;top:'+T+'px;width:'+S+'px;height:'+S+'px"><div class="tw" style="transform:scale('+k+')">';
 h+='<svg width="832" height="832" style="position:absolute;left:0;top:0"><rect width="832" height="832" fill="#7f858c"/><rect x="'+O+'" y="'+O+'" width="'+B+'" height="'+B+'" fill="'+(b.id==='spare'?'#c5dca6':'#99bc65')+'"/><g clip-path="url(#blk)">';
 (v.paths||[]).forEach(function(p){h+=pathSVG(p)});h+='</g></svg>';
 (v.items||[]).slice().sort(function(a,c){return zi(a)-zi(c)}).forEach(function(it){var hh=it.w*(ASP[it.n]||1);h+='<img src="art/'+it.n+'.webp" style="left:'+(it.x-it.w/2)+'px;top:'+(it.b-hh)+'px;width:'+it.w+'px;height:'+hh+'px;'+(it.f?'transform:scaleX(-1)':'')+'">'});
 return h+'</div><div class="tl">'+b.th+' '+b.nm+'</div></div>'}
function showCity(){if(cur&&items.length){save()}document.getElementById('edView').classList.add('hide');document.getElementById('cityView').classList.remove('hide');document.getElementById('bname').textContent='Весь город';
 var g=document.getElementById('cityGrid'),W0=g.clientWidth,gap=Math.max(6,W0*0.02),riv=Math.max(10,W0*0.035),S=(W0-gap*5-riv)/4;
 function pos(b){return [gap+b.c*(S+gap), gap+b.r*(S+gap)+(b.r>=1?riv:0)]}
