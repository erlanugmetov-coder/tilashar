<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f1ea;color:#2b2b2b}

.it.sel img{filter:drop-shadow(0 0 3px #2f7df6) drop-shadow(0 0 3px #2f7df6)}
.it.bad img{filter:drop-shadow(0 0 3px #e53935) drop-shadow(0 0 4px #e53935)}
.it.sel.bad img{filter:drop-shadow(0 0 3px #2f7df6) drop-shadow(0 0 5px #e53935)}
.draw .it{pointer-events:none;opacity:.55}
.row{display:flex;gap:6px;justify-content:center;padding:6px 8px;flex-wrap:wrap;max-width:640px;margin:0 auto}
button{font:inherit;font-size:16px;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:10px 14px;min-width:48px;color:#2b2b2b}
button:disabled{opacity:.35}
button.on{background:#2f7df6;color:#fff}
.mode button{font-size:15px}
#hint{text-align:center;font-size:13px;color:#777;padding:6px 12px 2px;min-height:20px}
#sty{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;max-width:640px;margin:0 auto}
#sty div{flex:0 0 58px;text-align:center;font-size:11px;color:#555}
#sty svg{width:54px;height:54px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);background:#99bc65;display:block;margin:0 auto 2px;border:3px solid transparent}
#sty div.on svg{border-color:#2f7df6}
#pal{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 14px;max-width:640px;margin:0 auto}
#pal div{flex:0 0 64px;height:64px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#pal img{max-width:52px;max-height:52px}
.lbl{font-size:13px;color:#777;padding:6px 12px 0;max-width:640px;margin:0 auto}
#reset{display:block;margin:6px auto 24px;font-size:14px;background:transparent;box-shadow:none;color:#a33}
.hide{display:none!important}
</style></head><body>
<header><h1>Квартал «Айнаның үйі»</h1><span id="st">…</span></header>
<div id="stage"><div id="world"><svg id="gr" width="832" height="832"><defs id="defs"></defs><g id="base"></g><g id="paths" clip-path="url(#blk)"></g></svg></div></div>
<div id="hint"></div>
<div class="row mode"><button id="mMove" class="on">✋ Двигать</button><button id="mDraw">✏️ Дорожка</button><button id="mErase">🧽 Ластик</button></div>
<div id="pathUI" class="hide">
 <div class="lbl">Вид дорожки:</div>
 <div id="sty"></div>
 <div class="row"><button id="w1">Узкая</button><button id="w2" class="on">Средняя</button><button id="w3">Широкая</button></div>
 <div class="row"><button id="allSty" style="font-size:14px">Все дорожки — в этот вид</button><button id="pUn">↩️</button></div>
</div>
<div id="objUI">
 <div class="row">
 <button id="bSm" title="меньше">➖</button><button id="bBg" title="больше">➕</button><button id="bFl" title="отразить">⇋</button><button id="bDel" title="убрать">🗑</button><button id="bUn" title="отменить">↩️</button>
 </div>

 <div class="lbl">Добавить:</div>
 <div id="pal"></div>
</div>
<button id="reset">Вернуть исходную расстановку</button>
<script>

var O=56,B=720,W=832,CX=O+B/2,CY=O+B/2;
var PAL=['yard_court','statue_hero','sandbox','workout','gazebo','dovecote','skate','flower_arch','roundabout','tree1','tree2','tree_birch','tree_poplar','tree_karagach','sapling','bush','bush_flowers','flowers','bench','lamp','drink_fount','aga','apa','kid_boy','kid_girl','teacher','pcafe','play','fount','house','school','hosp','studio','stage','stad_wide'];
var PALW={yard_court:200,statue_hero:110,sandbox:150,workout:170,gazebo:150,dovecote:120,skate:190,flower_arch:120,roundabout:140,tree1:94,tree2:94,tree_birch:85,tree_poplar:43,tree_karagach:100,sapling:40,bush:50,bush_flowers:50,flowers:51,bench:68,lamp:22,drink_fount:30,aga:29,apa:29,kid_boy:26,kid_girl:26,teacher:29,pcafe:180,play:195,fount:128,house:196,school:196,hosp:196,studio:179,stage:179,stad_wide:268};
var STY=[
 {id:'tile',nm:'Плитка'},{id:'tile_grey',nm:'Серая'},{id:'tile_terra',nm:'Терракот'},{id:'stones',nm:'Шаги'},
 {id:'brick',nm:'Кирпич'},{id:'gravel',nm:'Гравий'},{id:'wood',nm:'Доски'},{id:'rub_g',nm:'Резина'},{id:'rub_r',nm:'Резина'}];
var COL={tile:['#ddd6c3','#c4bba3'],tile_grey:['#c9cbcc','#a9adb0'],tile_terra:['#d9a27e','#b9805c'],stones:['#d9d2bf','#b3aa92'],brick:['#c0634a','#9a4a35'],gravel:['#e3dccb','#c7bea8'],wood:['#c99a62','#9c7444'],rub_g:['#5fa35a','#467d42'],rub_r:['#c9574b','#9c3f35']};
function defPaths(){return [{st:'tile',w:44,pts:[[CX,O],[CX,O+B]]},{st:'tile',w:44,pts:[[O,CY],[O+B,CY]]},{st:'tile',ell:[CX,CY,95,70]}]}
var items=[],paths=[],sel=-1,hist=[],sc=1,db=null,KEY='tilashar-editor-aina-v1',mode='move',curSty='tile',curW=44;
var world=document.getElementById('world'),stage=document.getElementById('stage');
function patDefs(){return '<pattern id="p_brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#c0634a"/><path d="M0 6H24M12 0V6M0 6V12M24 6V12" stroke="#e8c9b0" stroke-width="1.5"/></pattern>'+
 '<pattern id="p_gravel" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e3dccb"/><circle cx="3" cy="4" r="1.4" fill="#b9af97"/><circle cx="10" cy="9" r="1.2" fill="#a89f88"/><circle cx="7" cy="2" r=".9" fill="#cfc6b0"/><circle cx="12" cy="3" r="1" fill="#bdb49c"/><circle cx="4" cy="11" r="1.1" fill="#c3baa3"/></pattern>'+
 '<pattern id="p_wood" width="14" height="40" patternUnits="userSpaceOnUse"><rect width="14" height="40" fill="#c99a62"/><path d="M0 0V40M14 0V40" stroke="#8f683c" stroke-width="1.5"/><path d="M0 22H14" stroke="#a87b48" stroke-width="1"/></pattern>'+
 '<pattern id="p_tile" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#ddd6c3"/><path d="M0 0H16M0 0V16" stroke="#cbc2aa" stroke-width="1"/></pattern>'+
 '<pattern id="p_tile_grey" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#c9cbcc"/><path d="M0 0H16M0 0V16" stroke="#b2b5b8" stroke-width="1"/></pattern>'+
 '<pattern id="p_tile_terra" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#d9a27e"/><path d="M0 0H16M0 0V16" stroke="#c2896a" stroke-width="1"/></pattern>'}
function fillOf(st){return st==='rub_g'||st==='rub_r'?COL[st][0]:'url(#p_'+st+')'}
function dPath(p){return 'M'+p.pts.map(function(q){return q[0]+' '+q[1]}).join('L')}
function stonesAlong(p,col){var s='',step=Math.max(18,p.w*.85),acc=step/2;
 for(var i=1;i<p.pts.length;i++){var a=p.pts[i-1],b=p.pts[i],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(!L)continue;var ang=Math.atan2(dy,dx)*180/Math.PI;
  while(acc<=L){var x=a[0]+dx*acc/L,y=a[1]+dy*acc/L,rw=p.w*.42,rh=p.w*.30;s+='<ellipse cx="'+x.toFixed(1)+'" cy="'+(y+2).toFixed(1)+'" rx="'+rw.toFixed(1)+'" ry="'+rh.toFixed(1)+'" transform="rotate('+(ang+90).toFixed(0)+' '+x.toFixed(1)+' '+y.toFixed(1)+')" fill="'+col[1]+'"/><ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="'+rw.toFixed(1)+'" ry="'+rh.toFixed(1)+'" transform="rotate('+(ang+90).toFixed(0)+' '+x.toFixed(1)+' '+y.toFixed(1)+')" fill="'+col[0]+'"/>';acc+=step}
  acc-=L}return s}
function pathSVG(p){var c=COL[p.st]||COL.tile;
 if(p.ell){var e=p.ell;if(p.st==='stones'){var s='',n=14;for(var k=0;k<n;k++){var a=k/n*2*Math.PI,x=e[0]+Math.cos(a)*e[2]*.72,y=e[1]+Math.sin(a)*e[3]*.72;s+='<ellipse cx="'+x.toFixed(1)+'" cy="'+(y+2).toFixed(1)+'" rx="15" ry="11" fill="'+c[1]+'"/><ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="15" ry="11" fill="'+c[0]+'"/>'}return s}
  return '<ellipse cx="'+e[0]+'" cy="'+(e[1]+3)+'" rx="'+e[2]+'" ry="'+e[3]+'" fill="'+c[1]+'"/><ellipse cx="'+e[0]+'" cy="'+e[1]+'" rx="'+e[2]+'" ry="'+e[3]+'" fill="'+fillOf(p.st)+'"/>'}
 if(p.st==='stones')return stonesAlong(p,c);
 var d=dPath(p);return '<path d="'+d+'" fill="none" stroke="'+c[1]+'" stroke-width="'+(p.w+5)+'" stroke-linecap="round" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="'+fillOf(p.st)+'" stroke-width="'+p.w+'" stroke-linecap="round" stroke-linejoin="round"/>'}
function drawPaths(extra){var s='';paths.forEach(function(p){s+=pathSVG(p)});if(extra)s+=pathSVG(extra);document.getElementById('paths').innerHTML=s}
function ground(){var g='',road='#7f858c';
 g+='<rect width="832" height="832" fill="'+road+'"/><rect x="'+O+'" y="'+O+'" width="'+B+'" height="'+B+'" fill="#99bc65" stroke="#c9c2b0" stroke-width="5"/>';
 for(var x=0;x<W;x+=40){g+='<line x1="'+x+'" y1="28" x2="'+(x+20)+'" y2="28" stroke="#fff" stroke-width="3"/><line x1="'+x+'" y1="804" x2="'+(x+20)+'" y2="804" stroke="#fff" stroke-width="3"/><line x1="28" y1="'+x+'" x2="28" y2="'+(x+20)+'" stroke="#fff" stroke-width="3"/><line x1="804" y1="'+x+'" x2="804" y2="'+(x+20)+'" stroke="#fff" stroke-width="3"/>'}
 document.getElementById('base').innerHTML=g;document.getElementById('defs').innerHTML=patDefs()+'<clipPath id="blk"><rect x="'+O+'" y="'+O+'" width="'+B+'" height="'+B+'"/></clipPath>'}
function fit(){sc=stage.clientWidth/W;world.style.transform='scale('+sc+')';render()}
function segD(px,py,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy,t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function onPath(x,y,pad){pad=pad||0;for(var i=0;i<paths.length;i++){var p=paths[i];
  if(p.ell){var e=p.ell,dx=(x-e[0])/(e[2]+pad),dy=(y-e[1])/(e[3]+pad);if(dx*dx+dy*dy<1)return i;continue}
  if(p.pts.length===1){if(Math.hypot(x-p.pts[0][0],y-p.pts[0][1])<p.w/2+pad)return i;continue}
  for(var j=1;j<p.pts.length;j++)if(segD(x,y,p.pts[j-1],p.pts[j])<p.w/2+pad)return i}return -1}
function inBad(x,y){if(x<O||x>O+B||y<O||y>O+B)return true;return onPath(x,y)>=0}
function bad(it){if(it.n==='fount')return false;var h=it.w*(ASP[it.n]||1),fh=Math.min(h*.12,18),xs=[it.x-it.w*.32,it.x,it.x+it.w*.32],ys=[it.b-fh,it.b-1];
 for(var i=0;i<3;i++)for(var j=0;j<2;j++)if(inBad(xs[i],ys[j]))return true;return false}
function zi(it){return Math.round(it.b+(it.z||0))+2000}
function render(){var s='',min=40/sc;
 items.forEach(function(it,i){var h=it.w*(ASP[it.n]||1),bw=Math.max(it.w,min),bh=Math.max(h,min);
  s+='<div class="it'+(i===sel&&mode==='move'?' sel':'')+(bad(it)?' bad':'')+'" data-i="'+i+'" style="left:'+(it.x-bw/2)+'px;top:'+(it.b-bh)+'px;width:'+bw+'px;height:'+bh+'px;z-index:'+zi(it)+'"><img src="art/'+it.n+'.webp" style="width:'+it.w+'px;height:'+h+'px;'+(it.f?'transform:scaleX(-1)':'')+'"></div>'});
 world.querySelectorAll('.it').forEach(function(e){e.remove()});world.insertAdjacentHTML('beforeend',s);
 var on=sel>=0;['bSm','bBg','bFl','bDel','bL','bU','bD','bR','bFw','bBk'].forEach(function(id){document.getElementById(id).disabled=!on});
 document.getElementById('bUn').disabled=!hist.length;document.getElementById('pUn').disabled=!hist.length;
 var nb=items.filter(bad).length,h='';
 if(mode==='draw')h='Ведите пальцем — дорожка ложится';else if(mode==='erase')h='Проведите по дорожке — она исчезнет';
 else h=nb?('Красным — стоит на дорожке ('+nb+')'):(on?'Тащите, меняйте размер кнопками':'Нажмите на постройку и тащите пальцем');
 document.getElementById('hint').textContent=h}
function snap(){hist.push(JSON.stringify({i:items,p:paths}));if(hist.length>40)hist.shift()}
function undo(){if(!hist.length)return;var o=JSON.parse(hist.pop());items=o.i;paths=o.p;sel=-1;drawPaths();render();save()}
var stT=null;function setSt(t){document.getElementById('st').textContent=t}
function save(){var data={items:items,paths:paths};try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}

  if(!db){setSt('Сохранено на телефоне');return}
  db.doc('layouts/aina').set({items:items,paths:paths,t:Date.now()}).then(function(){setSt('Сохранено ✓')}).catch(function(){setSt('Сохранено на телефоне')})},500)}
function wpt(e){var r=stage.getBoundingClientRect();return [Math.round((e.clientX-r.left)/sc),Math.round((e.clientY-r.top)/sc)]}
var drag=null,stroke=null,erasing=false;

function act(f){if(sel<0)return;snap();f(items[sel]);render();save()}
document.getElementById('bSm').onclick=function(){act(function(it){it.w=Math.max(12,Math.round(it.w*.9))})};
