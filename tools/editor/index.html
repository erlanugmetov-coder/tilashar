<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тілашар · редактор квартала</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f1ea;color:#2b2b2b}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
h1{font-size:17px;margin:0;font-weight:600}
#st{font-size:13px;color:#5f7d3a;white-space:nowrap}
#stage{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:1;overflow:hidden;touch-action:none;user-select:none}
#world{position:absolute;left:0;top:0;width:832px;height:832px;transform-origin:0 0}
.it{position:absolute;display:flex;align-items:flex-end;justify-content:center;cursor:grab}
.it img{display:block;pointer-events:none;-webkit-user-drag:none}
.it.sel img{filter:drop-shadow(0 0 3px #2f7df6) drop-shadow(0 0 3px #2f7df6)}
.it.bad img{filter:drop-shadow(0 0 3px #e53935) drop-shadow(0 0 4px #e53935)}
.it.sel.bad img{filter:drop-shadow(0 0 3px #2f7df6) drop-shadow(0 0 5px #e53935)}
#bar{display:flex;gap:6px;justify-content:center;padding:10px 8px 4px;flex-wrap:wrap}
button{font:inherit;font-size:16px;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:10px 14px;min-width:48px}
button:disabled{opacity:.35}
#hint{text-align:center;font-size:13px;color:#777;padding:2px 12px 6px;min-height:20px}
#pal{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 14px;max-width:640px;margin:0 auto}
#pal div{flex:0 0 64px;height:64px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#pal img{max-width:52px;max-height:52px}
.lbl{font-size:13px;color:#777;padding:6px 12px 0;max-width:640px;margin:0 auto}
#reset{display:block;margin:6px auto 24px;font-size:14px;background:transparent;box-shadow:none;color:#a33}
</style></head><body>
<header><h1>Квартал «Айнаның үйі»</h1><span id="st">…</span></header>
<div id="stage"><div id="world"><svg id="gr" width="832" height="832"></svg></div></div>
<div id="hint">Нажмите на постройку и тащите пальцем</div>
<div id="bar">
<button id="bSm" title="меньше">➖</button><button id="bBg" title="больше">➕</button><button id="bFl" title="отразить">⇋</button><button id="bDel" title="убрать">🗑</button><button id="bUn" title="отменить">↩️</button>
</div>
<div id="bar2" style="display:flex;gap:6px;justify-content:center;padding:4px 8px;flex-wrap:wrap"><button id="bL">⬅️</button><button id="bU">⬆️</button><button id="bD">⬇️</button><button id="bR">➡️</button><button id="bFw" style="font-size:14px">Вперёд</button><button id="bBk" style="font-size:14px">Назад</button></div>
<div class="lbl">Добавить:</div>
<div id="pal"></div>
<button id="reset">Вернуть исходную расстановку</button>
<script>
var ASP={"aga": 1.7121, "apa": 1.878, "bench": 0.7724, "flowers": 0.714, "fount": 0.8133, "hosp": 0.809, "house": 0.8133, "kid_boy": 2.0087, "lamp": 2.4316, "school": 0.7967, "stad_wide": 0.4967, "stage": 0.9706, "studio": 0.84, "teacher": 2.1836, "tree1": 1.0711, "tree2": 1.5581, "tree_birch": 1.2398, "tree_poplar": 2.6609, "tree_karagach": 0.9684, "bush": 0.7012, "bush_flowers": 0.7103, "sapling": 1.7689, "drink_fount": 1.7124, "kid_girl": 1.9609, "pcafe": 0.6167, "play": 0.7767},INIT=[{"n": "school", "x": 156, "b": 288, "w": 195, "f": 0}, {"n": "house", "x": 324, "b": 324, "w": 195, "f": 0}, {"n": "hosp", "x": 684, "b": 288, "w": 195, "f": 0}, {"n": "tree1", "x": 706, "b": 384, "w": 93, "f": 1}, {"n": "tree_birch", "x": 606, "b": 386, "w": 85, "f": 1}, {"n": "tree2", "x": 686, "b": 506, "w": 93, "f": 1}, {"n": "fount", "x": 416, "b": 456, "w": 127, "f": 0}, {"n": "tree1", "x": 126, "b": 384, "w": 93, "f": 0}, {"n": "tree_birch", "x": 226, "b": 386, "w": 85, "f": 0}, {"n": "tree2", "x": 146, "b": 506, "w": 93, "f": 0}, {"n": "bench", "x": 286, "b": 491, "w": 68, "f": 0}, {"n": "bench", "x": 546, "b": 491, "w": 68, "f": 1}, {"n": "studio", "x": 538, "b": 324, "w": 178, "f": 0}, {"n": "stad_wide", "x": 246, "b": 746, "w": 267, "f": 0}, {"n": "stage", "x": 596, "b": 746, "w": 178, "f": 0}, {"n": "lamp", "x": 376, "b": 768, "w": 22, "f": 0}, {"n": "lamp", "x": 456, "b": 768, "w": 22, "f": 0}, {"n": "flowers", "x": 316, "b": 352, "w": 51, "f": 0}, {"n": "flowers", "x": 516, "b": 352, "w": 51, "f": 1}, {"n": "apa", "x": 476, "b": 526, "w": 28, "f": 0}, {"n": "kid_boy", "x": 356, "b": 531, "w": 25, "f": 0}, {"n": "aga", "x": 656, "b": 356, "w": 28, "f": 0}, {"n": "teacher", "x": 196, "b": 356, "w": 28, "f": 0}];
var R=56,B=720,O=56,W=832,CX=O+B/2,CY=O+B/2,PW=22,PRX=95,PRY=70;
var PAL=['tree1','tree2','tree_birch','tree_poplar','tree_karagach','sapling','bush','bush_flowers','flowers','bench','lamp','drink_fount','aga','apa','kid_boy','kid_girl','teacher','pcafe','play','fount','house','school','hosp','studio','stage','stad_wide'];
var PALW={tree1:94,tree2:94,tree_birch:85,tree_poplar:43,tree_karagach:100,sapling:40,bush:50,bush_flowers:50,flowers:51,bench:68,lamp:22,drink_fount:30,aga:29,apa:29,kid_boy:26,kid_girl:26,teacher:29,pcafe:180,play:195,fount:128,house:196,school:196,hosp:196,studio:179,stage:179,stad_wide:268};
var items=[],sel=-1,hist=[],sc=1,db=null,KEY='tilashar-editor-aina-v1';
var world=document.getElementById('world'),stage=document.getElementById('stage');
function ground(){var g='',road='#7f858c';
 g+='<rect width="832" height="832" fill="'+road+'"/><rect x="'+O+'" y="'+O+'" width="'+B+'" height="'+B+'" fill="#99bc65" stroke="#c9c2b0" stroke-width="5"/>';
 for(var x=0;x<W;x+=40){g+='<line x1="'+x+'" y1="28" x2="'+(x+20)+'" y2="28" stroke="#fff" stroke-width="3"/><line x1="'+x+'" y1="804" x2="'+(x+20)+'" y2="804" stroke="#fff" stroke-width="3"/><line x1="28" y1="'+x+'" x2="28" y2="'+(x+20)+'" stroke="#fff" stroke-width="3"/><line x1="804" y1="'+x+'" x2="804" y2="'+(x+20)+'" stroke="#fff" stroke-width="3"/>'}
 g+='<rect x="'+(CX-PW)+'" y="'+O+'" width="'+(2*PW)+'" height="'+B+'" fill="#ddd6c3"/><rect x="'+O+'" y="'+(CY-PW)+'" width="'+B+'" height="'+(2*PW)+'" fill="#ddd6c3"/><ellipse cx="'+CX+'" cy="'+CY+'" rx="'+PRX+'" ry="'+PRY+'" fill="#ddd6c3"/>';
 document.getElementById('gr').innerHTML=g}
function fit(){sc=stage.clientWidth/W;world.style.transform='scale('+sc+')';render()}
function inPath(x,y){if(x<O||x>O+B||y<O||y>O+B)return true;if(Math.abs(x-CX)<PW||Math.abs(y-CY)<PW)return true;var dx=(x-CX)/PRX,dy=(y-CY)/PRY;return dx*dx+dy*dy<1}
function bad(it){if(it.n==='fount')return false;var h=it.w*(ASP[it.n]||1),fh=Math.min(h*.12,18),xs=[it.x-it.w*.32,it.x,it.x+it.w*.32],ys=[it.b-fh,it.b-1];
 for(var i=0;i<3;i++)for(var j=0;j<2;j++)if(inPath(xs[i],ys[j]))return true;return false}
function zi(it){return Math.round(it.b+(it.z||0))+2000}
function render(){var s='',min=40/sc;
 items.forEach(function(it,i){var h=it.w*(ASP[it.n]||1),bw=Math.max(it.w,min),bh=Math.max(h,min);
  s+='<div class="it'+(i===sel?' sel':'')+(bad(it)?' bad':'')+'" data-i="'+i+'" style="left:'+(it.x-bw/2)+'px;top:'+(it.b-bh)+'px;width:'+bw+'px;height:'+bh+'px;z-index:'+zi(it)+'"><img src="art/'+it.n+'.webp" style="width:'+it.w+'px;height:'+h+'px;'+(it.f?'transform:scaleX(-1)':'')+'"></div>'});
 world.querySelectorAll('.it').forEach(function(e){e.remove()});world.insertAdjacentHTML('beforeend',s);
 var on=sel>=0;['bSm','bBg','bFl','bDel','bL','bU','bD','bR','bFw','bBk'].forEach(function(id){document.getElementById(id).disabled=!on});document.getElementById('bUn').disabled=!hist.length;
 var nb=items.filter(bad).length;document.getElementById('hint').textContent=nb?('Красным — стоит на дорожке ('+nb+')'):(on?'Тащите, меняйте размер кнопками':'Нажмите на постройку и тащите пальцем')}
function snap(){hist.push(JSON.stringify(items));if(hist.length>40)hist.shift()}
var stT=null;function setSt(t){document.getElementById('st').textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
 setSt('Сохраняю…');clearTimeout(stT);stT=setTimeout(function(){
  if(!db){setSt('Сохранено на телефоне');return}
  db.doc('layouts/aina').set({items:items,t:Date.now()}).then(function(){setSt('Сохранено ✓')}).catch(function(){setSt('Сохранено на телефоне')})},500)}
var drag=null;
stage.addEventListener('pointerdown',function(e){var el=e.target.closest('.it');
 if(!el){sel=-1;render();return}
 var i=+el.dataset.i;sel=i;snap();drag={i:i,sx:e.clientX,sy:e.clientY,x:items[i].x,b:items[i].b,moved:false};stage.setPointerCapture(e.pointerId);render();e.preventDefault()});
stage.addEventListener('pointermove',function(e){if(!drag)return;var it=items[drag.i];
 var dx=(e.clientX-drag.sx)/sc,dy=(e.clientY-drag.sy)/sc;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;
 it.x=Math.round(Math.max(10,Math.min(W-10,drag.x+dx)));it.b=Math.round(Math.max(20,Math.min(W-4,drag.b+dy)));
 var el=world.querySelector('.it[data-i="'+drag.i+'"]');if(el){var h=it.w*(ASP[it.n]||1),min=40/sc,bw=Math.max(it.w,min),bh=Math.max(h,min);el.style.left=(it.x-bw/2)+'px';el.style.top=(it.b-bh)+'px';el.style.zIndex=zi(it);el.classList.toggle('bad',bad(it))}});
function end(){if(!drag)return;if(drag.moved){items[drag.i].z=0;save()}else hist.pop();drag=null;render()}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
function act(f){if(sel<0)return;snap();f(items[sel]);render();save()}
document.getElementById('bSm').onclick=function(){act(function(it){it.w=Math.max(12,Math.round(it.w*.9))})};
document.getElementById('bBg').onclick=function(){act(function(it){it.w=Math.min(500,Math.round(it.w*1.1))})};
document.getElementById('bFl').onclick=function(){act(function(it){it.f=it.f?0:1})};
function nud(dx,dy){act(function(it){it.x+=dx;it.b+=dy})}
document.getElementById('bL').onclick=function(){nud(-3,0)};document.getElementById('bR').onclick=function(){nud(3,0)};
document.getElementById('bU').onclick=function(){nud(0,-3)};document.getElementById('bD').onclick=function(){nud(0,3)};
function others(){return items.filter(function(o,j){return j!==sel}).map(function(o){return o.b+(o.z||0)})}
document.getElementById('bFw').onclick=function(){act(function(it){var o=others();it.z=(o.length?Math.max.apply(0,o):it.b)-it.b+1})};
document.getElementById('bBk').onclick=function(){act(function(it){var o=others();it.z=(o.length?Math.min.apply(0,o):it.b)-it.b-1})};
document.getElementById('bDel').onclick=function(){if(sel<0)return;snap();items.splice(sel,1);sel=-1;render();save()};
document.getElementById('bUn').onclick=function(){if(!hist.length)return;items=JSON.parse(hist.pop());sel=-1;render();save()};
document.getElementById('reset').onclick=function(){if(!window.confirm||1){snap();items=JSON.parse(JSON.stringify(INIT));sel=-1;render();save()}};
var pal=document.getElementById('pal');PAL.forEach(function(n){var d=document.createElement('div');d.innerHTML='<img src="art/'+n+'.webp">';d.onclick=function(){snap();items.push({n:n,x:CX+(Math.random()*120-60),b:CY+150,w:PALW[n]||80,f:0});items[items.length-1].x=Math.round(items[items.length-1].x);sel=items.length-1;render();save()};pal.appendChild(d)});
ground();
try{var ls=localStorage.getItem(KEY);items=ls?JSON.parse(ls):JSON.parse(JSON.stringify(INIT))}catch(e){items=JSON.parse(JSON.stringify(INIT))}
window.addEventListener('resize',fit);fit();setSt('');
(async function(){try{if(!window.claude||!claude.use)return;db=await claude.use('db');if(!db){setSt('Сохраняется на телефоне');return}
 var to=setTimeout(function(){setSt('')},10000);var s=await db.doc('layouts/aina').get();clearTimeout(to);
 var d=s&&(s.data?(typeof s.data==='function'?s.data():s.data):s);
 if(d&&d.items&&d.items.length&&!drag){items=d.items;sel=-1;hist=[];render();setSt('Загружено ✓')}else setSt('')}catch(e){setSt('')}})();
</script></body></html>
