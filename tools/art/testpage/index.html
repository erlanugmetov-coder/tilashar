<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тілашар · новая графика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплая детская игра, без лишнего
   IDEA: кусок центра карты Тілашара, живой
   PICTURE: сама карта во всю ширину, панорама Алматы сверху
   COLOUR and TYPE: трава #99bc65, дороги серые, вывески как в игре; Nunito
   LAYOUT: узкая шапка с подсказкой, карта, кнопка «Сначала» */
:root{color-scheme:light;--grass:#99bc65;--ink:#14222c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#99bc65;color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;overflow-x:clip}
#reset{position:fixed;top:10px;right:10px;z-index:6000;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,250,240,.85);color:#14222c;font:900 22px Nunito,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
#reset:focus-visible{outline:3px solid #f2b134}
#outer{position:relative;overflow:hidden;background:var(--grass)}
#world{position:absolute;left:0;top:0;width:1000px;height:1420px;transform-origin:0 0;background:var(--grass)}
.pano{position:absolute;left:0;top:0;width:1000px;height:565px;background:url(img/panorama.webp) center/100% 100% no-repeat}
.road{position:absolute;background:#9a9ea3}
.road.h{left:0;width:1000px;top:880px;height:62px;border-top:4px solid #e7d6a8;border-bottom:4px solid #e7d6a8}
.road.h::after{content:"";position:absolute;left:0;right:0;top:27px;height:5px;background:repeating-linear-gradient(90deg,#fff 0 34px,transparent 34px 68px)}
.road.v{left:470px;width:62px;top:946px;height:474px;border-left:4px solid #e7d6a8;border-right:4px solid #e7d6a8}
.road.v::after{content:"";position:absolute;top:0;bottom:0;left:24px;width:5px;background:repeating-linear-gradient(180deg,#fff 0 34px,transparent 34px 68px)}
.ob{position:absolute;transform:translate(-50%,-100%);pointer-events:none;user-select:none;-webkit-user-drag:none}
.tap{pointer-events:auto;cursor:pointer;transition:transform .25s}
.tap.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-100%) scale(1.05)}}
.shadow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:rgba(30,60,20,.22);pointer-events:none}
.sign{position:absolute;transform:translate(-50%,-100%);padding:3px 12px;border-radius:14px;color:#fff;font-weight:900;font-size:15px;letter-spacing:.02em;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
.sign small{display:block;font-size:11px;font-weight:700;opacity:.85;text-align:center;letter-spacing:0}
.cloud{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:opacity 1s,transform 1s}
.cloud.gone{opacity:0;transform:translate(-50%,-80%) scale(1.3);pointer-events:none}
.puff{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;animation:puff .7s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.say{position:absolute;transform:translate(-50%,-100%);background:#fffaf0;border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap;pointer-events:none;animation:say 2.2s forwards}
@keyframes say{0%{opacity:0;margin-top:10px}10%,80%{opacity:1;margin-top:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tap.pulse{animation:none}}
</style>
</head>
<body>
<button id="reset" type="button" aria-label="Сначала" title="Сначала">↺</button>
<div id="outer"><div id="world"><div class="pano"></div><div class="road v"></div><div class="road h"></div></div></div>
<script>
{
const W=document.getElementById('world'),O=document.getElementById('outer');
const fit=()=>{const s=O.clientWidth/1000;W.style.transform='scale('+s+')';O.style.height=(1420*s)+'px'};
new ResizeObserver(fit).observe(O);fit();

// [img, x, baseY, height, extra]
const STATIC=[
 ['tree1',70,720,150],['school',250,850,205],['flag',440,830,120],['lamp',445,878,85],['bench',140,878,52],
 ['tree2',975,700,150],['hosp',880,858,175],['flowers',585,872,44],['tree1',560,640,110],
 ['chai',150,1120,135],['yurt',360,1135,135],['stage',220,1370,150],['lamp',445,1260,85],['bush_flowers',60,1290,52],['tree_apple',420,1405,125],
 ['fount',705,1110,120],['studio',900,1135,135],['bench',830,1210,48],['bush',985,1250,55],['tree1',600,1230,100]
];
const SIGNS=[
 [250,850,205,'МЕКТЕП','школа','#1f4f9e'],[880,858,175,'АУРУХАНА','больница','#e2574c'],
 [150,1120,135,'ШАЙХАНА','чайхана','#1f8a7a'],[220,1370,150,'САХНА','сцена','#a83a72'],
 [900,1135,135,'СТУДИЯ','студия','#a83a72'],[705,1110,120,'ФОНТАН','фонтан','#007f94']
];
function img(n,x,y,h,cls){const e=new Image();e.src='img/'+n+'.webp';e.alt='';e.className='ob '+(cls||'');e.style.left=x+'px';e.style.top=y+'px';e.style.height=h+'px';e.style.zIndex=Math.round(y);W.appendChild(e);return e}
function shadow(x,y,w){const s=document.createElement('div');s.className='shadow';s.style.cssText='left:'+x+'px;top:'+(y-4)+'px;width:'+w+'px;height:'+(w*.28)+'px;z-index:'+Math.round(y-1);W.appendChild(s);return s}
function sign(x,y,h,t,ru,c){const s=document.createElement('div');s.className='sign';s.innerHTML=t+'<small>'+ru+'</small>';s.style.cssText='left:'+x+'px;top:'+(y-h-4)+'px;background:'+c+';z-index:'+(Math.round(y)+1);W.appendChild(s)}
STATIC.forEach(o=>{shadow(o[1],o[2],o[3]*.9);img(o[0],o[1],o[2],o[3])});
SIGNS.forEach(s=>sign(...s));

function puff(x,y,col){for(let i=0;i<12;i++){const p=document.createElement('div');p.className='puff';const a=i/12*6.283,r=60+Math.random()*50;
 p.style.cssText='left:'+x+'px;top:'+y+'px;background:'+(col||['#f2b134','#fff','#ff8a3d'][i%3])+';z-index:4000;--dx:'+Math.cos(a)*r+'px;--dy:'+Math.sin(a)*r+'px';W.appendChild(p);setTimeout(()=>p.remove(),800)}}
function say(x,y,t){const s=document.createElement('div');s.className='say';s.textContent=t;s.style.cssText='left:'+x+'px;top:'+y+'px;z-index:4500';W.appendChild(s);setTimeout(()=>s.remove(),2300)}

// interactive objects: before -> after
const FIX=[
 {b:'house_broken',a:'house',x:680,y:780,h:150,lab:'Айнаның үйі',ru:'дом Айны',c:'#d96a1f',say:'Үй дайын!'},
 {b:'pond_dirty',a:'pond',x:690,y:1360,h:110,say:'Тап-таза!',hidden:1},
 {b:'debris1',a:null,x:900,y:1345,h:90,say:'Жол ашық!',hidden:1}
];
let clouds=[],fixEls=[];
function build(){
 fixEls.forEach(f=>{f.el&&f.el.remove();f.sh&&f.sh.remove();f.sg&&f.sg.remove()});clouds.forEach(c=>c.remove());fixEls=[];clouds=[];
 FIX.forEach(f=>{const o={...f};o.sh=shadow(f.x,f.y,f.h*1.1);o.el=img(f.b,f.x,f.y,f.h,'tap pulse');
  if(f.lab){o.sg=document.createElement('div');o.sg.className='sign';o.sg.innerHTML=f.lab+'<small>'+f.ru+'</small>';o.sg.style.cssText='left:'+f.x+'px;top:'+(f.y-f.h-4)+'px;background:'+f.c+';z-index:'+(f.y+1);W.appendChild(o.sg)}
  o.el.onclick=()=>{if(o.done||o.blocked)return;o.done=1;puff(f.x,f.y-f.h/2);say(f.x,f.y-f.h-30,f.say);
   if(f.a){o.el.classList.remove('pulse');o.el.style.transform='translate(-50%,-100%) scale(.6)';setTimeout(()=>{o.el.src='img/'+f.a+'.webp';o.el.style.transform='translate(-50%,-100%) scale(1)'},180)}
   else{o.el.style.transform='translate(-50%,-100%) scale(0)';o.sh.remove();setTimeout(()=>{o.el.src='img/flowers.webp';o.el.style.height='50px';o.el.style.transform='translate(-50%,-100%) scale(1)';o.el.classList.remove('pulse')},300)}};
  o.blocked=!!f.hidden;fixEls.push(o)});
 [[640,1300,240,'cloud1'],[800,1290,250,'cloud2'],[930,1330,230,'cloud3'],[700,1390,260,'cloud2'],[880,1410,250,'cloud1'],[580,1380,200,'cloud3']].forEach((c,i)=>{
  const e=new Image();e.src='img/'+c[3]+'.webp';e.alt='облако';e.className='cloud';e.style.cssText='left:'+c[0]+'px;top:'+c[1]+'px;width:'+c[2]+'px;z-index:'+(3000+i);
  e.onclick=()=>{clouds.forEach((k,j)=>setTimeout(()=>k.classList.add('gone'),j*90));puff(c[0],c[1],'#c9b8e8');say(800,1250,'Ура! Облако ушло');fixEls.forEach(f=>f.blocked=0)};
  W.appendChild(e);clouds.push(e)});
}
build();
document.getElementById('reset').onclick=build;

// cars
const SIDE=['car_side','car2_side','taxi_side','bus_side'],FRONT=['car_front','taxi_front'];
let cars=[];
function spawn(){const r=Math.random();let c;
 if(r<.7){const right=Math.random()<.5,n=SIDE[Math.floor(Math.random()*SIDE.length)],h=n==='bus_side'?58:44;
  c={el:img(n,right?-80:1080,right?936:906,h),dx:right?1:-1,dy:0,v:70+Math.random()*50};c.x=right?-80:1080;c.y=right?936:906;if(!right)c.el.style.transform='translate(-50%,-100%) scaleX(-1)'}
 else{const n=FRONT[Math.floor(Math.random()*FRONT.length)];c={el:img(n,516,960,52),dx:0,dy:1,v:60+Math.random()*30};c.x=516;c.y=960;c.el.style.opacity=0}
 cars.push(c)}
// walkers
const PEOPLE=[['kid_boy',40,876,1],['apa',300,876,-1],['doctor',620,876,1],['kid_girl',800,985,-1],['ata',200,985,1]];
const walkers=PEOPLE.map(p=>({el:img(p[0],p[1],p[2],58),x:p[1],y:p[2],d:p[3],min:p[1]<480?20:560,max:p[1]<480?440:985,v:16+Math.random()*10}));
// birds
const birds=[0,1,2].map(i=>({el:img('bird_up',-60-i*70,180+i*30,34),x:-60-i*70,y:180+i*30,f:0}));
birds.forEach(b=>b.el.style.transform='translate(-50%,-100%)');

let last=performance.now(),acc=0,flap=0;
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;acc-=dt;flap+=dt;
 if(acc<=0&&cars.length<4){spawn();acc=1.6+Math.random()*2.5}
 cars=cars.filter(c=>{c.x+=c.dx*c.v*dt;c.y+=c.dy*c.v*dt;c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';c.el.style.zIndex=Math.round(c.y);
  if(c.dy){c.el.style.opacity=Math.min(1,(c.y-960)/40)}
  if(c.x<-140||c.x>1140||c.y>1480){c.el.remove();return false}return true});
 walkers.forEach(w=>{w.x+=w.d*w.v*dt;if(w.x<w.min||w.x>w.max)w.d=-w.d;const bob=Math.abs(Math.sin(t/160+w.min))*4;
  w.el.style.left=w.x+'px';w.el.style.top=(w.y-bob)+'px';w.el.style.transform='translate(-50%,-100%)'+(w.d>0?' scaleX(-1)':'')});
 birds.forEach((b,i)=>{b.x+=55*dt;b.y+=Math.sin(t/500+i)*.15;if(b.x>1080){b.x=-80;b.y=140+Math.random()*120}b.el.style.left=b.x+'px';b.el.style.top=b.y+'px'});
 if(flap>.22){flap=0;birds.forEach(b=>{b.f^=1;b.el.src='img/'+(b.f?'bird_down':'bird_up')+'.webp'})}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
}
</script>
</body>
</html>
