<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тілашар</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centred column (max 560px): welcome → level path → lesson → summary. Same palette as Тілашар so blocks can merge later. */
:root{
  --brick-root:#cfd8dc;
  --bg:#f3f6f7; --card:#ffffff; --fg:#1d2a30; --muted:#64757c; --line:#d9e2e5;
  --sky:#0094b3; --sky-soft:#dff2f6; --gold:#e8a812; --gold-soft:#fdf2d6;
  --ok:#2f9e5a; --ok-soft:#e1f4e8; --bad:#d2453b; --bad-soft:#fbe5e3;
  --hard:#0b6fa4; --hard-soft:#dcedf7; --soft:#b5568a; --soft-soft:#f7e3ee;
  --display:"Rubik", "Arial Black", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181b; --card:#18242a; --fg:#e8eff1; --muted:#93a6ad; --line:#2a3a41;
  --sky:#3cc3df; --sky-soft:#173a44; --gold:#f2bd3d; --gold-soft:#3a3016;
  --ok:#55c47f; --ok-soft:#183626; --bad:#f07067; --bad-soft:#3d1f1d;
  --hard:#3d9bd6; --hard-soft:#16303f; --soft:#d16aa3; --soft-soft:#3a1d2c; --brick-root:#4a5a61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181b; --card:#18242a; --fg:#e8eff1; --muted:#93a6ad; --line:#2a3a41;
  --sky:#3cc3df; --sky-soft:#173a44; --gold:#f2bd3d; --gold-soft:#3a3016;
  --ok:#55c47f; --ok-soft:#183626; --bad:#f07067; --bad-soft:#3d1f1d;
  --hard:#3d9bd6; --hard-soft:#16303f; --soft:#d16aa3; --soft-soft:#3a1d2c; --brick-root:#4a5a61; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;padding:0 16px;padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0;line-height:1.6}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--sky);margin-right:auto}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;background:var(--sky);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 70%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--sky) 70%,#000)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--sky);box-shadow:none;border:2px solid var(--line)}
.btn.sun{background:var(--gold);color:#2b1f00;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 65%,#000)}
.btn.wide{width:100%}
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line)}
.letter{background:var(--card);border-radius:20px;padding:22px;border:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.letter h1{font-size:24px;color:var(--sky)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo div{border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:18px}
.demo .h{background:var(--hard-soft);color:var(--hard)}
.demo .s{background:var(--soft-soft);color:var(--soft)}
.demo small{display:block;font-weight:600;font-size:13px;opacity:.85;margin-top:4px}
.lego{font-family:var(--display);font-size:16px;display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle}
/* brick = construction-toy piece with studs on top */
.bk{--c:var(--brick-root);--t:var(--fg);position:relative;display:inline-block;background:var(--c);color:var(--t);border-radius:5px;padding:5px 9px;font-style:normal;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.bk.h{--c:var(--hard);--t:#fff} .bk.s{--c:var(--soft);--t:#fff} .bk.r{--c:var(--brick-root);--t:var(--fg)}
.lego i,.lego b{all:unset}
.path{display:flex;flex-direction:column;gap:12px}
.lvl{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:48px 1fr;gap:4px 14px;align-items:center}
.lvl.locked{opacity:.5}
.lvl.done .badge{background:var(--gold);color:#3a2a00}
.badge{grid-row:span 2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;background:var(--sky-soft);color:var(--sky)}
.lvl h3{font-size:15px}
.lvl .ru{color:var(--muted);font-size:14px}
.lvl .row{grid-column:1 / -1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.lvl .acts{grid-column:1 / -1;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:10px}
.lvl .acts .btn{width:100%}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px;margin-right:auto}
.rule{background:var(--gold-soft);border-radius:14px;padding:14px;line-height:1.65;font-size:15px}
.rule table{border-collapse:collapse;margin-top:8px;width:100%}
.rule td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.rule .ex{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent)}
.rule .ex:first-of-type{margin-top:10px}
.rule .ex .w{font-family:var(--display);font-size:18px;line-height:1.5;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rule .ex .w .lego{font-size:17px}
.rule .ex .why{font-size:15px;color:var(--muted)}
.rule .note{margin-top:8px;font-size:15px}
.rule .step{margin:14px 0 0;font-family:var(--display);font-size:15px;color:var(--sky)}
.rule .step:first-child{margin-top:0}
.lbar{display:flex;align-items:center;gap:12px}
.x{background:none;border:none;color:var(--muted);font-size:26px;line-height:1;padding:4px 8px}
.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.kind{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.prompt{font-family:var(--display);font-size:22px;line-height:1.4}
.prompt .kk{color:var(--sky)}
.hint{color:var(--muted);font-size:15px;font-family:var(--body)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.six{grid-template-columns:1fr 1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:18px;color:var(--fg)}
.opts.two .opt,.opts.six .opt{text-align:center}
.opt .bk{font-size:18px}
.opt.wordopt{display:flex;align-items:flex-end;gap:2px}
.opts.two .opt.wordopt,.opts.six .opt.wordopt{justify-content:center}
.opt.brickopt{--c:var(--brick-root);background:var(--c);color:#fff;border:none;border-radius:8px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);position:relative;font-family:var(--display);font-size:19px;padding:14px 8px}
.opt.brickopt.h{--c:var(--hard)} .opt.brickopt.s{--c:var(--soft)}
.opt.brickopt.sel{outline:4px solid var(--fg);outline-offset:2px}
.opt.brickopt.right{outline:4px solid var(--ok);outline-offset:2px;animation:snap .35s ease}
.opt.brickopt.wrong{outline:4px solid var(--bad);outline-offset:2px;animation:shake .35s ease}
@keyframes snap{0%{transform:translateY(-10px)}60%{transform:translateY(2px)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt.right .bk,.answer.ok .bk{animation:snap .35s ease}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.brickopt.right,.opt.brickopt.wrong{background:var(--c);color:#fff}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 14px;font-weight:700;font-size:18px;color:var(--fg)}
.tile.used{display:none}
.tile.bk{border:none;background:var(--c);color:var(--t);font-size:19px;padding:9px 14px}
.tile.answer{align-items:flex-end}
.robot-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.robot-card svg{width:150px;height:auto;display:block}
.robot-card h2{font-size:18px}
.energy{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.energy i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f08a24)}
.newpart{display:flex;justify-content:center}
.newpart svg{width:170px;height:auto}
@media (max-width:420px){.robot-card{grid-template-columns:125px 1fr;gap:10px;padding:12px}.robot-card svg{width:125px}}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;line-height:1.55}
.fb.ok{background:var(--ok-soft)} .fb.ok h3{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad h3{color:var(--bad)}
.fb .why{font-size:15px}
.sum{text-align:center}
.big{font-family:var(--display);font-size:44px;color:var(--sky);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--bg);border-radius:14px;padding:10px}
.cell b{display:block;font-family:var(--display);font-size:20px}
.cell span{color:var(--muted);font-size:13px}
.mist{text-align:left;font-size:15px;line-height:1.6;background:var(--bad-soft);border-radius:14px;padding:12px 14px}
.speedword{font-family:var(--display);font-size:34px;text-align:center;padding:18px 0;color:var(--sky)}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:18px}
.foot{color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
.link{background:none;border:none;color:var(--sky);font-weight:700;text-decoration:underline;padding:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* --- game feel: coins, combo, celebration --- */
.flycoin{position:fixed;z-index:60;width:24px;height:24px;pointer-events:none;animation:fly .7s cubic-bezier(.5,0,.8,.4) forwards}
.flycoin svg{width:24px;height:24px}
@keyframes fly{0%{transform:translate(0,0) scale(1.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:.2}}
.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.gain{display:inline-flex;align-items:center;gap:3px;font-size:15px;color:#c8961a;margin-left:6px}
.gain svg{width:18px;height:18px}
.combo{font-family:var(--display);font-size:22px;color:#f08a24;animation:burst .5s ease both;letter-spacing:.02em}
.combo span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:700;margin-left:6px}
@keyframes burst{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:46px;line-height:1}
.starpop{color:var(--line);animation:burst .45s ease both}
.starpop.on{color:var(--gold);text-shadow:0 2px 0 #c8961a}
.cell span svg{width:14px;height:14px;vertical-align:-2px}
.robotpop svg{animation:dance 1.1s ease .3s both}
@keyframes dance{0%{transform:scale(.7) rotate(-6deg);opacity:.3}35%{transform:scale(1.12) rotate(5deg);opacity:1}65%{transform:rotate(-3deg)}100%{transform:none}}
.burst{animation:burst .5s ease .6s both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion: reduce){.flycoin,.combo,.starpop,.robotpop svg,.burst,.bump{animation:none!important}}

.blockrow{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.blockrow.locked{opacity:.55}
.blockrow h2,.sec-h h2{font-size:17px}
.blockrow .ru,.sec-h .ru{color:var(--muted);font-size:14px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.top{gap:12px}.top .stat{font-size:15px}
.src{font-size:13px;color:var(--muted)}
.endhl{display:inline-block;color:#fff;border-radius:6px;padding:0 6px;margin-left:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.endhl.h{background:var(--hard)}.endhl.s{background:var(--soft)}

/* ===== Дорожка (beta) ===== */
:root{--ghost:#cfd8dc;--ghost-d:#b3c0c6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ghost:#2c3c43;--ghost-d:#3a4d55}}
:root[data-theme="dark"]{--ghost:#2c3c43;--ghost-d:#3a4d55}
.garbtn{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:5px 10px;font-weight:800;font-size:16px}
.goal{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.goal.done{border-color:var(--gold);background:var(--gold-soft)}
.goal-ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*360deg),var(--line) 0)}
.goal-ring b{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.goal h2{font-size:17px;margin:2px 0 4px}
.goal .hint{font-size:14px}
.trail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 30px}
.unit{width:100%;background:var(--hard);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--hard) 70%,#000);margin:8px 0 6px}
.unit.loop{background:var(--soft);box-shadow:0 5px 0 color-mix(in srgb,var(--soft) 70%,#000);margin-top:22px}
.u-k{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.u-t{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;margin-top:2px}
.unit{flex-wrap:wrap}
.u-book{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:8px 12px;font:800 14px var(--body);display:flex;align-items:center;gap:8px;text-align:left;line-height:1.2;flex:none}
.u-book small{font-weight:600;opacity:.85;font-size:12px}
.rn-row{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--dx));z-index:1}
.rn-row:has(.bubble){z-index:3}
.rn{position:relative;border:none;background:none;padding:0;width:112px;display:block;border-radius:24px}
.rn svg{width:112px;height:auto;display:block}

.rn.cur::before{content:"";position:absolute;left:50%;top:55%;width:150px;height:150px;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sky) 30%,transparent),transparent 68%);animation:halo 1.8s ease-in-out infinite}
@keyframes halo{50%{scale:1.12;opacity:.6}}
.chip{position:absolute;left:-4px;bottom:8px;width:34px;height:34px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:17px;line-height:1}
.rn.cur .chip{border-color:var(--sky);background:var(--sky);color:#fff}
.rn.done .chip{border-color:var(--gold)}
.rst{position:absolute;right:-2px;bottom:6px;font-size:13px;color:var(--gold);letter-spacing:1px}
.rn.just svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.bubble{margin-top:6px;margin-bottom:10px;transform:translateX(calc(var(--dx) * -1));background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;width:min(250px,80vw);box-shadow:0 6px 18px rgba(0,0,0,.08);animation:pop .25s ease}
.bubble b{font-family:var(--display);font-size:16px;line-height:1.3}
.bubble .hint{font-size:13px}
.bubble .btn{width:100%;margin-top:4px}
@keyframes pop{from{opacity:0;scale:.8}}
.rn.shake{animation:shake .35s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}
.big-robot svg{width:200px}
/* opening */
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.splash-robot svg{width:200px;height:auto;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.splash h1{font-size:40px;color:var(--sky)}
.splash p{color:var(--muted);margin-bottom:18px}
.splash .btn{max-width:320px}
.sign{text-align:right;font-family:var(--display);font-weight:700;font-size:19px;color:var(--sky)}
.how{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.how-i{width:44px;height:44px;border-radius:12px;background:var(--sky-soft);display:grid;place-items:center;font-size:22px}
.how-i svg{width:26px;height:26px}
.how b{font-family:var(--display);font-size:16px}
.how p{font-size:15px;color:var(--muted)}
/* chest */
.chestbtn{border:none;background:none;padding:0;align-self:center}
.chest{width:210px;height:auto;display:block}
.chest .lid{transform-origin:40px 92px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.chest.open .lid{transform:rotate(-38deg) translate(-6px,-10px)}
.chest .rays{opacity:0;transform-origin:100px 96px;transition:opacity .3s}
.chest.open .rays{opacity:1;animation:spin 6s linear infinite}
.chest .gold{opacity:0;transition:opacity .2s .15s}.chest.open .gold{opacity:1}
.chest.shake{animation:cshake .5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cshake{20%{rotate:-4deg}40%{rotate:4deg}60%{rotate:-3deg}80%{rotate:3deg}}
.prize{font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);min-height:38px}
.streakline{font-family:var(--display);font-weight:700;font-size:24px;color:var(--gold)}
.burstcoin{position:fixed;width:26px;height:26px;pointer-events:none;z-index:50;animation:fly 1.1s cubic-bezier(.2,.8,.3,1) forwards}
.burstcoin svg{width:26px;height:26px}
@keyframes fly{100%{translate:var(--x) var(--y);opacity:0;rotate:360deg}}
/* garage */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.gcard svg{width:100%;max-width:140px;height:auto}
.gcard b{font-family:var(--display)}
.gcard span{font-size:13px;color:var(--muted)}
.gcard small{font-size:12px;color:var(--muted)}
/* parents */
.cell.due b{color:var(--gold)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:118px}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.wb i{display:block;width:70%;min-height:3px;background:var(--sky);border-radius:6px 6px 2px 2px}
.wv{font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.jday{border-top:2px solid var(--line);padding-top:10px}
.jday summary{cursor:pointer;display:flex;flex-direction:column;gap:2px}
.jday summary span{font-size:14px;color:var(--muted)}
.jday table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.jday th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:4px}

.jm{font-size:12px;color:var(--bad)}
.setrow{display:flex;flex-wrap:wrap;gap:8px}

/* cheers */
.flamepop{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));translate:-50% 0;z-index:60;pointer-events:none;display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid #f08a24;color:#f08a24;border-radius:999px;padding:6px 14px 6px 10px;font-family:var(--display);font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:flame 1.5s ease forwards}
.flamepop svg{width:24px;height:24px}
@keyframes flame{0%{opacity:0;scale:.6}15%{opacity:1;scale:1.1}25%{scale:1}80%{opacity:1}100%{opacity:0;translate:-50% -14px}}
.arkapop{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;pointer-events:none;display:flex;align-items:flex-end;gap:4px;animation:arkain 2s cubic-bezier(.3,1.4,.5,1) forwards}
.arkapop.dance{animation-duration:2.6s}
.arkapop .bot svg{width:110px;height:auto;display:block}
.arkapop.jump .bot{animation:hop .5s ease 2}
.arkapop.dance .bot{animation:wiggle .4s ease-in-out 5}
.arkapop .say{background:var(--card);border:2px solid var(--sky);color:var(--fg);border-radius:16px 16px 4px 16px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:16px;max-width:170px;margin-bottom:70px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.arkapop.calm .say{border-color:var(--line)}
@keyframes arkain{0%{translate:140% 0}14%{translate:0 0}84%{translate:0 0;opacity:1}100%{translate:140% 0;opacity:0}}
@keyframes hop{50%{translate:0 -18px}}
@keyframes wiggle{25%{rotate:-8deg}75%{rotate:8deg}}
@media (prefers-reduced-motion: reduce){.flamepop,.arkapop,.arkapop .bot{animation:none}}
.unit.m1{background:var(--ok);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.unit.m2{background:#7a4fd6;box-shadow:0 5px 0 #553299}

/* living robots */
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.gsec{font-family:var(--display);font-weight:700;font-size:15px;margin-top:6px}
.ggrid.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.ggrid.g4{grid-template-columns:repeat(3,1fr)}}
.gcard.off b,.gcard.off span{opacity:.55}
.gcard.off svg{opacity:.8}
.tmembers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tm svg{width:100%;height:auto;animation:merge 1.2s cubic-bezier(.5,0,.4,1) both;animation-delay:calc(var(--k)*.12s)}
@keyframes merge{0%{transform:translateY(0)}60%{transform:translateY(40px) scale(.85);opacity:1}100%{transform:translateY(60px) scale(.6);opacity:.35}}
.tbig svg{width:240px}
@media (prefers-reduced-motion: reduce){.eyes,.tm svg{animation:none}}

/* sticky top, sticky module plate, bottom menu */
body:has(.bnav){padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;margin-block:-8px}
.unit{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:10}
.rn-row:has(.bubble){z-index:3}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nv{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--muted);font:700 12px var(--body);position:relative;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.nv .ni{font-size:24px;line-height:1;position:relative}
.nv .ni i{position:absolute;top:-6px;right:-12px;background:var(--gold);color:#2b1f00;font:800 11px var(--body);border-radius:999px;padding:1px 6px;font-style:normal}
.nv.on{background:var(--sky-soft);color:var(--sky);box-shadow:inset 0 0 0 2px var(--sky)}
.nv.hold{background:var(--gold-soft)}
.nv.hold::after{content:"";position:absolute;left:12%;right:12%;bottom:3px;height:3px;border-radius:2px;background:var(--gold);transform-origin:left;animation:holdbar 1.5s linear forwards}
@keyframes holdbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.holdtip{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:40;background:var(--fg);color:var(--bg);font:700 14px var(--body);padding:8px 14px;border-radius:12px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.agrid{grid-template-columns:repeat(2,1fr)}}
.atile{border:2px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.atile .ai{font-size:22px;line-height:1}.atile .ai svg{width:24px;height:24px}
.atile b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.atile span:last-child{font-size:12px;color:var(--muted)}
.arow{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
@media (prefers-reduced-motion: reduce){.nv.hold::after{animation:none;transform:none}}

/* ===== compact header + mystery garage ===== */
.mg{position:relative;width:38px;height:38px;border-radius:50%;border:none;padding:0;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*360deg),var(--line) 0);cursor:pointer;margin-right:auto;margin-left:-4px}
.mg b{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 12px var(--display);color:var(--ink)}
.mg.done b{background:var(--gold-soft)}
.top{position:sticky}.brand{margin-right:0!important}
.mg-pop{display:none;position:absolute;left:16px;top:52px;z-index:30;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:14px;line-height:1.35}
.mg-pop.on{display:grid;gap:2px}
.unit{flex-wrap:nowrap!important;padding:9px 0 9px 14px!important;border-radius:16px!important;gap:0!important;margin:6px 0 4px!important;align-items:stretch!important}
.unit>div:first-child{flex:1;min-width:0;align-self:center}
.u-k{font-size:11px!important}
.u-t{font-size:16px!important;line-height:1.2!important;margin-top:1px!important;overflow-wrap:anywhere}
.u-book{flex-direction:column;justify-content:center;gap:0!important;background:none!important;border-left:2px solid rgba(255,255,255,.3)!important;border-radius:0!important;padding:0 14px!important;margin-left:10px;text-align:center!important}
.u-book .bi{font-size:22px;line-height:1}
.u-book small{font-size:11px!important;font-weight:800!important;opacity:.9}
.unit.loop{padding:9px 14px!important;margin-top:16px!important}
.gcard.mystery{border-style:dashed;background:color-mix(in srgb,var(--line) 35%,transparent)}
.myst{width:100%;max-width:110px;height:auto}.myst rect{fill:#3b4554}.myst text{fill:#fff;font:800 34px var(--display)}
.gcard.mystery b{font-size:20px;letter-spacing:.1em}
.top+.mg-pop+.trail,.top~.trail{margin-top:-12px}

.sec-tr{font-weight:600;color:var(--muted)}
.opt.wordopt{flex-wrap:wrap;row-gap:6px}.opt .bk{white-space:nowrap}

/* ===== layout guard: nothing may stick out of a phone screen ===== */
.wrap,.card,.rule,.fb,.prompt,.opt,.ex,.ex .w,.answer,.bank,.nt,.robot-card>div{min-width:0}
.prompt,.rule,.fb,.opt,.nt,.hint{overflow-wrap:break-word}
.lego{flex-wrap:wrap;max-width:100%}
.rule table,table.six{width:100%;table-layout:auto}
svg,img{max-width:100%}
.opts.two,.opts.six{grid-template-columns:repeat(auto-fit,minmax(min(100%,92px),1fr))}
/* zigzag: only the robot moves sideways; the bubble stays near the centre so it never leaves the screen */
.rn-row{transform:none}
.rn-row>.rn{transform:translateX(var(--dx))}
.rn-row>.bubble{transform:translateX(clamp(-16px,var(--dx),16px))}
@media (max-width:380px){.rn-row>.rn{transform:translateX(calc(var(--dx) * .7))}}

.ggrid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:480px){.ggrid.g4{grid-template-columns:repeat(3,minmax(0,1fr))}.ggrid.g4 .gcard b{font-size:12.5px;overflow-wrap:anywhere}}

/* garage robot actions */
button.gcard{background:var(--card,#fff);font:inherit;color:inherit;cursor:pointer;transition:transform .12s}
button.gcard:active{transform:scale(.96)}
.gfx{position:fixed;inset:0;background:rgba(10,30,45,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:12px}
.gfx-box{background:#fff;border-radius:24px;width:min(380px,100%);padding:14px 10px 16px;text-align:center;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gfx-box h3{margin:2px 0 0;font-family:var(--display);font-size:22px}
.gfx-x{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.gfx-stage{--R:min(128px,34vw);position:relative;width:calc(var(--R)*2 + 64px);height:calc(var(--R)*2 + 64px);margin:4px auto 0}

.gfx-rob svg{width:100%;height:auto;display:block}
.gfx-b{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:3px solid #fff;background:#ffd23f;font-size:27px;line-height:1;cursor:pointer;
 box-shadow:0 4px 0 #c8961a,0 6px 14px rgba(0,0,0,.18);transform:rotate(calc(var(--i)*60deg - 90deg)) translate(var(--R)) rotate(calc(var(--i)*-60deg + 90deg));z-index:3}
.gfx-b:nth-of-type(2){background:#8fd0ff;box-shadow:0 4px 0 #3c8cc4,0 6px 14px rgba(0,0,0,.18)}
.gfx-b:nth-of-type(3){background:#ffb3d1;box-shadow:0 4px 0 #d0558a,0 6px 14px rgba(0,0,0,.18)}
.gfx-b:nth-of-type(4){background:#b9f0a6;box-shadow:0 4px 0 #5aa547,0 6px 14px rgba(0,0,0,.18)}

.gfx-b:nth-of-type(6){background:#d6c2ff;box-shadow:0 4px 0 #7a58c9,0 6px 14px rgba(0,0,0,.18)}
.gfx-b:active{filter:brightness(.92)}
.gfx-say{margin:6px 0 0;font-size:17px;min-height:24px}
.gfx-fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.gfx-p{position:absolute;left:50%;top:48%;font-size:26px;animation:gfxfly 1.5s ease-out forwards;opacity:0}
@keyframes gfxfly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
.gfx-beam{position:absolute;top:36%;left:50%;height:8px;width:0;border-radius:6px;background:linear-gradient(90deg,#ff3b3b,#ffe14d);box-shadow:0 0 14px #ff5a5a;transform-origin:0 50%;
 transform:scaleX(var(--s));animation:gfxbeam 1.2s ease-out forwards}
@keyframes gfxbeam{0%{width:0;opacity:1}40%{width:48%;opacity:1}100%{width:48%;opacity:0}}
.gfx-fx.siren{animation:gfxsiren .3s steps(2) 5;border-radius:50%}
@keyframes gfxsiren{0%{background:radial-gradient(circle,rgba(255,40,40,.35),transparent 65%)}100%{background:radial-gradient(circle,rgba(40,120,255,.35),transparent 65%)}}
.gfx-fx.ring::after{content:'';position:absolute;left:50%;top:48%;width:70%;height:70%;border-radius:50%;border:6px solid rgba(255,210,63,.85);box-shadow:0 0 24px #ffd23f;transform:translate(-50%,-50%);animation:gfxring 1.6s ease-out forwards}
@keyframes gfxring{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.a-dance{animation:gdance 1.9s ease-in-out}
@keyframes gdance{0%,100%{transform:translate(-50%,-52%)}12%{transform:translate(-56%,-58%) rotate(-12deg)}25%{transform:translate(-50%,-52%)}37%{transform:translate(-44%,-58%) rotate(12deg)}50%{transform:translate(-50%,-52%)}62%{transform:translate(-56%,-58%) rotate(-12deg)}75%{transform:translate(-50%,-52%)}87%{transform:translate(-44%,-58%) rotate(12deg)}}
.a-laugh{animation:glaugh .12s linear 12}
@keyframes glaugh{0%,100%{transform:translate(-50%,-52%)}50%{transform:translate(-50%,-50%) rotate(2deg)}}
.a-wow{animation:gwow 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes gwow{0%,100%{transform:translate(-50%,-52%) scale(1)}40%{transform:translate(-50%,-70%) scale(1.12)}}
.a-wink{animation:gwink 1.2s ease-in-out}
@keyframes gwink{0%,100%{transform:translate(-50%,-52%)}30%,70%{transform:translate(-50%,-52%) rotate(-9deg)}}
.a-love{animation:glove .5s ease-in-out 3}
@keyframes glove{0%,100%{transform:translate(-50%,-52%) scale(1)}50%{transform:translate(-50%,-52%) scale(1.09)}}
.a-super{animation:gsuper 1.4s ease-out}
@keyframes gsuper{0%{transform:translate(-50%,-52%) scale(1)}20%{transform:translate(-50%,-56%) scale(1.15);filter:drop-shadow(0 0 16px #ffd23f)}100%{transform:translate(-50%,-52%) scale(1)}}
.a-super.a-s-dash{animation:gdash 1.2s ease-in-out}
@keyframes gdash{0%,100%{transform:translate(-50%,-52%)}25%{transform:translate(-115%,-52%) skewX(12deg)}50%{transform:translate(15%,-52%) skewX(-12deg)}75%{transform:translate(-50%,-52%)}}
@media (prefers-reduced-motion:reduce){.gfx-rob[class*="a-"]{animation-duration:.01s}}

/* ---- rigged part animations (19.10 v2): each part moves on its own ---- */
.gfx-rob.a-dance,.gfx-rob.a-laugh,.gfx-rob.a-wink,.gfx-rob.a-love,.gfx-rob.a-super:not(.a-s-dash){animation:none}
.gfx-rob [class^="rp-"]{transform-box:view-box}

@keyframes gblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}

@keyframes dArmR{0%,100%{transform:rotate(0)}15%{transform:rotate(55deg)}30%{transform:rotate(-30deg)}45%{transform:rotate(55deg)}60%{transform:rotate(-30deg)}75%{transform:rotate(60deg)}90%{transform:rotate(-20deg)}}
@keyframes dHead{0%,100%{transform:rotate(0)}15%,45%,75%{transform:rotate(-11deg)}30%,60%,90%{transform:rotate(11deg)}}
@keyframes dUpper{0%,100%{transform:translateY(0) rotate(0)}15%,45%,75%{transform:translateY(5px) rotate(-4deg)}30%,60%,90%{transform:translateY(0) rotate(4deg)}}
@keyframes dLeg{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
/* laugh: head thrown back, body shakes, hand on belly */

.a-laugh .rp-armL{animation:lArm 1.8s ease-in-out}

@keyframes lHead{0%,100%{transform:rotate(0)}15%,85%{transform:rotate(-16deg) translateY(-3px)}25%,45%,65%{transform:rotate(-10deg) translateY(-1px)}35%,55%,75%{transform:rotate(-17deg) translateY(-4px)}}
@keyframes lUpper{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5px,2px)}}
@keyframes lArm{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(-38deg)}}
@keyframes lArmR{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(75deg)}}
/* wow: squat, jump, both arms up, antenna spins */

.a-wow .rp-armR{animation:wArmR 1.4s ease-in-out}

@keyframes wArm{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}45%,80%{transform:rotate(160deg)}60%{transform:rotate(140deg)}}
@keyframes wArmR{0%,100%{transform:rotate(0)}25%{transform:rotate(30deg)}45%,80%{transform:rotate(-25deg)}60%{transform:rotate(-10deg)}}
@keyframes wTop{0%,100%{transform:rotate(0)}25%{transform:rotate(25deg)}75%{transform:rotate(-25deg)}}

/* wink: head tilt + thumbs-up arm */

@keyframes sUpper{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) translateY(3px)}30%,80%{transform:rotate(3deg)}}
@keyframes sArm{0%,100%{transform:rotate(0)}15%{transform:rotate(-30deg)}30%,80%{transform:rotate(62deg)}}

function daily(){

  const doneLv=bl.LEVELS.filter((l,i)=>levelOpen(bl,i)&&b.seen[l.id]);

  run({bl:null,i:null,label:'Бүгінгі жаттығу'},shuffle(tasks));

function speedTask(){

   <div class="opts ${q.layout}">${q.opts.map((o,j)=>`<button class="opt ${o.cls}" data-s="${j}" type="button">${o.html}</button>`).join('')}</div><div id="fbox"></div>`;

    const v=q.opts[+b.dataset.s].v, ok=v===q.ans; if(ok){const g=earn(1);SP.coins=(SP.coins||0)+g;sCoin()}else beep(false); gradeWord(SP.bl.id,q.word,ok); save(); b.classList.add(ok?'right':'wrong');

/* ---------- faces: screen + eyes; when alive the eyes show a mood ---------- */
function faceGeom(f,cx,cy,b){

  if(f==='grid') return {cx,cy,dx:10,r:4,mouth:false};
  if(f==='astro') return {cx,cy:cy-2,dx:9,r:4.5,mouth:true,mcy:cy+7};

function faceBg(f,cx,cy,b){

const star=(x,y,r,c)=>{let p='';for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;p+=`${(x+rr*Math.cos(a)).toFixed(1)},${(y+rr*Math.sin(a)).toFixed(1)} `}return `<polygon points="${p}" fill="${c}"/>`};

    if(id==='parent'){ // hold to open, so a child does not wander in by accident
      let t=null;const go=()=>{b.classList.remove('hold');clearTimeout(t)};
      b.onpointerdown=e=>{b.classList.add('hold');t=setTimeout(()=>{go();parent()},1500)};
      b.onpointerup=b.onpointerleave=b.onpointercancel=go;
      b.onclick=()=>{if(!b.dataset.tip){b.dataset.tip=1;const tip=document.createElement('div');tip.className='holdtip';tip.textContent='Для родителей: зажми и подержи';document.body.appendChild(tip);setTimeout(()=>{tip.remove();delete b.dataset.tip},1800)}};
      b.onkeydown=e=>{if(e.key==='Enter'&&e.repeat)parent()};
    } else b.onclick=()=>({home,garage,awards})[id]();
  });
}

  }

   <p class="foot"><button class="link" id="mute" type="button">${S.mute?'Звук: выкл':'Звук: вкл'}</button></p>${nav('home')}`;

// put the glowing lesson in the middle of the screen — instant jump, works in phone webviews
function focusCur(){
  const jump=()=>{const c=app.querySelector('.rn.cur');if(!c)return;const r=c.getBoundingClientRect();
    const y=Math.max(0,r.top+window.scrollY-window.innerHeight/2+r.height/2+60);
    window.scrollTo(0,y);document.documentElement.scrollTop=y;document.body.scrollTop=y};
  requestAnimationFrame(jump); setTimeout(jump,250);
}
function tapNode(i,el){
  if(i===P.cur) return openNode(i);
  if(!canOpen(i)){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return}
  app.querySelectorAll('.bubble.re').forEach(x=>x.remove());
  el.parentElement.insertAdjacentHTML('beforeend',`<div class="bubble re"><b>${esc(node(i).title)}</b><button class="btn" data-re="${i}" type="button">${isDone(i)?'Повторить':'Бастау'}</button></div>`);
  el.parentElement.querySelector('[data-re]').onclick=()=>openNode(i);
}
function openNode(i){
  const n=node(i); beginLog(i); missN=0;
  if(n.type==='letter') return letterNode(i);
  if(n.type==='secret') return secretNode(i);
  if(n.type==='speed'){SPN=i;return speedStart(speedBl(i))}
  run({node:i,pass:n.type==='boss'?.8:.7},gen(n));
}

function speedEnd(){

    const have=ROB.PROS.map((p,i)=>i).filter(i=>teamOf(i)===ro.team&&P.built['p'+(ro.rank*NP+i)]).length;

      return lmk('E',v[0],f,E.CS.map(ru),ru(c),`<b>${f}</b> — ${esc(ru(c))} (${c==='to'?'куда?':c==='at'?'где?':'откуда?'})`,'👂 Послушай: куда, где или откуда?')},
    ()=>{const K=Math.floor(Math.random()*3),ph=(k=K)=>{if(k===0){const v=lone(F.IL);return [v[0],`${F.form('il',v[0])} ${v[3]}`,v[5]]}
        if(k===1){const v=lone(F.TB);return [v[0],`Мен ${F.form('tb',v[0])} ${v[2]}`,`Я ${v[3]} ${v[1]}`]}const v=lone(F.KM);return [v[0],`Мен ${F.form('km',v[0])} ${v[2]}`,`Я ${v[3]} ${v[1]}`]};
      const a=ph(),o=[a[2]];for(let g=0;g<10&&o.length<3;g++){const b=ph();if(!o.includes(b[2]))o.push(b[2])}
      return lmk('F',a[0],a[1],o,a[2],`<b>${esc(a[1])}</b> — ${esc(a[2])}`)},
    ()=>{if(!G7)return null;const ws=G7.pickWords(3),v=ws[0];return lmk('G',v[0],G7.Q(v),ws.map(x=>`Можно ${x[2]}?`),`Можно ${v[2]}?`,`<b>${esc(G7.Q(v))}</b> — Можно ${esc(v[2])}?`)}
  ];
  const f=gens[mi]; if(!f) return null;
  for(let g=0;g<8;g++){let t=null;try{t=f()}catch(e){} if(t) return {...t,blk:t.blk||BLOCKS[mi].id};}
  return null;
}
function listenHook(k){
  const b=document.getElementById('lsn'), s=document.getElementById('lsnslow');
  const play=slow=>{say(k.listen,slow?.72:1);if(b){b.classList.remove('on');void b.offsetWidth;b.classList.add('on')}};
  if(b)b.onclick=()=>play(false); if(s)s.onclick=()=>play(true);
  setTimeout(()=>play(false),250);
}
/* «Послушай» inside lessons: 1 per lesson from the start of a module, 2 in mix / boss, 1–2 in training */
function addListen(n,ts){
  try{
    if(!n||!n.gen||!Array.isArray(ts)||ts.length<4) return ts;
    let mods,cnt;
    if(n.mod){mods=[n.mi];cnt=(n.type==='mix'||n.type==='boss')?2:1}
    else if(n.loop!==undefined){mods=MODS.map((_,i)=>i);cnt=n.type==='boss'?2:1+(Math.random()<.5?1:0)}
    else return ts;
    const add=[];for(let g=0;g<cnt*3&&add.length<cnt;g++){const mi=mods[Math.floor(Math.random()*mods.length)],t=lgen(mi);
      if(t&&!add.some(x=>x.listen===t.listen))add.push(n.mod?t:{...t,prompt:`<div class="revtag">🔁 Повтор · модуль ${mi+1}</div>`+t.prompt})}
    const out=ts.slice(), free=shuffle(out.map((t,i)=>i).filter(i=>i>0&&out[i].t!=='write'&&!out[i].listen)).slice(0,add.length);
    add.forEach((t,j)=>out[free[j]]=t);
    return out;
  }catch(e){return ts}
}

/* ===================== Отчёт для родителя «что знает · что путает» (22.10) =====================
   Every first answer is counted per module × kind of task (and per case/ending for modules 5–6).
   P.st[key] = {n, ok, r:'1101…' last 20}. */
const RTYPE=k=>k.t==='write'?'✍️ пишет сам':k.listen?'👂 на слух':k.t==='tiles'?'🧩 собирает':'👆 выбирает';
const RSUB=k=>{const a=String(k.ans||'').toLowerCase().trim();
  if(k.blk==='E'){if(/(дан|ден|тан|тен|нан|нен)$/.test(a))return '⬅️ откуда? (-дан/-тен)';if(/(да|де|та|те)$/.test(a))return '⏺️ где? (-да/-те)';if(/(ға|ге|қа|ке)$/.test(a))return '➡️ куда? (-ға/-ке)'}
  if(k.blk==='F'){if(/(ның|нің|дың|дің|тың|тің)$/.test(a))return '🔗 чей? (-ның/-тің)';if(/(мен|бен|пен)$/.test(a))return '🤝 с кем? (-мен/-пен)';if(/(ны|ні|ды|ді|ты|ті)$/.test(a))return '🎯 что? (-ны/-ті)'}
  return null};
function statAdd(k,ok){
  try{if(!k||!k.blk)return;P.st=P.st||{};const bi=BLOCKS.findIndex(b=>b.id===k.blk);if(bi<0)return;
    const keys=['m'+bi,'m'+bi+'|'+RTYPE(k)],s=RSUB(k);if(s)keys.push('m'+bi+'|'+s);
    keys.forEach(x=>{const e=P.st[x]=P.st[x]||{n:0,ok:0,r:''};e.n++;if(ok)e.ok++;e.r=(e.r+(ok?'1':'0')).slice(-20)})}catch(e){}
}
const rpct=e=>{const r=e.r||'';return r.length?Math.round([...r].filter(c=>c==='1').length/r.length*100):0};
const rcol=p=>p>=85?'ok':p>=65?'mid':'low';
function reportHTML(){
  const st=P.st||{};const mods=MODS.map((M,i)=>({M,i,e:st['m'+i]})).filter(x=>x.e&&x.e.n>=5);
  const mist={};const since=Date.now()-14*864e5;(P.log||[]).forEach(l=>{if(l.s>=since&&l.mist)l.mist.forEach(m=>{mist[m]=(mist[m]||0)+1})});
  const top=Object.entries(mist).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!mods.length) return `<div class="card rep"><h2>Что знает · что путает</h2><p class="hint">Отчёт появится после нескольких уроков: нужно хотя бы 5 ответов в модуле. Считаются только ответы с первой попытки.</p></div>`;
  const row=(lab,e,cls)=>{const p=rpct(e);return `<div class="rrow ${cls||''}"><span class="rl">${lab}</span><span class="rbar"><i class="${rcol(p)}" style="width:${p}%"></i></span><b class="${rcol(p)}">${p}%</b></div>`};
  const weak=[];
  const body=mods.map(({M,i,e})=>{const ORD=['👆 выбирает','🧩 собирает','👂 на слух','✍️ пишет сам'];const subs=Object.keys(st).filter(x=>x.startsWith('m'+i+'|')&&st[x].n>=3).map(x=>({lab:x.split('|')[1],e:st[x]})).sort((x,y)=>ORD.indexOf(x.lab)-ORD.indexOf(y.lab));
    const md=String(M.det).toLowerCase();subs.forEach(s=>{if(rpct(s.e)<65)weak.push({p:(ORD.includes(s.lab)?1:0),t:`${M.name} (${md}): ${s.lab}`})}); if(rpct(e)<65&&!subs.some(s=>rpct(s.e)<65))weak.push({p:0,t:`${M.name} (${md})`});
    return `<details class="rmod"${rpct(e)<85?' open':''}><summary>${row(`<b>${i+1} · ${esc(M.name)}</b> <small>${esc(M.det)}</small>`,e)}</summary>${subs.map(s=>row(s.lab,s.e,'sub')).join('')}</details>`}).join('');
  return `<div class="card rep"><h2>Что знает · что путает</h2>
    <p class="hint">Верные ответы с первой попытки, последние 20 по каждой теме. <span class="ok">■</span> 85%+ знает · <span class="mid">■</span> 65–85% почти · <span class="low">■</span> меньше 65% путает</p>
    ${body}
    ${weak.length?`<div class="rweak"><b>Где помочь:</b><br>${weak.sort((a,b)=>a.p-b.p).slice(0,4).map(w=>'• '+esc(w.t)).join('<br>')}<br><span class="hint">Скажите вместе вслух 3–4 фразы на эту тему — без экрана.</span></div>`:`<div class="rgood">👍 Сейчас слабых тем нет.</div>`}
    ${top.length?`<div class="rmist"><b>Чаще всего ошибается (14 дней):</b><br>${top.map(([m,n])=>`• ${esc(m)}${n>1?` <small>×${n}</small>`:''}`).join('<br>')}</div>`:''}
  </div>`;
}
