<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тілашар · Город Айны</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Стиль прототипа «Айна» без изменений: небо-степь, кремовая карточка урока, чат-пузыри. Шрифт заголовков — Rubik (есть все казахские буквы). */
:root{
  --sky:#0d3b4f; --sky-2:#13506a; --foam:#e8f4f1; --sand:#f3d9a4; --gold:#f2b134;
  --ink:#14222c; --muted:#5d7483; --card:#fffaf0; --line:#e9dcc0;
  --aina:#ff8a3d; --aina-2:#d96a1f; --hard:#2f6fd6; --soft:#e05a9c;
  --ok:#2fb37a; --bad:#e2574c; --lock:#7d98a8;
  --display:"Rubik","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--foam);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.2px}
button{font-family:var(--body);font-weight:800;font-size:17px;cursor:pointer;border:0;border-radius:14px;color:inherit}
button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topr{display:flex;gap:8px;align-items:center}
.coins{background:var(--sky-2);border-radius:99px;padding:6px 14px;font-weight:800;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,#e0a91c);box-shadow:inset 0 -2px 0 #b5850f}
.mute{background:var(--sky-2);border-radius:99px;width:38px;height:34px;font-size:17px;padding:0}
.back{background:transparent;padding:6px 2px;font-size:16px}
.proto{background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;border-radius:10px;padding:8px 12px;text-align:center}
.hero{display:flex;gap:14px;align-items:center}
.hero p{margin:4px 0 0;color:#b9d3d6;line-height:1.4}

/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:6px}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px}
.stp:nth-child(4n+2){transform:translateX(-64px)}
.stp:nth-child(4n+4){transform:translateX(64px)}
.node{width:78px;height:78px;border-radius:50%;background:var(--lock);color:var(--sky);font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 6px 0 #5a7484;display:grid;place-items:center}
.node.open{background:var(--aina);color:#fff;box-shadow:0 6px 0 var(--aina-2);animation:bob 2.4s ease-in-out infinite}
.node.done{background:var(--ok);color:#fff;box-shadow:0 6px 0 #1f8459}
.node:disabled{cursor:default}
.stp .lbl{font-size:14px;font-weight:700;color:#d3e4ee;text-align:center;max-width:170px;line-height:1.3}
.stp .lbl small{color:#8fb0c2;font-weight:600}
@keyframes bob{50%{transform:translateY(-5px)}}
.legend{background:var(--sky-2);border-radius:16px;padding:12px 14px;line-height:1.5;color:#d3e4ee}
.legend b{color:var(--sand)}

/* lesson */
.lesson{background:var(--card);color:var(--ink);border-radius:24px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:12px;min-height:60vh}
.bar{height:12px;border-radius:99px;background:#eadfc6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--aina);border-radius:99px;transition:width .4s}
.lesson>.bar.seg{position:sticky;top:0;z-index:6;height:auto;background:var(--card);border-radius:0;overflow:visible;display:flex;gap:4px;padding:8px 2px 6px;margin:-8px 0 0}
.bar.seg b{flex:1;height:10px;border-radius:99px;background:#eadfc6;transition:background .3s}
.bar.seg b.ok{background:#4caf50}.bar.seg b.now{background:#f5c79e;animation:segp 1.1s infinite}
@keyframes segp{50%{opacity:.45}}
.bar.seg.fin b{background:#4caf50;animation:segf .6s 2}
@keyframes segf{50%{background:#ffd54a;transform:scaleY(1.4)}}
.chat{display:flex;flex-direction:column;gap:12px}
.say{display:flex;gap:10px;align-items:flex-end}
.say .av{flex:none;width:58px}
.bubble{background:#fff;border:2px solid #e3d3ad;border-radius:18px 18px 18px 4px;padding:11px 14px;line-height:1.5;font-weight:600;flex:1;min-width:0}
.bubble p{margin:0 0 6px}.bubble p:last-child{margin:0}
.bubble b{color:var(--aina-2)}
.who{display:block;font:800 12px var(--display);letter-spacing:.4px;color:var(--aina-2);margin-bottom:2px;text-transform:uppercase}
.say.guest .bubble{border-color:#b9dbe3;background:#f3fbfd}
.say.guest .who{color:#2b8aa3}
.me{align-self:flex-end;max-width:80%;background:#fff1e2;border:2px solid #f5c79e;border-radius:18px 18px 4px 18px;padding:10px 14px;font-weight:800;font-size:18px}
.me.no{background:#fdeceb;border-color:#f0b2ac}
.me .kk{font-size:19px}
.cur{display:inline-block;width:2px;height:1em;background:var(--aina-2);vertical-align:-2px;margin-left:1px;animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.2}}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#b8a983;animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{50%{transform:translateY(-4px);opacity:.5}}
.kk{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.2px;color:var(--ink)}
[data-say]{cursor:pointer}
.lego{display:inline-flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.12);vertical-align:middle;margin:2px 0}
.lego span{padding:5px 9px;font-family:var(--display);font-weight:700;font-size:19px}
.lego .r{background:#efe6d2;color:var(--ink)}
.lego .t{color:#fff}
.lego .t.h{background:var(--hard)} .lego .t.s{background:var(--soft)} .lego .t.q{background:#c9bea6;color:var(--ink)}
.ex{display:flex;flex-direction:column;gap:2px;background:#f7f0e0;border-radius:12px;padding:8px 10px;margin-top:6px}
.ex .ru{font-weight:700;color:var(--muted);font-size:15px}
.ex.saying,[data-auto].saying,.model.saying,.flmod.saying{box-shadow:0 0 0 3px #ffc58f;transition:box-shadow .2s}.spk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ffe3cc;font-size:15px;vertical-align:middle;margin-left:4px}
.voice{display:flex;align-items:center;gap:10px;background:#fff1e2;border:2px solid #f5c79e;border-radius:99px;padding:6px 14px 6px 6px;width:max-content;max-width:100%;margin-top:6px;color:var(--ink)}
.voice .pl{width:38px;height:38px;border-radius:50%;background:var(--aina);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.voice .wv{display:flex;gap:3px;align-items:center;height:24px}
.voice .wv i{width:3px;border-radius:2px;background:var(--aina-2);opacity:.7}
.voice.on .wv i{animation:wv .5s ease-in-out infinite alternate}
.voice .wv i:nth-child(2n){animation-delay:.12s}.voice .wv i:nth-child(3n){animation-delay:.25s}
@keyframes wv{to{transform:scaleY(.4)}}
.task{background:#fff;border:2px solid var(--aina);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.task .q{font-weight:800;line-height:1.4}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:#fff;color:var(--ink);border:2px solid #e0d2b3;box-shadow:0 4px 0 #e0d2b3;padding:12px 16px;font-size:18px;min-width:80px}
.opt.kkopt{font-family:var(--display);font-weight:700;font-size:19px}
.opt .peek{display:block;font:700 14px var(--body);color:var(--muted);margin-top:3px}
.opt.sel{border-color:var(--aina);box-shadow:0 4px 0 var(--aina)}
.opt.wrong{background:#fdeceb;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt.right{background:#e3f7ec;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt:disabled{cursor:default}
.opt.tail{font-family:var(--display);font-weight:700;font-size:20px;color:#fff;border:0}
.opt.tail.h{background:var(--hard);box-shadow:0 4px 0 #1f4f9e}
.opt.tail.s{background:var(--soft);box-shadow:0 4px 0 #a83a72}
.opt.tail.none{background:#fff;color:var(--ink);border:2.5px dashed #b8a983;box-shadow:0 4px 0 #e0d2b3}
.opt.tail.wrong{outline:3px solid var(--bad)} .opt.tail.right{outline:3px solid var(--ok)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.go{background:var(--aina);color:#fff;padding:15px;box-shadow:0 5px 0 var(--aina-2);font-size:18px}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--aina-2)}
.go:disabled{background:#d9cdb3;box-shadow:0 5px 0 #c2b496;cursor:default}
.ghost{background:transparent;color:var(--muted);padding:10px;font-size:16px}
/* сборка из деталей — «пишешь сообщение» */
.compose{display:flex;gap:8px;align-items:center}
.line{flex:1;min-width:0;min-height:52px;border:2px dashed #e0d2b3;border-radius:16px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fffdf7}
.line:empty::before{content:'Жми на детали…';color:#b8a983;font-weight:700;font-size:15px;padding-left:4px}
.send{flex:none;width:52px;height:52px;border-radius:50%;background:var(--aina);color:#fff;font-size:22px;box-shadow:0 4px 0 var(--aina-2)}
.send:disabled{background:#d9cdb3;box-shadow:0 4px 0 #c2b496;cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.cube{font-family:var(--display);font-weight:700;font-size:19px;padding:9px 13px;border-radius:12px;background:#efe6d2;color:var(--ink);box-shadow:0 4px 0 #d6c9ab}
.cube.h{background:var(--hard);color:#fff;box-shadow:0 4px 0 #1f4f9e}
.cube.s{background:var(--soft);color:#fff;box-shadow:0 4px 0 #a83a72}
.cube.c{background:#ffd200;color:#5a4300;box-shadow:0 4px 0 #c9a200}
.lego .t.c{background:#ffd200;color:#5a4300;margin:0 4px;border-radius:8px;padding-left:9px;padding-right:9px}
.cube.used{visibility:hidden}
.line .cube{font-size:17px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.grp{display:inline-flex;align-items:center;white-space:nowrap}
.line .cube.sfx{margin-left:0;border-radius:0 12px 12px 0}
.line .cube.pre{border-radius:12px 0 0 12px}
.nameinp{flex:1;min-width:0;font:700 19px var(--display);padding:12px 14px;border-radius:16px;border:2px solid #e0d2b3;background:#fffdf7;color:var(--ink)}
.final{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.reward{display:flex;gap:8px;align-items:center;font-weight:800;font-size:20px;background:#fff3d6;border-radius:99px;padding:8px 16px;color:var(--ink)}
.stars{font-size:34px;letter-spacing:4px;color:#d9cdb3}.stars b{color:var(--gold)}
.duo{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.note{font-size:13px;color:#8fb0c2;text-align:center;margin:0}
.node.fast{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #b5850f;animation:bob 2.4s ease-in-out infinite}
.node.boss{background:#8e5bd6;color:#fff;box-shadow:0 6px 0 #6439a3;animation:bob 2.4s ease-in-out infinite}
.drill{background:var(--card);color:var(--ink);border-radius:24px;padding:16px 14px 20px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.dtop{display:flex;align-items:center;gap:12px}
.dtop .dsay{flex:1;min-width:0;font-weight:800;line-height:1.35;min-height:2.7em;display:flex;align-items:center}
.combo{font-family:var(--display);font-weight:800;color:#e0662a;font-size:18px;white-space:nowrap}
.dcard{background:#fff;border:2px solid #e3d3ad;border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .2s,border-color .2s}
.dcard.ok{background:#e3f7ec;border-color:var(--ok)} .dcard.no{background:#fdeceb;border-color:var(--bad)}
.dcard .ru{color:var(--muted);font-weight:700}
.dcard .big{font-size:24px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.dcard .lego span{font-size:24px;padding:6px 12px}
.dopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.dopts .opt.tail{min-height:58px;font-size:22px}
.correct{font-weight:800;color:var(--bad);min-height:1.4em;text-align:center}

/* роботы */
.rbt *{transform-box:fill-box}
.rbt .body{transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2px)}}
.rbt .eyes{transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.rbt .ant{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{fill:#ffd26b}}
.rbt .shine{animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-40px);opacity:0}70%{opacity:.8}100%{transform:translateX(40px);opacity:0}}
.rbt.talk .mouth{transform-origin:center;animation:talk .18s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(.35)}}
.rbt.jump{animation:jump .7s ease-out}
@keyframes jump{30%{transform:translateY(-16px) rotate(-5deg)}60%{transform:none}80%{transform:translateY(-6px) rotate(3deg)}100%{transform:none}}
.rbt.shake{animation:rshake .5s}
@keyframes rshake{20%,60%{transform:translateX(-5px) rotate(-3deg)}40%,80%{transform:translateX(5px) rotate(3deg)}}
.rbt .smoke{opacity:0}
.rbt.m-dizzy .smoke{animation:smoke 1.4s ease-out}
@keyframes smoke{0%{opacity:.9;transform:translateY(4px) scale(.5)}100%{opacity:0;transform:translateY(-20px) scale(1.5)}}
.rbt.m-laugh .body{animation:laugh .26s ease-in-out infinite alternate}
@keyframes laugh{to{transform:translateY(-3px) rotate(2deg)}}
.rbt.m-wink .body{animation:tilt 2.6s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-7deg)}}
.rbt.dance .body{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-6px)}}
/* огонёк Шырақа: живёт вместе с настроением */
.rbt .flame{transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.94,1.08) rotate(2deg)}}
.rbt .halo{transform-origin:center;animation:halo 1.8s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.12);opacity:.55}}
.rbt.f-big .flame{animation:flickbig .35s ease-in-out infinite alternate}
@keyframes flickbig{0%{transform:scale(1.25,1.25) rotate(-4deg)}100%{transform:scale(1.15,1.45) rotate(4deg)}}
.rbt.f-big .halo{opacity:.9;animation:halobig .5s ease-in-out infinite alternate}
@keyframes halobig{from{transform:scale(1.3)}to{transform:scale(1.7)}}
.rbt.f-dim .flame{animation:none;transform:scale(.62);opacity:.75}
.rbt.f-dim .halo{opacity:0;animation:none}
.rbt .chest{animation:chest 1.8s ease-in-out infinite}
@keyframes chest{50%{opacity:.55}}
.rbt.f-dim .chest{opacity:.3;animation:none}
/* карта островов и остров — как у Атласа */
.map{position:relative;background:linear-gradient(180deg,var(--sky-2),var(--sky));border-radius:22px;padding:8px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.isl.open{cursor:pointer}
.isl.open .land{animation:bob 2.4s ease-in-out infinite}
.legend2{display:flex;flex-direction:column;gap:8px}
.leg{display:flex;gap:10px;align-items:center;background:var(--sky-2);border-radius:14px;padding:10px 12px;color:#d3e4ee}
.leg b{font-family:var(--display);font-weight:800;font-size:15px}
.leg span{color:#9fbcc3;font-size:14px}
.leg .n{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--lock);color:var(--sky);font-weight:800}
.leg.on .n{background:var(--aina);color:#fff}
.leg.on{outline:2px solid var(--aina);cursor:pointer}
.ttl{background:transparent;color:#b9d3d6;font-size:14px;padding:6px 0 0;text-decoration:underline dotted;text-underline-offset:3px;text-align:left}
.chips{display:flex;gap:4px;justify-content:center;align-items:center;color:#b9d3d6;font-size:14px;flex-wrap:wrap}
.chip{width:15px;height:12px;border-radius:3px;background:var(--sky-2);border:1px solid #2c6e88}
.chip.on{background:var(--sand);border-color:#e3bf78}
.papa{background:#fff3d6;border-radius:14px;padding:12px 14px;line-height:1.45;text-align:left;width:100%;box-sizing:border-box;color:var(--ink)}
.papa b{display:block;margin-bottom:4px}.papa p{margin:0;font-weight:600}
.endsay{margin:0;font-weight:700;line-height:1.45}
.notes{background:var(--sky-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.notes b{font-family:var(--display);font-weight:800}.notes p{margin:0;color:#dbeceb;line-height:1.45}.notes .kk{color:var(--sand)}
.lesson .opts .opt.sel{border-color:var(--aina);box-shadow:0 4px 0 var(--aina)}
/* кнопки-хвостики: строго по центру, без обрезки (автоподгонка шрифта в JS) */
.opt.tail{display:inline-flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;padding:12px 10px;min-width:0}
.dopts .opt.tail{padding:8px 4px}
.cube{white-space:nowrap}
.fbbtn{align-self:center;margin:6px 0 2px;padding:12px 20px;border-radius:16px;background:#ffd84d;color:#3a2a00;font:800 16px var(--body);box-shadow:0 4px 0 #c9a21e}
.cbot.nb{-webkit-text-size-adjust:100%;text-size-adjust:100%;display:block;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18)}
.nbprog{display:flex;justify-content:space-between;gap:8px;font:800 clamp(10px,3vw,12px) var(--body);color:#3d5566;margin:0 4px 5px;white-space:nowrap}.nbprog span{overflow:hidden;text-overflow:ellipsis}
.nbbar{height:8px;border-radius:99px;background:#e3ebef;margin:0 4px 8px;overflow:hidden}.nbbar i{display:block;height:100%;background:linear-gradient(90deg,#2fbf7f,#7ddc5a);border-radius:99px;transition:width .6s}
.nbrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.5fr) repeat(2,minmax(0,1fr));gap:5px;align-items:stretch}
.nbi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 clamp(10px,2.8vw,12px) var(--body);padding:6px 0 5px;line-height:1.1;border-radius:16px;color:#fff;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.18);margin-bottom:4px;min-width:0}
.nbi .em{font-size:22px;line-height:1.1}.nbi>span:not(.em):not(.nbdot),.nbi{white-space:nowrap}.nbi small{max-width:100%;overflow:hidden;text-overflow:ellipsis;font:700 clamp(9px,2.5vw,11px) var(--body);color:rgba(255,255,255,.92);margin-top:1px;white-space:nowrap}
.nbi:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.nbi[data-a=lessons]{background:#4f8ff7}.nbi[data-a=zones]{background:#9b6bf2}.nbi[data-a=shop]{background:#ffb020}.nbi[data-a=me]{background:#ff6fa6}

function splitHtml(html){var d=document.createElement('div');d.innerHTML=html;if((d.textContent||'').length<170)return [html];var ch=[],cur=[],len=0;

    if(sleepy){var av=row.querySelector('.av');av.innerHTML=b.draw(mood,58,curO());svg=av.querySelector('.rbt')}
    bub.innerHTML=html;svg.classList.add('talk');sBloop();try{if(ruFind(html).length){bub.dataset.ru=html;ruSay(html)}}catch(e){}
    var nodes=[],w=document.createTreeWalker(bub,NodeFilter.SHOW_TEXT,null);while(w.nextNode())if(!w.currentNode.parentNode.closest('.who'))nodes.push(w.currentNode);
    var full=nodes.map(function(n){var t=n.nodeValue;n.nodeValue='';return t});
    var ni=0,ci=0,cur=document.createElement('span');cur.className='cur';
    var skip=false;bub.addEventListener('click',function(){skip=true});
    (function tick(){if(my!==run)return;
      if(skip){nodes.forEach(function(n,i){n.nodeValue=full[i]});ni=nodes.length}
      if(ni>=nodes.length){svg.classList.remove('talk');if(cur.parentNode)cur.remove();busy=false;scrollEnd();
        var AE=[].slice.call(bub.querySelectorAll('[data-auto],.model,.flmod'+(ak?',.kk,.lego':''))).filter(function(e){if(e.matches('.kk,.lego')&&!e.matches('[data-auto]')&&e.parentElement&&e.parentElement.closest('[data-auto],.model,.flmod,.kk,.lego,.ru,.task,.opts'))return false; /* v180: в объяснениях звучит весь казахский */ if(!e.dataset.auto)e.dataset.auto=modelSay(e);return e.dataset.auto&&canSay(e.dataset.auto)}),au=AE.map(function(e){return e.dataset.auto});ruAfter(function(){(function nx(i){if(i>=au.length||my!==run)return;var e=AE[i];if(e)e.classList.add('saying');say(au[i],function(){if(e)e.classList.remove('saying');setTimeout(function(){nx(i+1)},380)})})(0)}); /* v116: все примеры по очереди; v197: после русской реплики */
        done&&done(bub);return}

TownPainter.prototype.person=function(x,y,shirt,hair,t,still){var X=this;x=Math.round(x);y=Math.round(y);var f=still?0:Math.floor((t||0)*6)%2;
  X.r(x,y,3,1,hair||'hair',true);X.r(x,y+1,3,2,'skin',true);X.p(x+1,y+2,'ink',true);X.r(x,y+3,3,2,TC[shirt]||shirt,true);X.p(x+(f?0:2),y+5,'ink',true);X.p(x+(f?2:0),y+5,'ink',true);X.p(x+(f?0:2),y+6,'ink',true);X.p(x+(f?2:0),y+6,'ink',true)};
TownPainter.prototype.aina=function(x,y){var X=this;x=Math.round(x);y=Math.round(y);X.p(x+2,y-2,'roof',true);X.p(x+2,y-1,'grey',true);X.r(x,y,5,4,'#e9eef0',true);X.r(x+1,y+1,3,2,'#bfe3ea',true);X.p(x+1,y+1,'ink',true);X.p(x+3,y+1,'ink',true);X.r(x+1,y+4,3,2,'roof',true);X.p(x+1,y+6,'grey',true);X.p(x+3,y+6,'grey',true)};
TownPainter.prototype.frame=function(dt){var X=this;this.t+=dt;this.awake=city().awake;var t=this.t;
  this.ground();
  var self=this;BLD.forEach(function(b){var an=self.anim&&self.anim.id===b.id?self.anim:null;
    if(isBuilt(b.id)&&!an){self.keep=!self.awake;self.bld(b.id);self.keep=false}
    else if(an){var k=Math.min(1,an.t/1.3);if(k<.75){self.plot(b);for(var i=b.x+3;i<b.x+b.w-3;i+=5){X.r(i,b.y+b.h-2-Math.round((b.h-4)*k/.75),1,Math.round((b.h-4)*k/.75),'wood',true)}X.r(b.x+2,b.y+b.h-2-Math.round((b.h-4)*k/.75),b.w-4,1,'wood2',true)}
      else{self.keep=true;self.bld(b.id);self.keep=false}an.t+=dt;if(an.t>1.6){self.anim=null;an.done&&an.done()}}
    else self.plot(b)});
  /* жители у построек (стоят, пока город спит) */
  BLD.forEach(function(b){if(!isBuilt(b.id)||(self.anim&&self.anim.id===b.id))return;var m=b.man,bob=Math.round(Math.sin(t*3+b.x)*.4);
    if(m.aina)self.aina(m.x-2,m.y-7+bob);else if(b.id!=='stadion'||!self.awake)self.person(m.x-1,m.y-7+bob,m.shirt,m.hair,t,true)});
  if(this.awake){
    if(!this.walkers.length){var cols=['blue','red','pink','roof','leaf2','flag'];for(var i=0;i<6;i++)this.walkers.push({x:20+i*20,y:i%2?58:57,v:(i%2?1:-1)*(5+i%3*2),c:cols[i]});
      this.cars=[{x:10,v:18,c:'red'},{x:120,v:-14,c:'flag'}];this.birds=[{x:20,y:12,v:9},{x:30,y:16,v:9},{x:140,y:20,v:-7}];}
    this.walkers.forEach(function(w){w.x+=w.v*dt;if(w.x<18||w.x>140)w.v=-w.v;self.person(w.x,w.y-6,w.c,'hair',t)});
    this.cars.forEach(function(c){c.x+=c.v*dt;if(c.x>150)c.x=10;if(c.x<10)c.x=150;var x=Math.round(c.x);X.r(x,60,7,3,c.c,true);X.r(x+1,59,4,1,c.c,true);X.r(x+2,59,2,1,'water2',true);X.p(x+1,63,'ink',true);X.p(x+5,63,'ink',true)});
    this.birds.forEach(function(b){b.x+=b.v*dt;if(b.x>170)b.x=-10;if(b.x<-10)b.x=170;var f=Math.floor(t*5)%2;X.p(b.x|0,b.y,'ink',true);X.p((b.x|0)+1,b.y+(f?1:-1),'ink',true);X.p((b.x|0)-1,b.y+(f?1:-1),'ink',true)});
  }else{
    /* облако сна над островом */
    var ox=Math.sin(t*.3)*4;[[60,14,10],[74,10,12],[90,13,11],[104,16,8],[48,18,7]].forEach(function(c){for(var i=-c[2];i<=c[2];i++)for(var j=-c[2];j<=c[2];j++)if(i*i+Math.pow(j*1.5,2)<c[2]*c[2])X.p(c[0]+i+ox,c[1]+j,'#9fb1ba',true)});
    if(Math.floor(t*1.5)%2)X.p(98+ox,4,'white',true);X.p(101+ox,2,'white',true);
  }
  /* облака днём */
  if(this.awake){for(var k=0;k<3;k++){var cx=((t*3+k*60)%200)-20,cy=8+k*5;X.r(cx,cy,12,3,'white',true);X.r(cx+3,cy-2,6,2,'white',true)}}
  /* искры и пыль */
  this.fx=this.fx.filter(function(f){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=30*dt;f.l-=dt;if(f.l>0)X.p(f.x,f.y,f.c,true);return f.l>0});
};
TownPainter.prototype.burst=function(b,n){for(var i=0;i<(n||30);i++){var a=Math.random()*Math.PI*2,s=10+Math.random()*30;this.fx.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-15,l:.6+Math.random()*.6,c:Math.random()<.5?'#ffd76a':(Math.random()<.5?'#ffffff':'#c9d3d6')})}};

  TOWN.raf=requestAnimationFrame(townLoop)}

     '<path d="M'+(cx-ow*.5)+' '+(cy-u*.3)+' q'+(ow*.25)+' -'+(u*.18)+' '+(ow*.18)+' '+(u*.02)+' q-'+(ow*.08)+' '+(u*.1)+' -'+(ow*.18)+' 0 M'+(cx+ow*.5)+' '+(cy-u*.3)+' q-'+(ow*.25)+' -'+(u*.18)+' -'+(ow*.18)+' '+(u*.02)+' q'+(ow*.08)+' '+(u*.1)+' '+(ow*.18)+' 0'+
     ' M'+(cx-ow*.5)+' '+(cy+u*.3)+' q'+(ow*.25)+' '+(u*.18)+' '+(ow*.18)+' -'+(u*.02)+' q-'+(ow*.08)+' -'+(u*.1)+' -'+(ow*.18)+' 0 M'+(cx+ow*.5)+' '+(cy+u*.3)+' q-'+(ow*.25)+' '+(u*.18)+' -'+(ow*.18)+' -'+(u*.02)+' q'+(ow*.08)+' -'+(u*.1)+' '+(ow*.18)+' 0" fill="none" stroke="'+G+'" stroke-width="'+(w*.007)+'"/>'+
     '<circle cx="'+cx+'" cy="'+cy+'" r="'+(ow*.12)+'" fill="'+G+'"/>'}
  /* солнце: диск и 32 луча */
  var sx=x+w*.52,sy=y+h*.4,r0=h*.155,r1=h*.18,r2=h*.27;

ің':'сың';case 'Сіз':return soft?'сіз':'сыз';case 'Сендер':return soft?'сіңдер':'сыңдар';case 'Сіздер':return soft?'сіздер':'сыздар';default:return ''}}\nconst NONE='∅',isSoft=t=>/[әеіөү]/.test(t);\nconst TAILP={};Object.keys(PERS).forEach(q=>['бала','суретші','дос','қыз','ұстаз','дәрігер','әнші','қонақ'].forEach(w=>{TAILP[tailOf(q,w)]=q}));\nconst FILLC=['#ffc928','#4cc96a','#9b6bff','#22c4c9','#7ed957'];\nconst COLS=8,ROUND=60,SOFT=true,BOOST={bomb:5,shield:5,hint:3,slow:3};\n/* ---------- хранилище ---------- */\nfunction lg(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}function ls(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}\nlet COINS=0;let SOUND=!(P&&P.st&&P.st.mute);\n/* ---------- звуки (синтез) ---------- */\nlet AC=null;function ac(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return AC}\nfunction tone(f1,f2,d,type,vol,dl){if(!SOUND)return;const a=ac();if(!a)return;try{const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}\nconst SFX={thud:()=>tone(150,70,.08,'triangle',.05),good:()=>{tone(660,990,.1,'triangle',.07);tone(990,1320,.12,'triangle',.06,.08)},boom:()=>{tone(320,60,.3,'sawtooth',.05);tone(1300,400,.2,'triangle',.04)},\n bad:()=>{tone(190,150,.18,'square',.035);tone(200,160,.12,'square',.03,.2)},tick:()=>tone(1300,900,.04,'triangle',.03),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.2,'triangle',.07,i*.12)),lose:()=>[523,440,349,262].forEach((f,i)=>tone(f,f*.98,.25,'triangle',.07,i*.18)),power:()=>{tone(400,1200,.25,'sine',.06)}};\n/* ---------- музыка (World of Games, по кругу) ---------- */\nlet MBUF=null,MSRC=null,MGAIN=null,mload=null;\nfunction loadMusic(){const a=ac();if(!a||mload)return mload;mload=fetch('game_music.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>a.decodeAudioData(b,res,rej))).then(b=>{MBUF=b}).catch(()=>{});return mload}\nasync function startMusic(){if(!SOUND)return;const a=ac();if(!a)return;try{if(a.state==='suspended')await a.resume()}catch(e){}await loadMusic();if(!MBUF||!SOUND||MSRC)return;\n try{MGAIN=a.createGain();MGAIN.gain.setValueAtTime(.0001,a.currentTime);MGAIN.gain.exponentialRampToValueAtTime(.32,a.currentTime+.8);MSRC=a.createBufferSource();MSRC.buffer=MBUF;MSRC.loop=true;MSRC.connect(MGAIN);MGAIN.connect(a.destination);MSRC.start()}catch(e){}}\nfunction stopMusic(fade){const a=AC;if(!MSRC||!a)return;const s=MSRC,g=MGAIN;MSRC=null;try{g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(Math.max(.0001,g.gain.value),a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(fade||.15));s.stop(a.currentTime+(fade||.15)+.05)}catch(e){}}\n/* ---------- голос (kk22) ---------- */\nfunction loadVoice(){}\nfunction sayPhrase(list){return new Promise(res=>{let fin=false;const ok=()=>{if(fin)return;fin=true;try{if(MGAIN&&AC)MGAIN.gain.setTargetAtTime(.32,AC.currentTime,.2)}catch(e){}res()};\n try{if(!SOUND||!P||!P.say){setTimeout(ok,200);return}if(MGAIN&&AC)MGAIN.gain.setTargetAtTime(.1,AC.currentTime,.05);P.say(list.join(' '),ok);setTimeout(ok,4000)}catch(e){ok()}})}\n/* ---------- состояние ---------- */\nlet cell=40,ROWS=12,grid=[],blocks=[],BID=0,shelf=[],TID=0,sel=null,score=0,combo=0,mist=0,got=[],running=false,t0=0,tPaused=0,lastT=0,nextPh=0,nextF=0,raf=0,shield=false,slowUntil=0,free={},lastP='';\nconst elapsed=()=>(performance.now()-t0)/1000,prog=()=>Math.min(1,elapsed()/ROUND);\nlet slowMode=false;function speedMul(){return .8}\n/* ---------- разметка доски ---------- */\nfunction layout(){const bw=$('bw'),W=bw.clientWidth;cell=Math.floor(W/COLS);document.documentElement.style.setProperty('--cell',cell+'px');$('shelf').style.width=cell*COLS+'px';const H=bw.clientHeight;let best=cell,bl=1e9;for(let c=cell;c>=cell-5&&c>=24;c--){const r=Math.floor(H/c);if(r<8)continue;const left=H-r*c+(cell-c)*2;if(left<bl){bl=left;best=c}}cell=best;ROWS=Math.max(8,Math.floor(H/cell));if(ROWS*cell>H)cell=Math.floor(H/ROWS);document.documentElement.style.setProperty('--cell',cell+'px');$('shelf').style.width=cell*COLS+'px'\n const b=$('board');b.style.width=cell*COLS+'px';b.style.height=cell*ROWS+'px';document.documentElement.style.setProperty('--cell',cell+'px');\n $('edge').style.bottom=(ROWS-1)*cell+'px'}\nfunction supBelow(c,row){for(let r=row-1;r>=0;r--)if(grid[r]&&grid[r][c])return r+1;return 0}\nfunction topUnder(c,y){for(let r=Math.min(ROWS-1,Math.floor((y+0.5)/cell));r>=0;r--)if(grid[r]&&grid[r][c]&&(r+1)*cell<=y+0.5)return (r+1)*cell;return 0}\nfunction colH(c){for(let r=ROWS-1;r>=0;r--)if(grid[r]&&grid[r][c])return r+1;return 0}\nfunction mark(b,v){for(let k=0;k<b.w;k++){(grid[b.row]=grid[b.row]||[])[b.c+k]=v?b.id:null}}\n/* ---------- кубики ---------- */\nconst measure=(()=>{const cv=document.createElement('canvas').getContext('2d');return t=>{cv.font='800 16px Rubik, Arial';return cv.measureText(t).width}})();\nlet lastF='';function mkPhrase(){let it;const live=PRIO.filter(f=>ITEMS.some(x=>x.full===f));if(live.length&&Math.random()<.5){const f=live[0];PRIO.splice(PRIO.indexOf(f),1);it=ITEMS.find(x=>x.full===f)}\n else{let k=0;do{it=pick(ITEMS)}while((it.full===lastF||it.a&&it.a===lastP&&ITEMS.length>6&&Math.random()<.5)&&k++<8)}lastF=it.full;lastP=it.a;\n const cw=t=>Math.max(2,Math.min(4,Math.ceil((measure(t)+16)/cell)));const ac=it.a?2:0;let wc=cw(it.w),pc=it.post?cw(it.post):0;while(ac+wc+2+pc>COLS){if(pc>wc&&pc>2)pc--;else if(wc>2)wc--;else if(pc>2)pc--;else break}\n return {id:++BID,t:'ph',it,p:it.a,wd:it.w,post:it.post||'',ru:it.ru,wc,pc,ac,w_:ac+wc+2+pc,done:false}}\nfunction el(b){const e=document.createElement('div');b.el=e;\n if(b.t==='f'){e.className='bk f fall';e.style.background=`linear-gradient(180deg,${b.col},${b.col}cc)`;e.style.boxShadow=`inset 0 -4px 0 #0003,inset 0 2px 0 #ffffff80,0 0 10px ${b.col}66`}\n else{e.className='bk ph';const W=n=>`width:${n*cell-2}px`;e.innerHTML=(b.ac?`<span class=\"p\" style=\"${W(2)}\">${b.p}<\/span>`:\"\")+`<span class=\"w\" style=\"${W(b.wc)}\">${b.wd}<\/span><span class=\"q\" style=\"${W(2)}\">?<\/span>`+(b.pc?`<span class=\"w\" style=\"${W(b.pc)}\">${b.post}<\/span>`:\"\");\n  e.onclick=()=>{if(!running)return;sel=sel===b.id?null:b.id;mk();SFX.tick()}}\n e.style.left=(b.c*cell+1)+'px';e.style.width=(b.w*cell-2)+'px';$('board').appendChild(e);fitText(e)}\nfunction fitText(e){e.querySelectorAll('span').forEach(sp=>{let f=16;sp.style.fontSize=f+'px';while(sp.scrollWidth>sp.clientWidth+1&&f>10){f-=1;sp.style.fontSize=f+'px'}})}\nfunction topFree(c,w){for(const b of blocks)if(b.falling&&b.c<c+w&&c<b.c+b.w&&b.y>(ROWS-3)*cell)return false;for(let k=0;k<w;k++)if(colH(c+k)>=ROWS-1)return false;return true}\nfunction spawnPhrase(){const ph=mkPhrase();ph.w=ph.w_;const opts=[];for(let c=0;c+ph.w<=COLS;c++){if(!topFree(c,ph.w))continue;let h=0;for(let k=0;k<ph.w;k++)h=Math.max(h,colH(c+k));opts.push([h,c])}\n if(!opts.length){let mx=0;for(let c=0;c<COLS;c++)mx=Math.max(mx,colH(c));return false}opts.sort((a,b)=>a[0]-b[0]);const [,c]=pick(opts.slice(0,3));Object.assign(ph,{c,y:(ROWS-1)*cell,falling:true,v:42+40*prog()});blocks.push(ph);el(ph);fillShelf();mk();return true}\nfunction spawnFill(fast){const cs=[];for(let c=0;c<COLS;c++){if(!topFree(c,1))continue;const h=colH(c);cs.push([h,c])}\n if(!cs.length)return;cs.sort((a,b)=>a[0]-b[0]);const [,c]=Math.random()<.6?pick(cs.slice(0,Math.max(2,cs.length>>1))):pick(cs);\n const b={id:++BID,t:'f',c,w:1,y:(ROWS-1)*cell,falling:true,v:(fast?260:55+Math.random()*130),col:pick(FILLC)};blocks.push(b);el(b)}\n/* ---------- физика ---------- */\nfunction physics(dt){const m=speedMul();const fall=blocks.filter(b=>b.falling).sort((a,b)=>a.y-b.y),done=[];\n for(const b of fall){let land=0;for(let k=0;k<b.w;k++)land=Math.max(land,topUnder(b.c+k,b.y));let rest=land;\n  for(const o of done)if(o.falling&&o.c<b.c+b.w&&b.c<o.c+o.w&&o.y<b.y)rest=Math.max(rest,o.y+cell);\n  b.y-=b.v*(b.fastFall?1:m)*dt;\n  if(b.y<=rest){b.y=rest;if(rest===land){b.falling=false;b.row=Math.round(land/cell);b.y=b.row*cell;mark(b,true);b.el.classList.remove('fall');if(!b.fastFall)SFX.thud();b.fastFall=false;\n   if(b.row>=ROWS-1&&!SOFT){end(false);return}}}\n  done.push(b)}\n for(const b of blocks)if(b.el)b.el.style.bottom=(b.y+1)+'px';\n let mx=0;for(let c=0;c<COLS;c++)mx=Math.max(mx,colH(c));$('edge').classList.toggle('warn',mx>=ROWS-3);$('frame').classList.toggle('danger',mx>=ROWS-2)}\nfunction gravity(){/* всё, что висит, проваливается вниз до опоры */\n const settled=blocks.filter(b=>!b.falling).sort((a,b)=>a.row-b.row);settled.forEach(b=>mark(b,false));let any=false;\n for(const b of settled){let sup=0;for(let k=0;k<b.w;k++)sup=Math.max(sup,supBelow(b.c+k,b.row));\n  if(sup<b.row){b.falling=true;b.fastFall=true;b.v=650;b.el.classList.add('fall');any=true}else mark(b,true)}\n return any}\n/* ---------- полочка ---------- */\nconst phrases=()=>blocks.filter(b=>b.t==='ph'&&!b.done).sort((a,b)=>a.y-b.y);\nfunction target(){const ps=phrases();return ps.find(b=>b.id===sel)||ps[0]}\nfunction needOf(b){return b.it.need||NONE}\nfunction tailsAll(){return TAILS.map(t=>t||NONE)}\nconst ALLT=tailsAll();\nfunction similar(t){/* «похожие» хвостики-ловушки */return ALLT.filter(x=>x!==t&&(x===NONE||t===NONE||x.slice(-2)===t.slice(-2)||x[0]===t[0]||isSoft(x)!==isSoft(t)&&x.length===t.length))}\nfunction fillShelf(){const need=[...new Set(phrases().slice(0,SH).map(needOf))];while(shelf.length<SH)shelf.push(null);\n for(const t of need){if(shelf.some(x=>x&&x.t===t))continue;let j=shelf.findIndex(x=>!x);if(j<0)j=shelf.findIndex(x=>!need.includes(x.t));if(j>=0)shelf[j]={id:++TID,t,fresh:1}}\n for(let i=0;i<SH;i++)if(!shelf[i]){const base=need.length?pick(need):pick(ALLT);let pool=simil
